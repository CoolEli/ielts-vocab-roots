"赞美；钦佩；仰慕", "ids": ["20|前缀|-ad-|admire|0"]}, "surprising": {"w": "surprising", "p": "adj.", "z": "令人惊讶的；出人意料的", "ids": ["20|前缀|-sur-|surprising|0"]}, "biorhythm": {"w": "biorhythm", "p": "n.", "z": "生物节律", "ids": ["20|前缀|-bi-|biorhythm|0"]}, "prominent": {"w": "prominent", "p": "adj.", "z": "突出的；显著的；重要的；杰出的", "ids": ["20|前缀|-pro-|prominent|0"]}, "precaution": {"w": "precaution", "p": "n.", "z": "预防；警惕；预防措施", "ids": ["20|前缀|-pre-|precaution|0"]}, "agony": {"w": "agony", "p": "n.", "z": "极度的痛苦；挣扎", "ids": ["20|后缀|-y|agony|0"]}, "allergy": {"w": "allergy", "p": "n.", "z": "敏感症；过敏性", "ids": ["20|后缀|-y|allergy|1"]}, "arbitrary": {"w": "arbitrary", "p": "adj.", "z": "武断的；专断的；任意的", "ids": ["20|后缀|-y|arbitrary|3"]}, "artery": {"w": "artery", "p": "n.", "z": "动脉；干线", "ids": ["20|后缀|-y|artery|4"]}, "dizzy": {"w": "dizzy", "p": "adj./v.", "z": "头晕目眩的；眩晕的/使眩晕", "ids": ["20|后缀|-y|dizzy|7"]}, "envy": {"w": "envy", "p": "n./v.", "z": "羡慕；嫉妒", "ids": ["20|后缀|-y|envy|8"]}, "gloomy": {"w": "gloomy", "p": "adj.", "z": "幽暗的；令人沮丧的", "ids": ["20|后缀|-y|gloomy|10"]}, "merry": {"w": "merry", "p": "adj.", "z": "愉快的；欢乐的；微醉的", "ids": ["20|后缀|-y|merry|14"]}}}, {"id": "p25", "theme": "身心健康", "part": 2, "parts": 3, "title": "Written on the Body", "subtitle": "How emotions shape our faces, our hormones and our experience of pain", "paras": ["In 1872 Charles Darwin published The Expression of the Emotions in Man and Animals, a book that set out to show how feelings leave visible marks on the body. Darwin observed his own children closely, noting how a [[naughty|naughty]] toddler would lower its [[chin|chin]] and avoid eye contact, and how an [[ashamed|ashamed]] adult blushed until the colour spread from the [[cheek|cheek]] to the neck. Anger, he wrote, creased the [[brow|brow]] into a [[frown|frown]] and tightened the hand into a [[fist|fist]]. His central claim was that such signals are inherited rather than learned, and that they form part of human [[character|character]] across every culture.", "A century later, the American psychologist Paul Ekman put this idea to the test. Showing photographs to members of an isolated community in Papua New Guinea, he found that people with no exposure to Western media could readily tell a [[furious|furious]] face from a [[miserable|miserable]] or an [[agreeable|agreeable]] one. Ekman also distinguished the [[spontaneous|spontaneous]] smile, which narrows the eyes, from the polite version produced on request. Even the most [[cunning|cunning]] liar, he argued, finds the genuine expression hard to fake, which helps explain why we judge some faces as [[trustworthy|trustworthy]] within a fraction of a second. Facial cues are not the only evidence: [[aural|aural]] signals such as a trembling voice matter too, and a person who is struck [[dumb|dumb]] by shock communicates a great deal without words. Interestingly, observers find men with a thick [[beard|beard]] harder to read, because the lower half of the face is concealed rather than [[bare|bare]].", "Beneath these outward signs lies a chemical system. When the brain detects a threat, the adrenal [[gland|gland]] releases the [[hormone|hormone]] cortisol, the heart pounds in the [[chest|chest]] and breathing quickens. In short bursts this response is useful. Sustained over months of [[hectic|hectic]] work and family pressure, however, it leaves people [[weary|weary]] and prone to [[fatigue|fatigue]], [[headache|headache]] and disturbed sleep. Some feel [[faint|faint]] or seem to [[choke|choke]] when anxious. Researchers at Kyoto University have also linked high long-term cortisol levels to an increased risk of [[diabetes|diabetes]] and to immune [[dysfunction|dysfunction]].", "Nowhere is the bodily effect of emotion more striking than in [[grief|grief]]. Cardiologists in Japan first described 'takotsubo syndrome', popularly known as [[broken|broken]] heart syndrome, in 1990: after a sudden bereavement, the main pumping [[chamber|chamber]] of the heart swells into an unusual shape and works poorly. In most cases the heart recovers within weeks, but the condition can occasionally prove [[fatal|fatal]], and in a patient with existing heart disease the sudden surge of stress hormones may be [[lethal|lethal]] within hours. Large studies show that the risk of a heart attack rises sharply in the days after a loved one dies, so the old notion that people can [[grieve|grieve]] themselves to death is not pure folklore. Doctors stress, however, that this is not an inevitable [[fate|fate]]; bereavement does not [[doom|doom]] a healthy person, and the vast majority survive their loss.", "Attitude also shapes the experience of pain. Patients with [[arthritis|arthritis]] who hold a [[pessimistic|pessimistic]] or [[negative|negative]] [[attitude|attitude]] tend to report more severe pain in the [[elbow|elbow]], [[ankle|ankle]] or [[heel|heel]], to describe their own bodies as [[feeble|feeble]] and to become more disabled over time, than patients with similar joint damage who remain hopeful. Severe back pain affecting the [[backbone|backbone]] may [[cripple|cripple]] one patient yet barely slow another. This is one reason why the placebo effect is so powerful. In some trials, a sugar pill described as a strong [[drug|drug]] can [[alleviate|alleviate]] pain almost as well as the real [[dose|dose]], and patients who believe they have been given an [[antibiotic|antibiotic]] sometimes report feeling better from a cold, which no antibiotic can cure. Even the packaging bought from a [[pharmacy|pharmacy]] can influence results.", "[[Acupuncture|acupuncture]] illustrates the debate. Many [[skeptical|skeptical/sceptical]] scientists regard its traditional theory as unproven, yet patients regularly say it helps to [[ease|ease]] chronic pain. A large German study managed to [[astound|astound]] both supporters and critics: real acupuncture outperformed standard care, but so did 'sham' needles placed at random points, while the difference between real and sham treatment was [[negligible|negligible]]. Supporters took a [[liberal|liberal]] reading of these results; critics drew the more [[radical|radical]] conclusion that the benefit lay largely in the ritual and the [[gentle|gentle]], [[earnest|earnest]] attention of the practitioner.", "Physical activity offers more reliable benefits. Even when [[strenuous|strenuous]] or [[arduous|arduous]], exercise releases chemicals that lift mood, and people who replace a [[slothful|slothful]] evening routine with a [[lively|lively]] walk sleep better and are less likely to [[doze|doze]] off at their desks or [[gorge|gorge]] on sugary snacks. The [[daring|daring]] are not always rewarded, however: an occasional [[bruise|bruise]] or a fall that makes the knee [[bleed|bleed]] is a small price, but serious injury can damage both [[flesh|flesh]] and confidence. Older adults who stay active also keep better balance and [[eyesight|eyesight]], and grow more [[sturdy|sturdy]] with age. Experiments on genetically identical mice, each a [[clone|clone]] of the others, show that animals given running wheels develop more new brain cells than their inactive twins.", "Relationships may matter most of all. People who regularly express [[gratitude|gratitude]] report fewer symptoms of illness, while workers who are bullied or [[harassed|harass]] by colleagues show raised blood pressure and lasting [[hatred|hatred]] towards their workplace. Being treated as a [[nuisance|nuisance]] or a [[bore|bore]] by others is [[frustrating|frustrating]] and quietly damaging; being among [[fond|fond]] and [[frank|frank]] friends who do not [[hesitate|hesitate]] to offer help, without needless [[fuss|fuss]], is protective. Some observers worry that well-meaning programmes overlook these facts, staying [[ignorant|ignorant]] of the social causes of illness. Compared with the influence of loneliness, they argue, the effect of many medicines is a [[dwarf|dwarf]] beside a giant.", "None of this means that emotion matters more than [[sanitary|sanitary]] living conditions, vaccines or surgery, and a robust [[ego|ego]] cannot replace treatment. Yet the evidence suggests that how people [[feel|feel]] is written on and inside their bodies, and that medicine increasingly finds itself in [[favour|favor/favour]] of treating both together."], "qs": [{"type": "TFNG", "q": "Ekman's subjects in Papua New Guinea had seen many Western films.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Takotsubo syndrome was first described by cardiologists in Japan.", "a": "TRUE", "para": "D"}, {"type": "TFNG", "q": "The German acupuncture study was funded by health insurance companies.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "Which hormone is released by the adrenal gland in response to a threat?", "a": "cortisol", "para": "C"}, {"type": "SA", "q": "What kind of needles performed as well as real acupuncture in the German study?", "a": "sham needles", "para": "F"}, {"type": "SA", "q": "What were mice given that led them to develop more new brain cells?", "a": "running wheels", "para": "G"}], "vocab": {"naughty": {"w": "naughty", "p": "adj.", "z": "淘气的；顽皮的", "ids": ["20|后缀|-y|naughty|16"]}, "pharmacy": {"w": "pharmacy", "p": "n.", "z": "药店；药剂学", "ids": ["20|后缀|-y|pharmacy|17"]}, "sanitary": {"w": "sanitary", "p": "adj.", "z": "卫生的；清洁的", "ids": ["20|后缀|-y|sanitary|18"]}, "sturdy": {"w": "sturdy", "p": "adj.", "z": "强健的；坚定的", "ids": ["20|后缀|-y|sturdy|20"]}, "trustworthy": {"w": "trustworthy", "p": "adj.", "z": "值得信赖的，可靠的", "ids": ["20|后缀|-y|trustworthy|21"]}, "weary": {"w": "weary", "p": "adj.", "z": "疲倦的；厌烦的", "ids": ["20|后缀|-y|weary|22"]}, "aural": {"w": "aural", "p": "adj.", "z": "耳的；听觉的；气味的；先兆的", "ids": ["20|后缀|-al|aural|0"]}, "fatal": {"w": "fatal", "p": "adj.", "z": "致命的；毁灭性的；决定性的", "ids": ["20|后缀|-al|fatal|1"]}, "lethal": {"w": "lethal", "p": "adj.", "z": "致命的", "ids": ["20|后缀|-al|lethal|2"]}, "liberal": {"w": "liberal", "p": "adj.", "z": "慷慨的；大方的；自由主义的", "ids": ["20|后缀|-al|liberal|3"]}, "radi r recorded that families could only [[weep|weep]] and [[lament|lament]] as carts collected the dead. In their [[sorrow|sorrow]] and fear, many communities blamed [[wicked|wicked]] outsiders, and [[suspicion|suspicion]] fell on foreigners and minorities, who faced openly [[hostile|hostile]] crowds.", "Without any understanding of germs, the most effective response was isolation. In 1377 the port of Ragusa, now Dubrovnik, required ships from infected areas to wait offshore before landing, and Venice later extended the period to forty days, the origin of the word [[quarantine|quarantine]]. Authorities began to [[segregate|segregate]] the sick in special hospitals and enforced [[stern|stern]], often [[rigid|rigid]] rules on travel and trade. [[Stubborn|stubborn]] merchants who lost money were [[vexed|vex]] by these measures, and some reacted with [[rage|rage]], but historians now credit quarantine with slowing several later outbreaks. Even then, enforcement was [[troublesome|troublesome]], since smugglers and bribed officials regularly broke the barriers.", "The next great step came with smallpox. In 1796 the English country doctor Edward Jenner took material from a blister on the [[palm|palm]] and [[wrist|wrist]] of a milkmaid infected with cowpox, a mild disease, and scratched it into the arm of an eight-year-old boy. The boy developed a [[sore|sore]] arm and a small spot, much like a [[pimple|pimple]], that left a [[scar|scar]], but when later exposed to smallpox he did not fall ill. Jenner's [[zeal|zeal]] for the method was not universally shared. [[Timid|timid]] parents feared that to [[vaccinate|vaccinate]] a child was to risk turning it into a cow, and [[vulgar|vulgar]] cartoons showed patients sprouting horns. Such fears now seem [[naive|naive]], yet within a few decades millions had been protected.", "Surgery, meanwhile, remained a terrifying ordeal. Before anaesthesia, a [[surgeon|surgeon]] was judged largely by speed: the Scottish surgeon Robert Liston could remove a [[limb|limb]] above the [[knee|knee]] in under three minutes while assistants held the patient down. Patients would [[moan|moan]] or scream, and the shock alone could kill. Operations on the [[skull|skull]] or chest were attempted only in desperation. Opium and later [[morphine|morphine]] could dull the pain afterwards, but the real [[trauma|trauma]] lay in what followed: infected [[wounds|wound]] killed nearly half of amputation patients in some hospitals, and many survivors were left [[lame|lame]]. Even witnesses needed a [[tough|tough]] [[nerve|nerve]]: the screams could [[startle|startle]] experienced medical students into fainting, and some abandoned their training altogether.", "The problem was infection, and the doctors who identified it were rarely thanked. In Vienna in the 1840s, Ignaz Semmelweis noticed that women whose babies were delivered by medical students died of fever far more often than those attended by midwives. He concluded that students carried something from the dissecting room to the [[womb|womb]] of the mother and required them to wash their hands in chlorine. Deaths fell dramatically, yet senior [[physicians|physician]], many of them [[sincere|sincere]] but proud men, rejected the idea that gentlemen's hands could be dirty. It took the [[humble|humble]] work of scientists such as Louis Pasteur, who would [[pore|pore]] over his microscope for hours, and the [[modest|modest]] persistence of the surgeon Joseph Lister to establish germ theory.", "The discovery that transformed treatment was, famously, an accident. Returning to his laboratory in 1928, Alexander Fleming found that a mould had contaminated one of his dishes and killed the surrounding bacteria. He was [[keen|keen]] to explore it, but it was not until the 1940s that Howard Florey and Ernst Chain turned [[penicillin|penicillin]] into a usable medicine. The [[thrill|thrill]] of its first successes was enormous: pneumonia of the [[lung|lung]], infections of the [[kidney|kidney]] and blood, and wounds that had once been a death sentence could be cured with an injection and later a [[pill|pill]]. The great [[virtue|virtue]] of antibiotics was to make the extraordinary [[mundane|mundane]].", "That success created its own dangers. Bacteria are [[volatile|volatile]] organisms that evolve rapidly, and the [[rash|rash]] use of antibiotics in medicine and farming has given them a powerful [[stimulus|stimulus]] to develop resistance. Professor Anita Rao of the London School of Hygiene warns that the development of new drugs has been [[sluggish|sluggish]] for decades, partly because they earn companies little profit. Infections of the [[stomach|stomach]] and urinary tract that were easily treated in the 1980s now sometimes fail to respond. Rao describes resistant bacteria as [[sly|sly]] enemies: they exchange genes with one another and exploit every weakness in our defences.", "Modern medicine has nevertheless become far more [[robust|robust]], and its tools far more precise. A clot-busting drug can now limit the damage of a [[stroke|stroke]] if given within hours; a camera can examine the [[tongue|tongue]], the inside of a [[lip|lip]] or a cracked [[rib|rib]] in detail; and a [[skeleton|skeleton]] can be scanned without a single incision. Keyhole surgery on the [[shoulder|shoulder]], [[waist|waist]] or [[thumb|thumb]] joint leaves patients far less [[tender|tender]] and [[sore|sore]], and a patient may go home to [[nap|nap]] on the sofa the same day, a cat on their [[lap|lap]]. Researchers even study the healing effect of [[laughter|laughter]] and the meaning of a [[yawn|yawn]] or a [[sigh|sigh]]. Microbes, once invisible to the [[naked|naked]] eye, are now within plain [[sight|sight]] under the microscope.", "Historians draw one [[steadfast|steadfast]] lesson from this story: progress depends less on any single [[trait|trait]] of genius than on a [[temperate|temperate]] habit of testing ideas against evidence. Medicine at its best tempers enthusiasm with doubt, and doctors who lose their [[temper|temper]] at contrary findings, or treat the [[private|private]] anxieties of patients lightly, [[hurt|hurt]] both science and the people it serves. From head to [[toe|toe]], the body still holds many mysteries, but few people would wish to return to an age in which a scratch could kill."], "qs": [{"type": "TFNG", "q": "Venice was the first port to make ships from infected areas wait before landing.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Robert Liston was also known for his teaching of medical students.", "a": "NOT GIVEN", "para": "D"}, {"type": "TFNG", "q": "Semmelweis's hand-washing rule led to a large fall in deaths.", "a": "TRUE", "para": "E"}, {"type": "SA", "q": "What mild disease had infected the milkmaid in Jenner's experiment?", "a": "cowpox", "para": "C"}, {"type": "SA", "q": "What did Semmelweis require students to wash their hands in?", "a": "chlorine", "para": "E"}, {"type": "SA", "q": "What has given bacteria a powerful stimulus to develop resistance?", "a": "rash use", "para": "G"}], "vocab": {"hostile": {"w": "hostile", "p": "adj.", "z": "怀有敌意的；不友善的；敌对的", "ids": ["20|其他|其他单词|hostile|91"]}, "humble": {"w": "humble", "p": "adj.", "z": "谦虚的；卑微的", "ids": ["20|其他|其他单词|humble|92"]}, "hurt": {"w": "hurt", "p": "v.", "z": "损害；伤害；（使）疼痛", "ids": ["20|其他|其他单词|hurt|93"]}, "keen": {"w": "keen", "p": "adj.", "z": "强烈的；敏锐的；渴望的；有强烈兴趣的", "ids": ["20|其他|其他单词|keen|98"]}, "kidney": {"w": "kidney", "p": "n.", "z": "肾脏", "ids": ["20|其他|其他单词|kidney|99"]}, "knee": {"w": "knee", "p": "n.", "z": "膝盖", "ids": ["20|其他|其他单词|knee|100"]}, "lame": {"w": "lame", "p": "adj.", "z": "跛的；瘸的；（解释或接口）无说服力的", "ids": ["20|其他|其他单词|lame|101"]}, "lament": {"w": "lament", "p": "n../v.", "z": "悲伤；哀悼/哀悼；对...感到悔恨", "ids": ["20|其他|其他单词|lament|102"]}, "lap": {"w": "lap", "p": "n.", "z": "大腿部；下摆；环节；一圈", "ids": ["20|其他|其他单词|lap|103"]}, "laughter": {"w": "laughter", "p": "n.", "z": "笑；笑声", "ids": ["20|其他|其他单词|laughter|104"]}, "limb": {"w" "w": "volatile", "p": "adj.", "z": "容变的；反复无常的；易挥发的", "ids": ["20|其他|其他单词|volatile|191"]}, "vulgar": {"w": "vulgar", "p": "adj.", "z": "粗俗的；庸俗的", "ids": ["20|其他|其他单词|vulgar|192"]}, "waist": {"w": "waist", "p": "n.", "z": "腰；腰部", "ids": ["20|其他|其他单词|waist|193"]}, "weep": {"w": "weep", "p": "v./n.", "z": "哭泣；流泪；哀悼/哭泣", "ids": ["20|其他|其他单词|weep|195"]}, "wicked": {"w": "wicked", "p": "adj.", "z": "邪恶的；缺德的", "ids": ["20|其他|其他单词|wicked|197"]}, "womb": {"w": "womb", "p": "n.", "z": "子宫；发源地", "ids": ["20|其他|其他单词|womb|198"]}, "wound": {"w": "wound", "p": "n.", "z": "创伤；伤害；伤口", "ids": ["20|其他|其他单词|wound|199"]}, "wretched": {"w": "wretched", "p": "adj.", "z": "不幸的；可怜的；悲惨的；恶劣的", "ids": ["20|其他|其他单词|wretched|200"]}, "wrist": {"w": "wrist", "p": "n.", "z": "腕；腕关节", "ids": ["20|其他|其他单词|wrist|201"]}, "yawn": {"w": "yawn", "p": "v./n.", "z": "打哈欠；裂开/呵欠", "ids": ["20|其他|其他单词|yawn|202"]}, "zeal": {"w": "zeal", "p": "n.", "z": "热心；热情；热忱", "ids": ["20|其他|其他单词|zeal|203"]}}}, {"id": "p27", "theme": "时间日期", "part": 1, "parts": 1, "title": "Keeping Time", "subtitle": "How humanity moved from reading the sky to counting the vibrations of atoms", "paras": ["For most of human history, time was measured by the sky. The rising sun at [[dawn|dawn]], the sun at its highest point at [[midday|midday]] and the gradual lengthening of shadows towards evening provided a rhythm that every farmer understood. Ancient Egyptian astronomers divided both day and night into twelve parts, giving us the [[dozen|dozen]] hours that still structure the clock face. Yet these early hours were not equal: because they were fractions of daylight, a summer hour in Egypt lasted considerably longer than a winter one. For societies organised around agriculture, this hardly mattered. Precision became important only when people needed to coordinate activities across larger distances.", "The sundial, the water clock and the burning candle all served as early timekeepers, each with obvious limitations. A sundial is useless on a cloudy day, and a water clock is affected by temperature, since water flows more slowly when cold. Nevertheless, these devices set an important [[precedent|precedent]]: they established the idea that time could be divided into standard units and measured by a machine rather than simply observed. Over the [[preceding|preceding]] centuries, Greek and Chinese engineers had produced remarkably sophisticated water clocks, including the eleventh-century astronomical clock tower built by Su Song in Kaifeng, which used a water-driven escapement to turn a celestial globe.", "The decisive change came in [[medieval|medieval]] Europe. Mechanical clocks driven by falling weights appeared in monasteries and town squares in the late thirteenth century, partly because monks needed to hold prayers at fixed times throughout the day and night. Historians such as David Landes of Harvard University have argued that these clocks transformed European life. Town bells announced the opening of markets and the start and end of the working day, and citizens gradually learned to organise their lives around the clock rather than the sun. Early mechanical clocks were, however, highly inaccurate, often gaining or losing fifteen minutes a day, so they had to be reset [[periodically|periodically]] using a sundial.", "A key [[intermediate|intermediate]] stage between these crude machines and modern timekeeping was the pendulum clock. In 1656 the Dutch scientist Christiaan Huygens built a clock regulated by a swinging pendulum, reducing errors to around a minute a day and later to mere seconds. Galileo had noticed the principle decades earlier, reportedly while watching a lamp swing in the [[midst|midst]] of a service in Pisa Cathedral, though he never completed a working clock. Huygens's invention made it possible, for the first time, to measure the [[duration|duration]] of experiments and astronomical events with real confidence.", "The most urgent practical problem of the age, however, was at sea. Sailors could find their latitude from the stars, but determining longitude required knowing the exact time at a home port and comparing it with local time on board. A pendulum clock was useless on a rolling ship, and errors could prove fatal; in 1707 a navigational mistake caused four British warships to run aground, with the loss of some 1,500 lives. The British government offered a prize for a solution, and the carpenter John Harrison spent decades building marine chronometers. His H4, completed in 1759, lost only a few seconds during a voyage to Jamaica. Harrison is now regarded as one of the [[foremost|foremost]] craftsmen of his era, although his [[contemporary|contemporary]] critics on the official Board of Longitude were reluctant to give him the full reward.", "Railways created a different difficulty. Until the mid-nineteenth century, every British town kept its own local time, so noon in Bristol arrived roughly ten minutes after noon in London. When trains began to connect these towns, the confusion made timetables almost impossible to read, and railway companies, anxious to appear [[punctual|punctual]], adopted a single 'railway time' based on Greenwich. The change did not happen [[overnight|overnight]]: some towns resisted for decades, and Greenwich Mean Time became the [[permanent|permanent]] legal standard throughout Britain only in 1880. Four years later, an international conference in Washington laid the foundations of the world time zones still used today. [[Incidentally|incidentally]], Victorian writers increasingly praised being on time as a mark of good character, reflecting a new moral value placed on keeping to schedule.", "In the twentieth century, accuracy improved dramatically. Quartz clocks, which use the regular vibration of a crystal, appeared in the 1920s, and the first atomic clock was built at Britain's National Physical Laboratory in 1955. Today's best atomic clocks would lose less than a second in billions of years. This precision is not merely academic. Satellite navigation systems depend on [[simultaneous|simultaneous]] signals from several satellites, and an error of a millionth of a second would place a user hundreds of metres from their true position. Financial markets similarly rely on precise timestamps to record trades made thousands of times per second, and internet networks need [[up-to-date|up-to-date]] time signals to synchronise data.", "Not everyone celebrates this precision. Some sociologists argue that clock time has created a culture of constant hurry, in which people feel that a deadline is always [[imminent|imminent]]. Studies of shift workers who work several [[consecutive|consecutive]] night shifts show that ignoring the body's natural rhythm can damage sleep and health, raising the risk of heart disease and depression. Researchers at the University of Surrey found that even a single week of disrupted sleep altered the activity of hundreds of genes. Critics also point out that many traditional societies continue to measure time by events rather than hours, and that this is not necessarily less efficient. In their view, the challenge for modern societies is not to abandon the clock but to stop allowing it to dictate every aspect of daily life.", "Whatever its costs, accurate time has become part of the invisible infrastructure of modern life. As one historian observed at the turn of the [[millennium|millennium]], most people check the time dozens of times a day without ever wondering how that number came to be agreed. The story behind it spans thousands of years of observation, invention and argument."], "qs": [{"type": "TFNG", "q": "In ancient Egypt, hours were the same length in summer and winter.", "a": "FALSE", "para": "A"}, {"type": "TFNG", "q": "Galileo built a working pendulum clock before Huygens.", "a": "FALSE", "para": "D"}, {"type": "TFNG", "q": "Harrison's H4 was later copied by French clockmakers.", "a": "NOT GIVEN", "para": "E"}, {"type": "SA", "q": "What did early mechanical clocks have to be reset with?", "a": "a sundial", "para": "C"}, {"type": "SA", "q": "What did railway companies adopt to solve the problem of local times?", "a": "railway time", "para": "F"}, {"type": "SA", "q": "What vibrates regularly inside a quartz clock?", "a": "a crystal", "para": "G"}], "vocab": {"intermediate": {"w": "intermediate", "p": "adj.", "z": "中间的", "ids": ["21|词根|medi|intermediate|1"]}, "medieval": {"w": "medieval", "p": "adj.", "z": "中世纪的；守旧的", "ids": ["21|词根|medi|medieval|2"]}, "precedent": {"w": "precedent", "p": "n.", "z": "先例；常规", "ids": ["21|词根|ced|precedent|0"]}, "preceding": {"w": "preceding", "p": "adj.", "z": "在前的；在先的", "ids": ["21|词根|ced|preceding|1"]}, "incidentally": {"w": "incidentally", "p": "adv.", "z": "偶然地；顺便提一句", "ids": ["21|词根|cis|incidentally|0"]}, "consecutive": {"w": "consecutive", "p": "adj.", "z": "连续不断的", "ids": ["21|词根|sequ|consecutive|0"]}, "periodically": {"w": "periodically", "p": "adv.", "z": "周期性地；定期地", "ids": ["21|词根|od|periodically|0"]}, "contemporary": {"w": "contemporary", "p": "adj.", "z": "当代的；同时代的", "ids": ["21|前缀|-co-|contemporary|0"]}, "foremost": {"w": "foremost", "p": "adj.", "z": "最前的；最重要的", "ids": ["21|前缀|-fore-|foremost|0"]}, "overnight": {"w": "overnight", "p": "adv.", "z": "在晚上；突然；一夜之间", "ids": ["21|前缀|-over-|overnight|0"]}, "permanent": {"w": "permanent", "p": "adj.", "z": "永久的", "ids": ["21|前缀|-per-|permanent|0"]}, "imminent": {"w": "imminent", "p": "adj.", "z": "（尤指不愉快的事）即将发生的；逼近的", "ids": ["21|前缀|-im-|imminent|0"]}, "punctual": {"w": "punctual", "p": "adj.", "z": "准时的；守时的", "ids": ["21|后缀|-al|punctual|1"]}, "duration": {"w": "duration", "p": "n.", "z": "持续时间；期间", "ids": ["21|后缀|-ation|duration|0"]}, "simultaneous": {"w": "simultaneous", "p": "adj.", "z": "同时发生（或进行）的", "ids": ["21|后缀|-ous|simultaneous|0"]}, "dawn": {"w": "dawn", "p": "n./v.", "z": "黎明；开端/破晓", "ids": ["21|其他|其他单词|dawn|0"]}, "dozen": {"w": "dozen", "p": "n.", "z": "一打；十二个；十来个", "ids": ["21|其他|其他单词|dozen|1"]}, "midday": <script>
(function(){
"use strict";
var P = JSON.parse(document.getElementById('data').textContent);
var DEL_KEY='ieltsVocab.deleted.v1', CUR_KEY='ieltsReading.cur.v1';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
var deleted = new Set();
function loadDel(){ deleted = new Set(); try{ JSON.parse(lsGet(DEL_KEY)||'[]').forEach(function(id){ deleted.add(id); }); }catch(e){} }
loadDel();
window.addEventListener('storage', function(e){ if(e.key===DEL_KEY){ loadDel(); refreshKnown(); } });
function isKnown(v){ return v.ids.length && v.ids.every(function(id){ return deleted.has(id); }); }
function setKnown(v, on){
  loadDel();
  v.ids.forEach(function(id){ if(on) deleted.add(id); else deleted.delete(id); });
  lsSet(DEL_KEY, JSON.stringify(Array.from(deleted)));
}
var cur = Math.max(0, P.findIndex(function(p){ return p.id===lsGet(CUR_KEY); }));
function label(p){ return p.theme + (p.parts>1 ? ' '+p.part+'/'+p.parts : ''); }
function counts(p){ var ks=Object.keys(p.vocab), k=0; ks.forEach(function(x){ if(isKnown(p.vocab[x])) k++; }); return [k, ks.length]; }
function renderSide(){
  var h='<h4>主题 · 已熟/生词</h4>', s='';
  P.forEach(function(p,i){
    var c=counts(p);
    h+='<button class="pitem'+(i===cur?' on':'')+(c[0]===c[1]?' done':'')+'" data-i="'+i+'"><span>'+esc(label(p))+'</span><small>'+c[0]+'/'+c[1]+'</small></button>';
    s+='<option value="'+i+'"'+(i===cur?' selected':'')+'>'+esc(label(p))+' · '+esc(p.title)+'（'+c[0]+'/'+c[1]+'）</option>';
  });
  $('side').innerHTML=h; $('sel').innerHTML=s;
}
function wc(p){ var n=0; p.paras.forEach(function(t){ n+=(t.replace(/\[\[(.+?)\|[^\]]+\]\]/g,'$1').match(/[A-Za-z]+(?:[-'][A-Za-z]+)*/g)||[]).length; }); return n; }
function renderPara(t){
  var out='', last=0, re=/\[\[(.+?)\|([^\]]+)\]\]/g, m;
  while((m=re.exec(t))){ out+=esc(t.slice(last,m.index)); out+='<span class="t" data-k="'+esc(m[2])+'">'+esc(m[1])+'</span>'; last=re.lastIndex; }
  return out+esc(t.slice(last));
}
function render(){
  var p=P[cur], c=counts(p);
  var h='<div class="meta"><span class="tag">'+esc(label(p))+'</span><span>约 '+wc(p)+' 词</span><span id="kc">生词 '+c[1]+' · 已熟 '+c[0]+'</span></div>';
  h+='<h1>'+esc(p.title)+'</h1>'+(p.subtitle?'<p class="sub">'+esc(p.subtitle)+'</p>':'');
  p.paras.forEach(function(t,i){ h+='<div class="para"><div class="L">'+String.fromCharCode(65+i)+'</div><p>'+renderPara(t)+'</p></div>'; });
  if(p.qs && p.qs.length){
    h+='<details class="box"><summary>练习题（'+p.qs.length+'）</summary>';
    var tf=p.qs.filter(function(q){return q.type==='TFNG';}), sa=p.qs.filter(function(q){return q.type!=='TFNG';});
    if(tf.length) h+='<p style="color:var(--muted);font-size:13px;margin:8px 0 0">判断：TRUE / FALSE / NOT GIVEN</p>';
    tf.concat(sa).forEach(function(q,i){
      if(i===tf.length && sa.length) h+='<p style="color:var(--muted);font-size:13px;margin:12px 0 0">简答：NO MORE THAN TWO WORDS</p>';
      h+='<div class="q"><span class="ty">'+(i+1)+'</span>'+esc(q.q)+'<button type="button" class="qa">答案</button><div class="ans">'+esc(q.a)+(q.para?'　（段落 '+esc(q.para)+'）':'')+'</div></div>';
    });
    h+='</details>';
  }
  h+='<details class="box"><summary>本篇生词表（'+c[1]+'）</summary><div class="wl" id="wl"></div></details>';
  $('art').innerHTML=h;
  renderWL(); refreshKnown();
  var pr=P[cur-1], nx=P[cur+1];
  $('prev').textContent = pr ? '← '+label(pr) : ''; $('prev').style.visibility = pr?'visible':'hidden';
  $('next').textContent = nx ? label(nx)+' →' : ''; $('next').style.visibility = nx?'visible':'hidden';
  renderSide();
  lsSet(CUR_KEY, p.id);
}
function renderWL(){
  var p=P[cur], h='';
  Object.keys(p.vocab).forEach(function(k){ var v=p.vocab[k]; h+='<div data-k="'+esc(k)+'" class="'+(isKnown(v)?'known':'')+'"><b>'+esc(v.w)+'</b><i>'+esc(v.p)+'</i>'+esc(v.z)+'</div>'; });
  var wl=$('wl'); if(wl) wl.innerHTML=h;
}
function refreshKnown(){
  var p=P[cur];
  document.querySelectorAll('#art .t').forEach(function(s){ var v=p.vocab[s.getAttribute('data-k')]; s.classList.toggle('known', !!(v && isKnown(v))); });
  var c=counts(p), kc=$('kc'); if(kc) kc.textContent='生词 '+c[1]+' · 已熟 '+c[0];
  renderWL(); renderSide();
}
function go(i){ if(i<0||i>=P.length) return; cur=i; hidePop(); render(); window.scrollTo(0,0); }
$('side').addEventListener('click', function(e){ var b=e.target.closest('.pitem'); if(b) go(+b.getAttribute('data-i')); });
$('sel').addEventListener('change', function(){ go(+this.value); });
$('prev').addEventListener('click', function(){ go(cur-1); });
$('next').addEventListener('click', function(){ go(cur+1); });
$('hlBtn').addEventListener('click', function(){ var on=!document.body.classList.contains('hl'); document.body.classList.toggle('hl',on); this.classList.toggle('on',on); lsSet('ieltsReading.hl', on?'1':'0'); });
if(lsGet('ieltsReading.hl')==='0'){ document.body.classList.remove('hl'); $('hlBtn').classList.remove('on'); }
var popK=null, popEl=null;
function hidePop(){ $('pop').hidden=true; if(popEl) popEl.classList.remove('cur'); popK=null; popEl=null; }
function showPop(k, el){
  var v=P[cur].vocab[k]; if(!v) return;
  if(popEl) popEl.classList.remove('cur');
  popK=k; popEl=el; if(el.classList.contains('t')) el.classList.add('cur');
  $('pw').textContent=v.w; $('pp').textContent=v.p; $('pz').textContent=v.z;
  var kn=isKnown(v); $('pk').textContent = kn?'改回生词':'标为已熟'; $('pk').classList.toggle('k', !kn);
  var pop=$('pop'); pop.hidden=false;
  var r=el.getBoundingClientRect(), w=pop.offsetWidth, hh=pop.offsetHeight;
  var x=Math.min(window.innerWidth-w-10, Math.max(10, r.left)), y=r.bottom+8;
  if(y+hh>window.innerHeight-10) y=r.top-hh-8;
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
document.addEventListener('click', function(e){
  var t=e.target.closest('.t, .wl div');
  if(t){ showPop(t.getAttribute('data-k'), t); e.stopPropagation(); return; }
  var qa=e.target.closest('.qa'); if(qa){ qa.parentNode.classList.toggle('show'); return; }
  if(!e.target.closest('#pop')) hidePop();
});
$('pc').addEventListener('click', hidePop);
$('pk').addEventListener('click', function(){
  var v=P[cur].vocab[popK]; if(!v) return;
  var on=!isKnown(v); setKnown(v,on); toast(on?'已标为熟词，词根词库同步删除':'已改回生词'); hidePop(); refreshKnown();
});
var tt; function toast(s){ var t=$('toast'); t.textContent=s; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); },1800); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') hidePop(); if(e.key==='ArrowRight'&&e.altKey) go(cur+1); if(e.key==='ArrowLeft'&&e.altKey) go(cur-1); });
render();
})();
</script>
</body>
</html>
