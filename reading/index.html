易房、棚/流、洒、摆脱", "ids": ["12|其他|其他单词|shed|60"]}, "span": {"w": "span", "p": "n.", "z": "跨距；跨度；持续时间", "ids": ["12|其他|其他单词|span|63"]}, "stair": {"w": "stair", "p": "n.", "z": "楼梯", "ids": ["12|其他|其他单词|stair|64"]}, "staircase": {"w": "staircase", "p": "n.", "z": "（建筑内的）楼梯", "ids": ["12|其他|其他单词|staircase|65"]}, "steel": {"w": "steel", "p": "n.", "z": "钢铁", "ids": ["12|其他|其他单词|steel|66"]}, "storey/story": {"w": "storey/story", "p": "n.", "z": "楼层", "ids": ["12|其他|其他单词|storey/story|68"]}, "tile": {"w": "tile", "p": "n.", "z": "瓦；瓷砖", "ids": ["12|其他|其他单词|tile|70"]}, "vault": {"w": "vault", "p": "n.", "z": "拱顶；金库；保险库", "ids": ["12|其他|其他单词|vault|74"]}, "venue": {"w": "venue", "p": "n.", "z": "发生地点、举行场所", "ids": ["12|其他|其他单词|venue|75"]}, "viaduct": {"w": "viaduct", "p": "n.", "z": "高架桥", "ids": ["12|其他|其他单词|viaduct|76"]}, "villa": {"w": "villa", "p": "n.", "z": "乡间别墅；[英]度假别墅", "ids": ["12|其他|其他单词|villa|77"]}, "weld": {"w": "weld", "p": "v.", "z": "焊接；使紧密结合", "ids": ["12|其他|其他单词|weld|78"]}}}, {"id": "p15", "theme": "交通旅行", "part": 1, "parts": 1, "title": "Moving the World", "subtitle": "How each new form of transport has reshaped trade, communication and everyday life", "paras": ["Long before the [[wheel|wheel]] was invented, people moved goods by water. A dugout [[canoe|canoe]] or a simple [[raft|raft]] of logs, propelled by an [[oar|oar]], could [[convey|convey]] a heavy [[load|load]] far more easily than any porter could carry it overland. Many Egyptologists believe that the limestone blocks for the [[pyramids|pyramid]] at Giza were floated along a purpose-built [[canal|canal]] before being dragged to the building site. Water, in other words, was humanity's original [[highway|highway]], and the first great trading cities grew up around a sheltered [[harbour|harbour/harbor]] or a navigable river.", "On land, progress depended on the animals and roads available. Ox-drawn [[carts|cart]] and four-wheeled [[wagons|wagon]] carried farm produce to market, while wealthier households kept a horse-drawn [[carriage|carriage]]. The Romans, recognising that armies and commerce alike moved by road, chose to [[pave|pave]] tens of thousands of kilometres of [[routes|route]] with stone, adding a raised [[curb|curb]] on either side and a [[ditch|ditch]] for drainage. At regular intervals a milestone or [[signpost|signpost]] told travellers the distance to the next town. Even so, a journey by road remained slow and exhausting: a [[swift|swift]] horseman might [[cross|cross]] eighty kilometres in a day, and every extra bag was a [[burden|burden]] on rider and animal alike.", "The age of [[sail|sail]] extended human reach across the oceans. A merchant [[vessel|vessel]] might spend months on a single [[voyage|voyage]], its [[captain|captain]] navigating by the stars, a compass and a battered [[atlas|atlas]] of charts. Life [[aboard|aboard]] was harsh. An ordinary [[sailor|sailor]] or [[seaman|seaman]] slept below the [[deck|deck]] in cramped hammocks, and disease could reduce the [[crew|crew]] by a third before the ship reached its destination [[port|port]]. Where the coast was dangerous, [[captains|captain]] preferred to drop [[anchor|anchor]] in a sheltered [[channel|channel]] overnight, because a [[wreck|wreck]] on the rocks meant the loss of both lives and cargo. [[Sailors|sailor]] learned to [[bind|bind]] their goods tightly with rope, and they dreaded the sudden [[lull|lull]] in the wind that could leave a ship becalmed for weeks.", "Steam changed everything. The [[steamer|steamer]], driven first by paddles and later by a screw [[propeller|propeller]], no longer needed to [[sail|sail]] with the wind, and by 1910 an ocean [[liner|liner]] could carry two thousand passengers from Southampton to New York in under a week. A uniformed [[steward|steward]] served meals in the dining saloon, while passengers at the [[stern|stern]] watched the coastline [[vanish|vanish]] behind them. On land, the steam [[locomotive|locomotive]] produced an even greater revolution. Britain's first public [[railway|railway]] opened in 1825, and within half a century a transcontinental [[railroad|railroad]] linked America's Atlantic and Pacific coasts. Iron [[rails|rail]] ran through [[tunnels|tunnel]] and over mountain passes, so that goods which had once taken a month to arrive were [[due|due]] within days. In cities, the electric [[tram|tram]] and the [[underground|underground]] carried workers in from the suburbs, and [[travel|travel]], once a privilege of the rich, became part of daily life.", "Equally significant was the effect on communication. Before the [[railway|railway]], a letter might take weeks to arrive, and [[postage|postage]] was usually paid by the recipient. The introduction of the adhesive [[stamp|stamp]] in 1840, together with overnight [[mail|mail]] trains, meant that a [[packet|packet]] of letters could [[transit|transit]] the whole country while its recipients slept. Professor Gareth Owens of the University of Leeds argues that cheap post did more to unite Victorian Britain than any political reform, since it allowed ordinary families to send a [[parcel|parcel]] or [[package|package]] to relatives hundreds of miles away and to [[transmit|transmit]] news, money and ideas at unprecedented [[speed|speed]].", "The twentieth century belonged to the internal combustion engine. Mass-produced [[motor|motor]] cars, running on four rubber [[tyres|tire/tyre]] and powered by engines of a few dozen [[horsepower|horsepower]], filled the streets, while the diesel [[lorry|lorry]] in Britain and the [[truck|truck]] in America took over much of the long-distance [[freight|freight]] once carried by [[rail|rail]]. On farms, the [[tractor|tractor]] replaced the plough horse. The [[auto|auto]] industry reshaped cities: a tree-lined [[avenue|avenue]] might be widened into a road of six [[lanes|lane]], almost every new house acquired a [[garage|garage]], and the busy [[intersection|intersection]] became a source of danger and of the constant [[honk|honk]] of horns. Road safety researchers note that most collisions occur when drivers misjudge [[velocity|velocity]] or fail to [[brake|brake]] in time; in a serious [[crash|crash]], the front of a car can [[crush|crush]] in a few milliseconds.", "Meanwhile, [[aviation|aviation]] advanced from fragile biplanes to jet airliners in barely fifty years. Early [[airplane|airplane]] designers relied on piston engines, but the gas [[turbine|turbine]] allowed aircraft to fly higher, further and faster. During the Second World War the [[parachute|parachute]] became standard equipment for every military [[pilot|pilot]], and the [[helicopter|helicopter]] later opened up places that no runway could reach. Today a long-haul [[flight|flight]] is so routine that many passengers [[embark|embark]] with nothing but a [[carry-on|carry-on]] bag stowed in the overhead [[rack|rack]]. Competition from low-cost [[carriers|carrier]] has pushed the average [[fare|fare]] so low that a weekend abroad can cost less than a train ticket across Britain.", "Not every innovation, however, has simply replaced its predecessors. In many Asian cities the human-powered [[pedicab|pedicab]] still competes with taxis over short distances, and tourists on [[safari|safari]] in Kenya are driven in open-sided four-wheel-drive [[vehicles|vehicle]] that differ little from those of the 1960s. Steam enthusiasts still [[parade|parade]] restored engines on festival days, and old forms seem to [[haunt|haunt]] the new: the electric scooter recalls the bicycle, and drone delivery revives the courier. Dr Lin Wei of Tongji University argues that planners should study these survivals, because the [[way|way]] people actually move rarely matches official forecasts.", "Every new technology also brings its own [[hazards|hazard]], from congestion to carbon emissions. Lin warns that governments which [[defer|defer]] investment in public transport will face rising costs later, just as a driving licence allowed to [[expire|expire]] must eventually be renewed at greater inconvenience. Commuters who [[dash|dash]] for an overcrowded train each morning and ships that queue for days outside a congested [[dock|dock]] are, in her view, reminders that a well-planned [[itinerary|itinerary]] is only as reliable as the system that supports it."], "qs": [{"type": "TFNG", "q": "Roman roads were built with a ditch to drain away water.", "a": "TRUE", "para": "B"}, {"type": "TFNG", "q": "Before 1840, the sender of a letter usually paid the postage.", "a": "FALSE", "para": "E"}, {"type": "TFNG", "q": "Most drone delivery companies are based in Asia.", "a": "NOT GIVEN", "para": "H"}, {"type": "SA", "q": "What sudden weather condition could leave a sailing ship becalmed for weeks?", "a": "lull", "para": "C"}, {"type": "SA", "q": "What type of engine allowed aircraft to fly higher, further and faster?", "a": "gas turbine", "para": "G"}, {"type": "SA", "q": "What item became standard equipment for military pilots during the Second World War?", "a": "parachute", "para": "G"}], "vocab": {"defer": {"w": "defer", "p": "v.", "z": "推迟；延期", "ids": ["13|词根|fer|defer|0"]}, "tractor": {"w": "tractor", "p": "n.", "z": "拖拉机；牵引力", "ids": ["13|词根|tract|tractor|1"]}, "parcel": {"w": "parcel", "p": "v./n.", "z": "打包；包/土地的一块；包裹", "ids": ["13|词根|part|parcel|1"]}, "carriage": {"w": "carriage", "p": "n.", "z": "四轮马车；[英]（客运火车的）车厢", "ids": ["13|词根|carr|carriage|0"]}, "carrier": {"w": "carrier", "p": "n.", "z": "航空母舰；运输工具", "ids": ["13|词根|carr|carrier|1"]}, "transmit": {"w": "transmit", "p": "v.", "z": "传送；传染；传播；传输", "ids": ["13|词根|mit|transmit|0"]}, "propeller": {"w": "propeller", "p": "n.", "z": "螺旋桨，推进器", "ids": ["13|词根|pel|propeller|0"]}, "port": {"w": "port", "p": "n.", "z": "港口；左舷", "ids": ["13|词根|port|port|0"]}, "underground": {"w": "underground", "p": "adj./n.", "z": "地下的；秘密的/[英]地铁", "ids": ["13|词根|und|underground|0"]}, "pedicab": {"w": "pedicab", "p": "n.", "z": "（人力）三轮车", "ids": ["13|词根|pod|pedicab|0"]}, "intersection" wreck": {"w": "wreck", "p": "v./n.", "z": "使失事；破坏/失事的船只；残破的东西", "ids": ["13|其他|其他单词|wreck|76"]}}}, {"id": "p16", "theme": "国家政府", "part": 1, "parts": 1, "title": "The Shape of Power", "subtitle": "From hereditary crowns to modern bureaucracies, political scientists ask what makes citizens trust their governments", "paras": ["For most of recorded history, political [[power|power]] rested on inheritance. A monarch's [[reign|reign]] began with a ceremony in which a [[crown|crown]] was placed on the ruler's head, and the rules of [[succession|succession]] determined which child, brother or cousin would follow. Beneath the throne lay a rigid [[hierarchy|hierarchy]] of nobles, clergy and peasants. In many societies, particularly across the [[Arabian|arabian]] Peninsula and the Scottish Highlands, loyalty was owed first to the [[clan|clan]], an extended family whose elders settled disputes and spoke on [[behalf|behalf]] of their kin. Such systems were rarely [[egalitarian|egalitarian]], yet historians note that they often provided a stable framework within which a [[community|community]] could survive war and famine.", "The idea that ordinary citizens might choose their own rulers spread only gradually. Ancient Rome had briefly been a [[republic|republic]] governed by a [[senate|senate]] of leading men, but it was not until the eighteenth and nineteenth centuries that [[elected|elect]] assemblies became widespread. Britain's [[parliament|parliament]] slowly gained [[authority|authority]] over the monarchy, and successive [[reform|reform]] Acts extended the [[franchise|franchise]] from a small group of landowners to almost all adult men, and eventually to women. Revolutionaries in France and America went further, choosing to [[proclaim|proclaim]] that sovereignty belonged to the people rather than to any king, and to [[declare|declare]] certain [[civil|civil]] rights inalienable.", "The nineteenth century also saw European states extend their rule overseas. A [[colony|colony]] was typically administered by a governor sent from the capital, who might rule directly or through a local [[puppet|puppet]] ruler with little real independence. Critics of empire, from early liberals to the followers of [[Marxism|marxism]], argued that colonial systems served commercial interests rather than the [[welfare|welfare]] of local populations. Marx's philosophy of historical [[materialism|materialism]] held that economic forces, not ideas, drive political change, and it later inspired the [[communism|communism]] of the [[Soviet|soviet]] Union, whose leaders [[claimed|claim]] to have abolished class [[hierarchy|hierarchy]] even as they built one of the most centralised states in history.", "Whatever their ideology, modern states rely on large administrative machines. The daily work of [[administration|administration]] is divided among ministries, each led by a [[minister|minister]] and organised into [[departments|department]], each [[department|department]] in turn containing a [[bureau|bureau]] or agency responsible for a particular policy. The German sociologist Max Weber argued that such [[bureaucracy|bureaucracy]] is the most efficient form of organisation, because officials follow written rules, are appointed for their expertise and are expected to remain politically [[neutral|neutral]]. Critics reply that the same rules make governments slow and impersonal. Few officials will openly [[admit|admit]] that a programme has failed, and decisions are often delayed while files travel between offices far from the ministry's [[headquarters|headquarters]]. Reformers in several countries have responded by moving routine services online, publishing performance targets and giving regional offices greater freedom to act, although evaluations suggest that such changes improve efficiency more reliably than they improve public satisfaction.", "Recent research has tried to measure how citizens actually view their institutions. In 2023 a [[consortium|consortium]] of universities led by the Oslo Centre for Comparative Governance surveyed 60,000 people in 41 countries. Each [[respondent|respondent]] was asked to rank national [[parliaments|parliament]], [[municipal|municipal]] councils and the courts according to how much they trusted them. Strikingly, local government scored highest almost everywhere, which the authors interpret as a [[preference|preference]] for leaders who are visible and accountable. Trust also varied sharply by [[demographic|demographic]] group: younger, urban and lower-income [[respondents|respondent]] were the most sceptical, a pattern that, the report notes, was especially marked in cities where large [[slum|slum]] districts lacked basic services.", "The survey also explored attitudes to identity. Where politics was organised along [[racial|racial]] or [[ethnic|ethnic]] lines, confidence in national institutions was consistently lower, and many people reported that they looked to [[community|community]] [[associations|association]] rather than to the state for support. The lead author, Professor Ingrid Halvorsen, cautions against reading too much into a single study, but she argues that the findings [[affirm|affirm]] a long-standing [[standpoint|standpoint]] in political science: a government's legitimacy depends less on its formal constitution than on whether citizens believe that public officials follow a shared [[ethic|ethic]] of fairness. A professional [[association|association]] of [[civil|civil]] servants in Norway has since adopted the report as a basis for training.", "International relations raise similar questions on a larger scale. Governments negotiate [[bilateral|bilateral]] agreements on trade and security, send a [[delegation|delegation]] to summits, and join regional bodies such as the Arab [[League|league]]. A visiting [[premier|premier]] may lay a [[wreath|wreath]] at a national war memorial as a gesture of respect before talks begin. The global [[arena|arena]] also tests states' humanitarian commitments. Under international law, people fleeing persecution are [[entitled|entitle]] to seek [[asylum|asylum]], and countries that offer [[refuge|refuge]] to large numbers of displaced people often [[claim|claim]] that the burden should be shared [[worldwide|worldwide]] rather than falling on neighbouring states alone.", "How, then, do some leaders [[succeed|succeed]] in building institutions that outlast them? Historians often single out the [[statesman|statesman]] who is willing to [[harness|harness]] public enthusiasm for change while resisting the temptation to concentrate [[power|power]] in personal hands. Such leaders [[nominate|nominate]] capable successors, accept defeat when voters [[elect|elect]] an opponent, and [[implement|implement]] [[reforms|reform]] gradually enough for institutions to adapt. Halvorsen offers a [[hint|hint]] of optimism here: in countries where trust had collapsed in the 1990s, steady improvements in local services were followed, a decade later, by rising confidence in national government. She suggests that citizens judge the state chiefly by the services they encounter in person, such as clinics, schools and rubbish collection, rather than by the speeches of politicians.", "The long-term [[outlook|outlook]] remains uncertain. Rapid technological change, ageing populations and climate pressures will test every form of government, whether a constitutional monarchy, a federal [[republic|republic]] or a single-party [[regime|regime]]. Yet the [[prospect|prospect]] of better government is not merely theoretical. Halvorsen's team concludes that small, practical measures, such as publishing budgets online or inviting citizens to vote on local spending, can do more to restore faith in public institutions than any grand constitutional redesign."], "qs": [{"type": "TFNG", "q": "Weber believed that bureaucracy was the most efficient way of organising government.", "a": "TRUE", "para": "D"}, {"type": "TFNG", "q": "The 2023 survey found that national [[parliaments]] were the most trusted institutions.", "a": "FALSE", "para": "E"}, {"type": "TFNG", "q": "The Norwegian association of [[civil]] servants funded the 2023 survey.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "What did successive reform Acts in Britain extend to more of the population?", "a": "franchise", "para": "B"}, {"type": "SA", "q": "What might a visiting leader lay at a war memorial before talks?", "a": "wreath", "para": "G"}, {"type": "SA", "q": "Which level of government scored highest for trust almost everywhere?", "a": "local government", "para": "E"}], "vocab": {"statesman": {"w": "statesman", "p": "n.", "z": "政治家", "ids": ["14|词根|sta|statesman|3"]}, "succeed": {"w": "succeed", "p": "v.", "z": "成功", "ids": ["14|词根|ced|succeed|1"]}, "succession": {"w": "succession", "p": "n.", "z": "连续；继承权；继位", "ids": ["14|词根|ced|succession|2"]}, "preference": {"w": "preference", "p": "n.", "z": "偏爱；优先权", "ids": ["14|词根|fer|preference|1"]}, "demographic": {"w": "demographic", "p": "adj.", "z": "人口的，人口统计的", "ids": ["14|词根|dem|demographic|1"]}, "administration": {"w": "administration", "p": "n.", "z": "管理；行政", "ids": ["14|词根|min|administration|0"]}, "minister": {"w": "minister", "p": "n.", "z": "部长；大臣；公使", "ids": ["14|词根|min|minister|1"]}, "claim": {"w": "claim", "p": "n./v.", "z": "声称；主张；索赔/声称；要求（拥有）", "ids": ["14|词根|claim|claim|0"]}, "proclaim": {"w": "proclaim", "p": "v.", "z": "声明；清楚的表明", "ids": ["14|词根|claim|proclaim|1"]}, "association": {"w": "association", "p": "n.", "z": "协会；团体；关联", "ids": ["14|词根|soci|association|0"]}, "admit": {"w": "admit", "p": "v.", "z": "供认，承认", "ids": ["14|词根|mit|admit|0"]}, "department": {"w": "department", "p": "n.", "z": "（政府的）部门；（大学的）系、所", "ids": ["14|词根|part|department|0"]}, "reform": {"w": "reform", "p": "v./n.", "z": "改革、改良；改过自新/改革、改良", "ids": ["14|词根|form|reform|0"]}, "delegation": {"w": "delegation", "p": "n.", "z": "代表团；委派", "ids": ["14|词根|leg|delegation|0"]}, "materialism": {"w": "material {"w": "league", "p": "n.", "z": "联赛；联盟；同盟", "ids": ["14|其他|其他单词|league|28"]}, "nominate": {"w": "nominate", "p": "v.", "z": "报名；任命", "ids": ["14|其他|其他单词|nominate|34"]}, "power": {"w": "power", "p": "n.", "z": "能源；权力；政权；能力", "ids": ["14|其他|其他单词|power|36"]}, "puppet": {"w": "puppet", "p": "n.", "z": "玩偶；傀儡", "ids": ["14|其他|其他单词|puppet|37"]}, "slum": {"w": "slum", "p": "n.", "z": "贫民窟", "ids": ["14|其他|其他单词|slum|40"]}, "soviet": {"w": "soviet", "p": "adj./n.", "z": "苏联的/苏维埃", "ids": ["14|其他|其他单词|soviet|41"]}, "standpoint": {"w": "standpoint", "p": "n.", "z": "立场；立足点", "ids": ["14|其他|其他单词|standpoint|43"]}, "welfare": {"w": "welfare", "p": "n.", "z": "健康；幸福", "ids": ["14|其他|其他单词|welfare|47"]}, "worldwide": {"w": "worldwide", "p": "adj.", "z": "世界范围的；遍及全球的", "ids": ["14|其他|其他单词|worldwide|49"]}, "wreath": {"w": "wreath", "p": "n.", "z": "花环；花冠；花圈", "ids": ["14|其他|其他单词|wreath|50"]}}}, {"id": "p17", "theme": "社会经济", "part": 1, "parts": 1, "title": "Boom, Bust and Beyond", "subtitle": "How money, markets and jobs respond when an economy turns", "paras": ["Money has taken many forms. Ancient [[merchants|merchant]] exchanged salt, cattle and shells, and the first [[coins|coin]], struck in Lydia around 600 BC, were valued for the precious metal they contained. Later economies relied on silver and [[copper|copper]]: in Britain, twelve pence made a [[shilling|shilling]] until decimalisation in 1971. Today most [[currency|currency]] exists only as digital entries, and the paper [[cheque|cheque/check]] is fast disappearing. Yet the basic purpose of money has not changed. It allows people to [[trade|trade]] without having to [[swap|swap/swop]] goods directly, and to store value for the future, whether as a family [[treasure|treasure]] or as savings in a bank.", "Modern economies are built on the [[enterprise|enterprise]], a legal [[entity|entity]] that exists separately from its owners. Investors who [[invest|invest]] in a company buy a [[share|share]] of its [[stock|stock]] and expect to receive a [[dividend|dividend]] when it makes a profit; others lend it money by purchasing a [[bond|bond]]. A firm's [[revenue|revenue]] comes from sales, but its [[gross|gross]] income must cover every [[expense|expense]], from rent on a [[lease|lease]] to the weekly [[wage|wage]] bill. If [[expenses|expense]] persistently exceed income, the business runs a [[deficit|deficit]] and may fall into [[debt|debt]]. Accountants track each [[transaction|transaction]], issuing an [[invoice|invoice]] to every customer and recording every [[refund|refund]]. Large customers often pay by [[instalment|instalment/installment]], which helps their cash flow but leaves the supplier waiting for its money.", "Goods reach consumers through a long [[chain|chain]] of intermediaries. A ship unloads its [[cargo|cargo]] at a port, a distributor sells it by [[wholesale|wholesale]] to shops, and a [[retail|retail]] outlet finally sells individual items at a higher price. In the past, a neighbourhood [[grocery|grocery]] might buy flour by the [[sack|sack]] and sell it by the pound, with a [[clerk|clerk]] behind the counter weighing each order. Supermarket [[chains|chain]] have since replaced many independent shops, using their buying power to demand lower prices and offering a discount [[voucher|voucher]] to keep customers loyal. Rapid [[turnover|turnover]] of [[stock|stock]] means that very little sits idle on the shelves, and very little [[spare|spare]] capacity remains in the system when a shock arrives.", "Governments shape this activity in many ways. They [[regulate|regulate]] banks, [[impose|impose]] a [[tariff|tariff]] on certain imports, set a [[quota|quota]] on others, and [[levy|levy]] taxes on income and profits. In return they may offer a [[subsidy|subsidy]] to struggling farmers or an [[incentive|incentive]] for companies to [[improve|improve]] energy efficiency. Central banks attempt to keep [[inflation|inflation]] low and stable, since rapidly rising prices erode savings, but they fear [[deflation|deflation]] just as much, because falling prices encourage households to postpone purchases. When [[trade|trade]] disputes [[escalate|escalate]], one country may [[sanction|sanction]] another, or accuse a rival of trying to [[dump|dump]] cheap goods on its market. Such conflicts can quickly [[diminish|diminish]] the volume of world [[trade|trade]].", "Nowhere are these forces more visible than during a [[recession|recession]]. When demand falls, firms facing reduced orders [[downsize|downsize]], and many workers find their jobs suddenly [[redundant|redundant]]. Managers may [[dismiss|dismiss]] staff, [[fire|fire]] those with poor records, or offer voluntary schemes to those willing to [[resign|resign]]; in some industries an employer may temporarily [[discharge|discharge]] workers until demand recovers. Economists distinguish a temporary [[lay-off|lay-off]] from permanent job losses, but for families both mean a sudden [[lack|lack]] of income. In the Great [[Depression|depression]] of the 1930s, unemployment in the United States reached a quarter of the [[workforce|workforce]], and an [[influx|influx]] of jobless people into the cities overwhelmed charities.", "The human consequences of job loss extend beyond money. A study by Dr Fiona Achebe at the London School of Economics followed 4,000 workers who had been [[sacked|sack]] during the 2008 financial crisis. Those who lost their jobs were twice as likely to report symptoms of [[depression|depression]], even when generous redundancy payments meant that their savings had not yet begun to [[dwindle|dwindle]]. Achebe argues that, for many people, work is a [[vocation|vocation]] that provides identity and social contact, not simply a source of [[remuneration|remuneration]]. Ironically, she found that the [[workaholic|workaholic]] managers most committed to their companies often suffered most after being [[dismissed|dismiss]], because they had [[invested|invest]] so much of themselves in their jobs.", "Companies, too, are affected in ways that are easy to overlook. When a firm cuts its [[payroll|payroll]], it also loses the knowledge held by its [[personnel|personnel]], and rehiring when the economy recovers can [[consume|consume]] large sums in recruitment and training. Human resources teams may receive thousands of applications, each [[résumé|résumé/resume]] screened by software rather than by people. Achebe's research suggests that firms which [[cooperate|cooperate]] with [[trade|trade]] unions to [[coordinate|coordinate]] reduced working hours, rather than cutting jobs outright, recover more quickly and have fewer staff [[absent|absent]] through stress-related illness afterwards. In Germany, a state-backed scheme of this kind kept millions in work during 2009, and the government agreed to [[reimburse|reimburse]] employers for part of the cost.", "Critics, however, [[dismiss|dismiss]] such schemes as expensive. They argue that propping up jobs in declining industries delays the necessary [[growth|growth]] of new ones, and that public money is better spent on retraining. Some economists also warn that a large [[acquisition|acquisition]], in which a stronger firm buys a weaker one, may be a healthier outcome than keeping an unprofitable business alive. The [[failure|failure]] of one company, in this view, releases workers and capital to more productive uses. Others reply that the social [[input|input]] required to rebuild communities after mass unemployment is far greater than the cost of prevention.", "Some ventures fall in between. When a historic factory closes, its [[estate|estate]] may be sold at [[auction|auction]], or a wealthy donor may [[endow|endow]] a trust to convert the buildings into workshops for local start-ups. One such [[undertaking|undertaking]] in Sheffield, which offers each tenant a rent-free [[guarantee|guarantee]] for the first year, has created over 600 jobs. Its founders use a simple [[slogan|slogan]], 'Make it here', and they insist that even in an [[affluent|affluent]] country, a [[worthy|worthy]] local project can [[solve|solve]] problems that national policy cannot. Whether such initiatives [[possess|possess]] the scale to [[prompt|prompt]] a wider recovery, however, remains an open question, though few would deny that they have given new purpose to communities once left behind. Even cautious economists concede that the [[abortion|abortion]] of a promising local plan for want of early funding is a waste no economy can afford."], "qs": [{"type": "TFNG", "q": "In Britain, a shilling was worth twelve pence before 1971.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "Achebe found that workaholic managers coped better than other staff after losing their jobs.", "a": "FALSE", "para": "F"}, {"type": "TFNG", "q": "The Sheffield workshop project received funding from the national government.", "a": "NOT GIVEN", "para": "I"}, {"type": "SA", "q": "What do investors expect to receive when a company makes a profit?", "a": "dividend", "para": "B"}, {"type": "SA", "q": "What proportion of the US workforce was unemployed during the Great Depression?", "a": "a quarter", "para": "E"}, {"type": "SA", "q": "What does the Sheffield undertaking offer each tenant for its first year?", "a": "rent-free guarantee", "para": "I"}], "vocab": {"impose": {"w": "impose", "p": "v.", "z": "强加；征收（书款）", "ids": ["15|词根|pos|impose|1"]}, "redundant": {"w": "redundant", "p": "adj.", "z": "多余的；被裁减的", "ids": ["15|词根|und|redundant|0"]}, "undertaking": {"w": "undertaking", "p": "n.", "z": "任务；事业；许诺；保证", "ids": ["15|词根|und|undertaking|1"]}, "refund": {"w": "refund", "p": "n./v.", "z": "退款", "ids": ["15|词根|fund|refund|1"]}, "affluent": {"w": "affluent", "p": "adj.", "z": "富裕的；富足的", "ids": ["15|词根|flu|affluent|0"]}, "influx": {"w": "influx", "p": "n.", "z": "流入，涌进", "ids": ["15|词根|flu|influx|1"]}, "merchant": {"w": "merchant", "p": "n./adj.", "z": "商人/商业的", "ids": ["15|词根|merc|merchant|1"]}, "estate": {"w": "estate", "p": "n.",  and those who break them may face [[stigma|stigma]] or exclusion rather than a formal [[penalty|penalty]]. As societies grew larger, rulers began to [[legislate|legislate]], and [[courts|court]] emerged to apply the law consistently. Legal historians at the University of Edinburgh argue that the central purpose of any legal system has remained the same ever since: to [[restrain|restrain]] the powerful, to protect the weak, and to give people confidence that disputes will be settled by a [[just|just]] and predictable [[procedure|procedure]] rather than by force.", "Modern legislatures [[enact|enact]] thousands of new laws each year. A bill is debated during a parliamentary [[session|session]], amended, and finally voted on; once passed, it is the task of police and regulators to [[enforce|enforce]] it. Some rules are [[mandatory|mandatory]], such as the requirement to wear a seat belt, while others simply [[permit|permit]] certain conduct under conditions, such as building an extension with planning approval. International law works rather differently. A [[treaty|treaty]] binds only the states that sign it, and countries that [[default|default]] on their commitments are rarely punished directly, although other states may [[boycott|boycott]] their goods or [[condemn|condemn]] them publicly.", "Criminal cases begin with the police, who [[investigate|investigate]] a reported offence, identify a [[suspect|suspect]] and gather evidence. The [[prosecuting|prosecute]] authority must then decide whether to [[prosecute|prosecute]], applying two [[criteria|criteria]]: whether there is enough evidence to secure a conviction, and whether a prosecution is in the public interest. A defendant who is [[accused|accuse]] of a serious crime is entitled to [[access|access]] a lawyer, to see the evidence against them and to remain [[mute|mute]] under questioning. Many defendants enter a guilty [[plea|plea]] in exchange for a lighter [[sentence|sentence]], and an [[admission|admission]] of guilt at an early stage is usually rewarded with a reduction of up to a third.", "In the most serious cases, the verdict is delivered not by a professional judge but by a [[jury|jury]] of ordinary citizens. Supporters regard this as a vital safeguard: twelve people drawn from the community, they argue, are less likely to [[succumb|succumb]] to government pressure than a single official. Yet research raises troubling questions. In a study at University College London, Professor Cheryl Thomas observed hundreds of mock [[trials|trial]] and found that many jurors misunderstood the judge's directions. Some admitted that they had looked up the case online despite having been told not to, while others said they were [[persuaded|persuade]] by a defendant's appearance rather than by the evidence. A few, she reported, would quietly [[mutter|mutter]] complaints about the length of proceedings without ever raising them openly.", "Thomas does not conclude that [[juries|jury]] should be abolished. Instead, she recommends that judges [[instruct|instruct]] jurors in writing as well as orally, and that each [[item|item]] of evidence be explained in plain language. Her team also tested a simple checklist that helped jurors [[reconcile|reconcile]] testimony that appeared to [[contradict|contradict]] other evidence. [[Juries|jury]] using the checklist reached verdicts that agreed more closely with those of experienced judges, which the researchers treated as a rough [[benchmark|benchmark]] of accuracy.", "Civil law, which covers disputes between private parties, raises different challenges. A person may [[sue|sue]] a landlord for failing to [[perform|perform]] repairs, a bank may seek to repossess a house when the owner can no longer pay the [[mortgage|mortgage]], or two companies may disagree over the [[ownership|ownership]] of a patent. Litigation is slow and expensive, and many [[courts|court]] now require the parties to try mediation first, in which a neutral third party helps them [[mediate|mediate]] a settlement. Advocates of this approach point out that it preserves relationships and spares both sides the cost of a hearing. Critics reply that people with weaker bargaining power may feel [[bound|bound]] to accept unfair terms, which undermines the principle of [[equity|equity]] that civil justice is meant to protect.", "Technology has created new kinds of offence. Online fraudsters [[deceive|deceive]] victims with fake websites, and a digital [[pirate|pirate]] can copy a film within hours of its release. Such crimes are often [[committed|commit]] by [[anonymous|anonymous]] users in other countries, making them hard to [[oversee|oversee]] or punish. A thief who might once have needed to [[rob|rob]] a bank in person can now steal millions remotely. Lawmakers have responded by trying to [[restrict|restrict]] the sale of hacking tools and by imposing a heavy [[fine|fine]] on companies that fail to protect customer data, yet many experts believe enforcement still lags far behind the threat.", "The law must also respond to changing ideas of fairness. Campaigners have long sought to end [[discrimination|discrimination]] on grounds of race, sex or disability, and protest groups frequently [[petition|petition]] governments to change the law. In many countries the [[supreme|supreme]] [[court|court]] has the final say on whether legislation is compatible with the constitution, and its judgments may set a new [[standard|standard]] for the whole legal system. Judges, however, are [[confined|confine]] to interpreting the law as written; they cannot create new offences, and any significant change remains the [[obligation|obligation]] of elected representatives. Each new law represents a careful balance between public [[demand|demand]] and the [[constraints|constraint]] imposed by existing rights.", "Ultimately, a legal system depends on public trust. People [[obey|obey]] the law not merely because they fear punishment but because they regard it as legitimate, and research consistently shows that this belief is the most [[potent|potent]] predictor of compliance. When citizens see that the [[routine|routine]] work of the [[courts|court]] is fair, that the law is applied equally, and that the highest institutions [[conform|conform]] to the same rules as everyone else, they are more willing to accept unwelcome decisions. Lawyers trained at a properly [[accredited|accredit]] law school learn this lesson early: a [[genuine|genuine]] commitment to the rule of law, and not the severity of punishment for each [[vice|vice]], is what holds a society together. If a ruling seems wrong, citizens may still [[appeal|appeal]] through the proper channels."], "qs": [{"type": "TFNG", "q": "A treaty is binding on every country, whether or not it has signed.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Professor Thomas recommends that the jury system should be abolished.", "a": "FALSE", "para": "E"}, {"type": "TFNG", "q": "Mediation is cheaper than going to court in every type of civil dispute.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "By up to how much can an early admission of guilt reduce a sentence?", "a": "a third", "para": "C"}, {"type": "SA", "q": "What simple tool helped jurors deal with contradictory testimony?", "a": "checklist", "para": "E"}, {"type": "SA", "q": "Which court has the final say on whether laws are constitutional in many countries?", "a": "supreme court", "para": "H"}], "vocab": {"admission": {"w": "admission", "p": "n.", "z": "承认；入场费；准许入场", "ids": ["16|词根|mit|admission|0"]}, "commit": {"w": "commit", "p": "v.", "z": "犯（罪）；做（坏事）", "ids": ["16|词根|mit|commit|1"]}, "permit": {"w": "permit", "p": "v.", "z": "允许；准许", "ids": ["16|词根|mit|permit|2"]}, "prosecute": {"w": "prosecute", "p": "v.", "z": "检举；起诉", "ids": ["16|词根|sequ|prosecute|1"]}, "sue": {"w": "sue", "p": "v.", "z": "控告，提起诉讼；提出请求", "ids": ["16|词根|sequ|sue|2"]}, "access": {"w": "access", "p": "n.", "z": "通路；查阅（或使用、接近）的机会（或权利）", "ids": [ ictory]] had every reason to exaggerate the [[enormity|enormity]] of the odds he had overcome, while the side that suffered [[defeat|defeat]] was often left [[destitute|destitute]] and voiceless, its version of events lost along with its [[casualties|casualty]]. Over the past four decades, however, a discipline known as battlefield archaeology has begun to [[contest|contest]] many of these inherited narratives. By treating the ground itself as a document, researchers are increasingly able to [[refute|refute]] claims that historians once accepted without question.", "The basic method is deceptively simple. Teams walk the terrain in tight grids with metal detectors, recording the exact position of every [[arrow|arrow]] tip, musket ball, [[blade|blade]] fragment and cartridge case they find. Once several thousand objects have been plotted on a digital map, patterns emerge that show where units were [[deployed|deploy]], where they fired, and where they broke. \"The soil does not lie, although it can certainly be misread,\" says Dr Helen Marsh of the University of Leeds, who has [[devoted|devote]] much of her career to sites in northern England. Because a lead ball that has been fired is deformed differently from one that was simply lost, specialists can even distinguish an [[assault|assault]] from a hasty [[retreat|retreat]] in which soldiers [[discarded|discard]] their equipment.", "The most celebrated example comes from Little Bighorn in Montana, where in 1876 the US Seventh Cavalry under George Custer was destroyed by Lakota and Cheyenne warriors. For a century the popular [[scenario|scenario]] was a heroic 'last stand', in which disciplined cavalrymen [[defended|defend]] a hilltop to the final man. When the archaeologist Richard Fox analysed the distribution of cartridge cases in the 1980s, however, he found little evidence of organised resistance. Instead, the data pointed to a rapid [[collapse|collapse]]: companies became separated, were [[surrounded|surround]], and lost cohesion once panic set in, with many men [[compelled|compel]] to run for their lives. Fox [[contended|contend]] that Custer's [[tactic|tactic]] of dividing his force was not merely [[reckless|reckless]] but fatal, since no company was close enough to [[reinforce|reinforce]] another when the [[alarm|alarm]] was raised.", "Similar work at Culloden, the 1746 [[battle|battle]] that ended the Jacobite [[revolt|revolt]] in Scotland, has had political as well as scholarly consequences. Government reports at the time portrayed the Highland [[rebels|rebel]] as a [[savage|savage]] mob and their leaders as [[traitors|traitor]] bound together by a foreign [[conspiracy|conspiracy]]. Excavations led by Tony Pollard of the University of Glasgow suggest a more complicated picture. The Jacobite charge did not fail through lack of courage. It was slowed by boggy ground, a natural [[obstacle|obstacle]] that the government commander appears to have chosen deliberately, and by a stone wall that [[enclosed|enclose]] one flank of the field and marked its southern [[boundary|boundary]]. In other words, the outcome had less to do with Highland indiscipline than with the terrain, which [[obliged|oblige]] the attackers to cross open ground under constant fire.", "The dead themselves are often the most eloquent witnesses. When a mass [[grave|grave]] was uncovered at Towton in Yorkshire in 1996, osteologists found that many of the skeletons bore [[savage|savage]] head wounds, some inflicted after the men had lost their protective headgear. The pattern suggests that soldiers who had tried to [[surrender|surrender]] were [[executed|execute]] where they stood. Such findings are [[disturbing|disturb]], but they also correct a romantic view that medieval codes of chivalry [[prohibited|prohibit]] the killing of a defenceless [[enemy|enemy]]. Equally revealing is the way armies chose to [[bury|bury]] their dead. An officer might be given a [[funeral|funeral]] with full honours, his name later carved on a [[monument|monument]] or recorded beside the [[medal|medal]] he had won; ordinary soldiers were frequently [[deprived|deprive]] even of a marked [[grave|grave]] and thrown into pits at the edge of the field.", "The approach is now being extended to [[maritime|maritime]] conflict, where the practical challenges are considerably greater. Off the Egadi Islands near Sicily, divers have recovered more than twenty bronze rams from warships lost in 241 BC, when Rome finally [[defeated|defeat]] its [[rival|rival]] Carthage at sea. The position of the wrecks has allowed researchers to reconstruct the [[naval|naval]] [[strategy|strategy]] of both sides, and to show that the Roman commanders [[proceeded|proceed]] to attack only after [[turbulent|turbulent]] weather had [[interrupted|interrupt]] the Carthaginian supply voyage and trapped the [[enemy|enemy]] close to shore. Stone [[missiles|missile]] and lead sling shot found nearby indicate that the fighting was not limited to ramming. Modern wrecks raise different issues: twentieth-century vessels sunk by a [[blast|blast]] below the waterline are often protected as war [[graves|grave]], and many governments [[prohibit|prohibit]] divers from entering them.", "Not everyone welcomes this kind of research. The [[tension|tension]] between scientific curiosity and respect for the dead has led to [[protests|protest]] from descendant communities and veterans' associations, some of whom [[oppose|oppose]] any excavation at sites they regard as sacred. Critics argue that archaeologists [[intrude|intrude]] upon ground that should be left in peace, and that large field teams can [[impair|impair]] the very landscape they set out to study. Others [[reproach|reproach]] researchers for seeming to [[interfere|interfere]] with national memory, particularly where the findings [[deflect|deflect]] attention from the heroism celebrated in local tradition. Most practitioners [[resist|resist]] the suggestion that they are hostile to commemoration. A workable [[compromise|compromise]], adopted at several sites, is to [[prepare|prepare]] surveys together with local communities before work begins and to leave human remains where they lie unless erosion or development threatens them.", "Beyond individual [[battles|battle]], the discipline is changing how scholars understand [[military|military]] history as a whole. Sources written by commanders tend to describe war as a [[contest|contest]] of plans; the physical record shows how often plans dissolved into confusion, how a [[terrific|terrific]] noise or a rumour could [[frighten|frighten]] an entire regiment into flight, and how [[camouflage|camouflage]], ditches and hedgerows counted for as much as numbers. It also offers a [[counter|counter]] to the persistent belief that wars are won by those who [[invade|invade]] and [[conquer|conquer]] most boldly. Again and again, the soil shows that a smaller force able to [[deter|deter]] an attack by holding strong ground could [[devastate|devastate]] a larger army that had outrun its own supplies. For Marsh, this is the real [[mission|mission]] of the field: not to replace the written record, but to ensure that the [[progress|progress]] of a [[battle|battle]] is judged by what befell everyone present on the [[occasion|occasion]], not only those who survived to tell the tale."], "qs": [{"type": "TFNG", "q": "Richard Fox's analysis supported the traditional account of a heroic last stand at Little Bighorn.", "a": "FALSE", "para": "C"}, {"type": "TFNG", "q": "Some soldiers buried at Towton appear to have been killed after trying to surrender.", "a": "TRUE", "para": "E"}, {"type": "TFNG", "q": "The bronze rams recovered off the Egadi Islands are now displayed in a museum in Rome.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "What equipment do teams carry when they walk battlefields in grids?", "a": "metal detectors", "para": "B"}, {"type": "SA", "q": "What natural obstacle slowed the Jacobite charge at Cull ion Studies in Delft argue that this rivalry, more than any single invention, explains why some states expanded while the territory of others began to [[shrink|shrink]].", "In the ancient and medieval world, a [[siege|siege]] was above all a test of endurance. Attackers armed with the [[bow|bow]], the [[spear|spear]] and the [[sword|sword]] had little hope of storming a well-built stone castle, so they usually encircled it and waited for the defenders to [[starve|starve]]. Miners would [[burrow|burrow]] beneath the foundations in order to bring down a tower, while those inside poured boiling water and [[flames|flame]] on anyone who approached the gate. Both sides faced a grim [[dilemma|dilemma]]. A garrison that refused generous terms could [[forgo|forgo/forego]] any later claim to mercy, while a besieging army that lingered too long risked [[famine|famine]] in its own camp, as well as disease spread by [[foul|foul]] water. Attackers occasionally catapulted dead animals over the walls in the hope of spreading infection or [[poisoning|poison]] the wells.", "[[Gunpowder|gunpowder]], first developed in China and known in Europe by the thirteenth century, gradually altered this calculation. Early [[cannon|cannon]] were unreliable and prone to [[burst|burst]], killing their own crews, but by the mid-fifteenth century they were powerful enough to [[bombard|bombard]] walls that had stood for a thousand years. The decisive demonstration came in 1453, when Ottoman artillery breached the defences of Constantinople after a [[siege|siege]] of fifty-three days. Mehmed II's [[triumph|triumph]] carried a stark [[warning|warn]] for every ruler in Europe: height, once the chief virtue of a fortress, had become a liability, since a tall, thin wall was simply a larger target that a heavy stone ball could [[punch|punch]] through.", "The response, worked out by Italian engineers around 1500, was a [[blueprint|blueprint]] that would dominate military architecture for three centuries. The so-called trace italienne replaced high walls with low, thick earthen ramparts that absorbed cannonballs and [[bullets|bullet]] rather than shattering, and arranged them in an angular star shape so that defenders could fire along every face. Labourers [[chopped|chop]] down trees and [[hammered|hammer]] wooden stakes into the slopes to create an open field of fire. A fortress built to this design could [[halt|halt]] an advancing army for months, and the historian Geoffrey Parker has argued that the cost of such works, and of the far larger forces needed to [[capture|capture]] them, helped to drive what he called the 'military revolution' of early modern Europe. States now had to recruit, pay and [[equip|equip]] tens of thousands of [[troops|troop]], first with pikes and muskets and later with the [[rifle|rifle]] and the [[pistol|pistol]]. Many European cities still [[owe|owe]] the shape of their parks and ring roads to these vanished ramparts.", "Diaries left by [[veterans|veteran]] describe life inside such fortresses as a mixture of boredom, [[dread|dread]] and sudden [[turmoil|turmoil]]. A [[guard|guard]] on the walls at night would watch for the [[flare|flare]] of a lit fuse or the [[glow|glow]] of enemy campfires, knowing that a [[raid|raid]] could come without notice. [[Scouts|scout]] were sent out to estimate the strength of the besiegers, and mounted [[patrols|patrol]] rode the surrounding countryside with the [[reins|rein]] of their horses bound in cloth to deaden the sound. The [[glitter|glitter]] of a [[helmet|helmet]] or the [[twinkle|twinkle]] of a lantern could betray a position, so men learned to [[pause|pause]] and listen before they moved. If the enemy fell back, the garrison's cavalry would sometimes [[pursue|pursue]] them, but experienced officers were wary of this [[pitfall|pitfall]]: an apparent withdrawal was often a trick designed to draw defenders into the open.", "For civilians, a prolonged [[siege|siege]] was a [[catastrophe|catastrophe]]. The customs of war offered them little [[shield|shield]]. A town that held out could be sacked once its walls fell, and officers often [[struggled|struggle]] to restrain soldiers who had endured months of hardship. Inhabitants suspected of aiding the enemy could be charged with [[treason|treason]], subjected to [[torture|torture]] and left to [[hang|hang]] above the gate as a [[warning|warn]] to others. Those who resisted to the end were celebrated as [[patriots|patriot]], and the [[tombs|tomb]] of famous defenders became places of pilgrimage. Yet as the Zagreb historian Maria Kovač points out, \"the [[sacrifice|sacrifice]] was rarely chosen by the people who made it.\" Occupying armies that wished to [[oppress|oppress]] a rebellious population would [[forbid|forbid]] residents to gather, and anyone found to [[trespass|trespass]] beyond the curfew lines or [[violate|violate]] the terms of surrender could be shot.", "By the twentieth century, aircraft and the [[bomb|bomb]] had made the walled town obsolete, but the logic of the [[siege|siege]] survived. When German forces encircled Leningrad between 1941 and 1944, they chose to [[starve|starve]] the city rather than [[seize|seize]] it street by street, and an estimated 800,000 civilians died. Elsewhere, [[fleets|fleet]] of bombers and the great amphibious [[landings|landing]] of the Second World War demanded complex [[manoeuvres|maneuver/manoeuvre]] rather than patient blockades, yet planners still spoke of 'breaching' coastal defences. During the Cold War the threat of [[nuclear|nuclear]] attack prompted governments to build deep concrete bunkers, a return to the old conviction that enough earth and stone could [[safeguard|safeguard]] those inside.", "Today, surveillance drones [[hover|hover]] over contested cities, and modern [[sieges|siege]] are fought as much with sanctions and blocked supply routes as with artillery. What has [[happened|happen]], Kovač argues, is not the end of [[siege|siege]] warfare but its dispersal. The [[plight|plight]] of besieged populations remains depressingly familiar, and humanitarian agencies now negotiate temporary [[pauses|pause]] in the fighting so that food can enter and the wounded can leave. Such agreements can [[mitigate|mitigate]] suffering, but they rarely persuade either side to [[cease|cease]] hostilities altogether. The lesson of history, she concludes, is that military [[might|might]] alone has seldom decided a [[siege|siege]]. What has [[mattered|matter]] most is whether the defenders could remain fed, informed and united long enough for the [[peril|peril]] to pass, or whether the attackers could [[strike|strike]] before their own supplies ran out."], "qs": [{"type": "TFNG", "q": "Early cannon sometimes killed the soldiers who operated them.", "a": "TRUE", "para": "C"}, {"type": "TFNG", "q": "The trace italienne was first designed by French engineers.", "a": "FALSE", "para": "D"}, {"type": "TFNG", "q": "Maria Kovač has written a book about the Siege of Leningrad.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "In which year did Ottoman artillery breach the walls of Constantinople?", "a": "1453", "para": "C"}, {"type": "SA", "q": "In what shape were the ramparts of the trace italienne arranged?", "a": "star shape", "para": "D"}, {"type": "SA", "q": "What were the reins of patrol horses bound in to deaden the sound?", "a": "cloth", "para": "E"}], "vocab": {"blueprint": {"w": "blueprint", "p": "n.", "z": "蓝图；行动计划", "ids": ["17|其他|其他单词|blueprint|11"]}, "bomb": {"w": "bomb", "p": "n./v.", "z": "炸弹/轰炸", "ids": ["17|其他|其他单词|bomb|12"]}, "bombard": {"w": "bombard", "p": "v.", "z": "轰击，轰炸；连珠炮般质问（或批评）", "ids": ["17|其他|其他单词|bombard|13"]}, "bow": {"w": "bow", "p": "n.", "z": "弓；蝴蝶结", "ids": ["17|其他|其他单词|bow|14"]}, "bullet": {"w": "bullet", "p": "n.", "z": "子弹", "ids": ["17|其他|其他单词|bullet|15"]}, "burrow": {"w": "burrow", "p": "n./v.", "z": "地洞，地道/掘地洞", "ids": ["17|其他|其他单词|burrow|16"]}, "burst": {"w": "burst", "p": "v./n.", "z": "爆裂，展开/迸发 ": "turmoil", "p": "n.", "z": "混乱，骚乱", "ids": ["17|其他|其他单词|turmoil|104"]}, "twinkle": {"w": "twinkle", "p": "n./v.", "z": "闪烁，闪耀", "ids": ["17|其他|其他单词|twinkle|105"]}, "veteran": {"w": "veteran", "p": "n.", "z": "老兵，老手", "ids": ["17|其他|其他单词|veteran|106"]}, "violate": {"w": "violate", "p": "v.", "z": "违反；违背；侵犯；搅扰", "ids": ["17|其他|其他单词|violate|107"]}, "warn": {"w": "warn", "p": "v.", "z": "警告；告诫", "ids": ["17|其他|其他单词|warn|108"]}, "withstand": {"w": "withstand", "p": "v.", "z": "承受；顶住；经受住", "ids": ["17|其他|其他单词|withstand|111"]}}}, {"id": "p21", "theme": "社会角色", "part": 1, "parts": 1, "title": "The Parts We Play", "subtitle": "Sociologists have long argued that social life is organised around roles. How well does the idea still hold?", "paras": ["On an ordinary weekday, a single individual may occupy half a dozen social positions before lunch. She wakes as a [[spouse|spouse]] and parent, leaves the flat she rents as a [[tenant|tenant]], joins thousands of others on the train as a [[commuter|commuter]], and arrives at the office to act as a [[supervisor|supervisor]] to some colleagues and a [[subordinate|subordinate]] to others. Each position carries its own expectations about how to speak, dress and conduct oneself. The American anthropologist Ralph Linton, writing in 1936, distinguished between a 'status', the position a person holds, and a 'role', the behaviour expected of whoever holds it. That distinction remains the foundation of what is now called role theory, and its [[proponents|proponent]] argue that it explains a great deal about why social life is so predictable.", "Some roles are assigned by birth or by age rather than chosen. Societies mark the stages of life with remarkable precision: legal and medical systems distinguish the [[embryo|embryo]] from the [[infant|infant]], the child from the [[juvenile|juvenile]], and the period of [[adolescence|adolescence]] from adulthood, and each stage is associated with different rights and obligations. Criminologists such as Dr Kwame Asante of the London School of Economics note that a teenager who joins a street [[gang|gang]] is often seeking precisely the firm identity that the uncertain years of [[adolescence|adolescence]] fail to provide. Within the group a hierarchy soon emerges, complete with a [[commander|commander]] figure, loyal followers and a fierce code of solidarity among [[comrades|comrade]].", "Kinship provides the oldest and most durable set of roles. In most cultures the [[household|household]] was historically the basic unit of production as well as of family life, and the obligations of [[kin|kin]] extended well beyond parents and children. Positions such as [[heir|heir]], [[widow|widow]] and [[orphan|orphan]] carried precise legal consequences, particularly for the inheritance of land. Marriage was itself a sequence of role changes: an [[engagement|engagement]] publicly announced the couple's intentions, the bride and [[groom|groom]] exchanged promises before witnesses, and in many English-speaking countries the woman gave up her [[maiden|maiden]] name to take her husband's [[surname|surname]]. Historians of the family point out that [[folk|folk]] customs surrounding weddings and burials often preserved these distinctions long after the law had stopped enforcing them.", "The workplace generates roles of a different kind, defined by contract rather than by blood. Large organisations depend on clearly defined chains of authority, from the [[director|director]] and her [[deputy|deputy]] down to the newest [[apprentice|apprentice]]. Managers are trained to [[delegate|delegate]] tasks, and considerable effort goes into choosing a [[successor|successor]] when a senior figure retires. Professional roles are often protected by qualifications: one cannot simply call oneself a [[consultant|consultant]] in a British hospital, or open a [[veterinary|veterinary]] practice, without years of training and registration. The sociologist Margaret Holloway of the University of Manchester argues that such barriers exist partly to give clients confidence, since the [[sole|sole]] evidence most people have of a professional's competence is the title itself.", "Legal systems illustrate how roles differ between countries even when their functions overlap. In England a client with a property problem would traditionally approach a [[solicitor|solicitor]], who might then instruct a barrister to appear in court, whereas in the United States a single [[attorney|attorney]] usually performs both tasks. In some American courts a lawyer is still formally addressed as '[[counselor|counsellor/counselor]]'. Titles of office are similarly specific: the [[Chancellor|chancellor]] of Germany is the head of government, while the [[Chancellor|chancellor]] of the Exchequer in Britain is responsible for public finances. Comparing such roles across their [[respective|respective]] systems, Holloway argues, shows that the label is less important than the expectations attached to it. Some roles exist precisely in order to be neutral: an [[umpire|umpire]] earns authority only by being seen to favour no one.", "Role theory also helps to explain the strain people feel when expectations conflict. A parent who is also a manager may feel like a [[hostage|hostage]] to two sets of demands, neither of which can be fully met. Research on domestic labour has repeatedly found that women continue to perform most [[household|household]] [[chores|chore]] even when both partners work full-time, adding hours of unpaid [[toil|toil]] to a paid working day. The role of [[hostess|hostess]], once considered a natural extension of a wife's duties, has been redefined in many families, but surveys suggest the redefinition is far from complete. Relationships also shift as roles change: an [[acquaintance|acquaintance]] at work may become an [[intimate|intimate]] friend, while [[affection|affection]] between [[spouses|spouse]] may fade if one partner feels that the division of labour is unfair.", "Not all roles are mundane. Every culture has narratives about exceptional figures: the [[prophet|prophet]] who foresees disaster, the [[herald|herald]] who announces change, the [[heroine|heroine]] who defies convention to [[chase|chase]] a dream. Such figures are significant, scholars argue, because they show ordinary people how a role might be stretched or abandoned altogether. The sociologist of religion Ana Ferreira observes, however, that young people tend to [[accompany|accompany]] their admiration for these figures with a marked reluctance to imitate them, which suggests that cultural ideals and everyday roles occupy rather separate spaces in most lives. Admiring a rebel, in other words, is not the same as wishing to become one.", "Critics of role theory maintain that it makes social life appear far too orderly, and that it says little about how roles themselves come to change over time. People do not simply read from a script, they argue; they improvise, bend the rules and reinvent the parts they are given. Erving Goffman's notion of 'role distance', the small gestures by which a surgeon jokes during an operation or a waiter rolls his eyes behind a customer's back, suggests that individuals constantly signal that they are more than the positions they occupy. Even so, few sociologists would abandon the concept entirely. As Asante puts it, \"We can only rebel against a role because we know so precisely what it demands of us.\" The parts may be rewritten from one generation to the next, but the play itself goes on."], "qs": [{"type": "TFNG", "q": "Ralph Linton distinguished between a person's status and their role.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "In England, solicitors have traditionally represented clients in court themselves.", "a": "FALSE", "para": "E"}, {"type": "TFNG", "q": "Margaret Holloway once worked as a hospital consultant.", "a": "NOT GIVEN", "para": "D"}, {"type": "SA", "q": "Which name did many married women give up in order to /baptise", "p": "v.", "z": "给...施行洗礼", "ids": ["19|后缀|-ize|baptize/baptise|0"]}, "mesmerize/mesmerise": {"w": "mesmerize/mesmerise", "p": "v.", "z": "吸引；迷住", "ids": ["19|后缀|-ize|mesmerize/mesmerise|1"]}, "augment": {"w": "augment", "p": "v.", "z": "扩大；增加；加强；提高", "ids": ["19|后缀|-ment|augment|1"]}, "glance": {"w": "glance", "p": "v./n.", "z": "瞥，迅速看一眼/一瞥", "ids": ["19|后缀|-ance|glance|0"]}, "worship": {"w": "worship", "p": "n./v.", "z": "崇拜，礼拜，爱慕/做礼拜", "ids": ["19|后缀|-ship|worship|0"]}, "allure": {"w": "allure", "p": "v.", "z": "吸引，引诱", "ids": ["19|其他|其他单词|allure|0"]}, "annoy": {"w": "annoy", "p": "v.", "z": "使恼怒；打扰", "ids": ["19|其他|其他单词|annoy|2"]}, "arouse": {"w": "arouse", "p": "v.", "z": "唤起；激起；引起", "ids": ["19|其他|其他单词|arouse|4"]}, "assert": {"w": "assert", "p": "v.", "z": "断言，坚称；坚持（自己的）主张", "ids": ["19|其他|其他单词|assert|6"]}, "assign": {"w": "assign", "p": "v.", "z": "布置；分配；指定；确定", "ids": ["19|其他|其他单词|assign|7"]}, "assort": {"w": "assort", "p": "v.", "z": "把...分类；相配，协调", "ids": ["19|其他|其他单词|assort|8"]}, "assure": {"w": "assure", "p": "v.", "z": "向...保证；保证；保险", "ids": ["19|其他|其他单词|assure|9"]}, "astonish": {"w": "astonish", "p": "v.", "z": "使惊讶", "ids": ["19|其他|其他单词|astonish|10"]}, "bait": {"w": "bait", "p": "v./n.", "z": "使上当发火/诱饵，诱惑物", "ids": ["19|其他|其他单词|bait|12"]}, "bear": {"w": "bear", "p": "v.", "z": "生（孩子）；容忍；承担（责任）", "ids": ["19|其他|其他单词|bear|13"]}, "bewilder": {"w": "bewilder", "p": "v.", "z": "使迷惑，使不知所措", "ids": ["19|其他|其他单词|bewilder|15"]}, "boast": {"w": "boast", "p": "v./n.", "z": "自夸，吹嘘", "ids": ["19|其他|其他单词|boast|18"]}}}, {"id": "p23", "theme": "行为动作", "part": 2, "parts": 2, "title": "The Night Shift of the Mind", "subtitle": "What large collections of dream reports reveal about why we dream", "paras": ["Most adults spend around two hours of every night dreaming, yet few scientists would claim to [[grasp|grasp]] the purpose of this nightly activity. In many traditions a vivid dream was read as a sign of [[deeds|deed]] yet to come. Sigmund Freud famously argued that dreams [[fulfil|fulfil/fulfill]] wishes the waking mind cannot admit. Modern researchers have largely abandoned that view, but they still [[strive|strive]] to explain why the brain, released from the demands of the day, produces such elaborate and frequently unsettling stories.", "One [[clear|clear]] obstacle is that dreams cannot be observed directly. Scientists must rely on what sleepers report, and the memory of a dream is fragile: many people retain only a [[glimpse|glimpse]] of an image on waking, and within minutes even that may be [[erased|erase]]. Only fragments [[leak|leak]] through into waking memory. In sleep laboratories, researchers wait until monitoring equipment indicates rapid eye movement (REM) sleep, then [[tap|tap]] the volunteer on the shoulder and ask for an immediate account. Even then, participants [[omit|omit]] embarrassing details, and some simply [[stare|stare]] blankly, unable to recall anything. To [[offset|offset]] these problems, the psychologists Calvin Hall and Robert Van de Castle developed a standard system for coding dream reports in the 1960s, allowing thousands of accounts to be compared. An online archive known as DreamBank now holds more than 20,000 reports from people across a wide age [[range|range]].", "The patterns that emerge are striking. Negative emotions outnumber positive ones, and the most commonly reported theme, across many cultures, is being chased. Dreamers [[flee|flee]] from strangers, animals or shapeless figures that [[loom|loom]] out of the darkness; others feel themselves [[plummet|plummet]] from a height and wake with a jolt. Social aggression is common too: people dream of being [[bullied|bully]], [[teased|tease]] or [[mocked|mock]] by colleagues, [[scolded|scold]] by a parent, or caught up in [[quarrels|quarrel]] in which both sides [[curse|curse]] and [[swear|swear]]. In more extreme cases the dreamer is [[kidnapped|kidnap]], caught [[smuggling|smuggle]] goods across a border, or trapped on a plane that has been [[hijacked|hijack]], or witnesses a crowd being [[massacred|massacre]]. A recurrent [[nightmare|nightmare]], in which the same threatening figure [[glares|glare]] at the sleeper night after night, is a frequent symptom of post-traumatic stress.", "Why should the brain dwell on danger? The Finnish psychologist Antti Revonsuo proposed in 2000 that dreaming evolved as a 'threat simulation' system. On this view, the dreaming brain rehearses dangerous situations so that the individual can [[cope|cope]] with them more effectively when they arise. Ancestors who practised escaping predators in their sleep, the argument runs, would [[gain|gain]] an advantage when they had to [[tackle|tackle]] real ones. The [[stakes|stake]] were high: a hunter who could [[hasten|hasten]] his reactions by even a fraction of a second, or keep his [[grip|grip]] on a weapon in the moment of terror, was more likely to survive. Dreams, in this account, exist for the [[sake|sake]] of survival. The theory has an obvious appeal, though critics note that modern [[nightmares|nightmare]] concern examinations rather than lions, and that evolution has had little time to [[steer|steer]] dreaming towards contemporary threats.", "Other studies show that dreams draw readily on the sleeper's immediate surroundings. In a classic experiment, the American sleep researchers William Dement and Edward Wolpert sprayed cold water on sleeping volunteers, who later described dreams in which rain began to [[seep|seep]] through a roof, [[drops|drop]] fell from a ceiling, clothes became [[saturated|saturate]], or a glass was [[spilled|spill]] across a table. Later work found that a phone that [[vibrates|vibrate]] on a bedside table may appear in a dream as an earthquake, and that a bed gently [[tilted|tilt]] by researchers can make dreamers feel the floor [[sway|sway]], see a boat begin to [[sink|sink]], or [[lean|lean]] against a wall that suddenly gives way. Sounds are [[muffled|muffle]] rather than blocked during sleep, and a sharp noise can [[penetrate|penetrate]] a dream as the crack of a gunshot. Bodily sensations are woven in as well: an [[itch|itch]] may become an insect crawling across the skin, a cramp may feel as if a needle has [[pierced|pierce]] the leg, and tightly [[wrapped|wrap]] bedclothes can produce the sensation of being [[fastened|fasten]] to a chair.", "Most dreams, however, are far less dramatic. G. William Domhoff of the University of California, Santa Cruz, has argued that dream content largely mirrors waking concerns, an idea he calls the continuity hypothesis. People dream about the activities that fill their days: a gardener may [[mow|mow]] an endless lawn, a card player may [[shuffle|shuffle]] a deck that never runs out, and a farmer may dig a [[trench|trench]] that keeps filling with mud [[oozing|ooze]] from its walls. Domestic routines recur constantly: dreamers [[peel|peel]] vegetables, [[wipe|wipe]] tables, [[scrape|scrape]] ice from a windscreen, try to tidy a [[mess|mess]] that keeps reappearing, or [[tow|tow]] a broken-down car along a road that [[trails|trail]] off into empty fields. Social rituals appear too. Dreamers [[greet|greet]] relatives who have died and bid them [[farewell|farewell]], [[kneel|kneel]] in a church they have not visited since childhood, or [[clap|clap]] and [[salute|salute]] at ceremonies they have never attended.", "A third line of research emphasises emotion. The neuroscientist Matthew Walker of the University of California, Berkeley, has described REM sleep as a form of 'overnight therapy'. During REM, levels of noradrenaline, a stress-related chemical, fall sharply, which may allow the brain to revisit painful memories without the anxiety that originally came with them. In this account dreams [[nourish|nourish]] emotional health: a person who [[yearns|yearn]] for a lost partner, [[reels|reel]] from a public humiliation, or feels torn by guilt over a broken [[oath|oath]] or an unkept [[pledge|pledge]] may wake to find that the feeling has lost some of its sharpness. There is a certain [[irony|irony]] here, Walker notes. The very [[nightmares|nightmare]] people fear may be a [[cause|cause]] of healing rather than a sign of damage, unless they become so intense that the [[urge|urge]] to escape wakes the sleeper and interrupts the process.", "None of these theories has yet won general acceptance, and many researchers suspect that dreaming serves several purposes at once. What is [[clear|clear]] is that the old image of dreams as a [[whirl|whirl]] of meaningless pictures [[scattered|scatter]] at random no longer holds. Brain imaging now allows scientists to [[peer|peer]] into the dreaming mind, although sceptics say they can still only [[peep|peep]] through a keyhole. Ambitious projects have been [[launched|launch]] to decode dream imagery from brain activity, and some investors are prepared to [[gamble|gamble]] on commercial applications. Ethics committees, meanwhile, [[stipulate|stipulate]] that volunteers must consent to any such recording, and opinion within the field is [[split|split]] over whether decoding dreams is desirable at all. For now, dream scientists do not [[flatter|flatter]] themselves: they can [[snatch|snatch]] fragments of the night, but they continue to [[marvel|marvel]] at how much remains hidden."], "qs": [{"type": "TFNG", "q": "Being chased is the most commonly reported dream theme across many cultures.", "a": "TRUE", "para": "C"}, {"type": "TFNG", "q": "Revonsuo's threat simulation theory has been accepted by most dream researchers.", "a": "FALSE", "para": "H"}, {"type": "TFNG", "q": "The volunteers in Dement and Wolpert's experiment were all medical students.", "a": "NOT GIVEN", "para": "E"}, {"type": "SA", "q": "What is the name of the online archive that holds over 20,000 dream reports?", "a": "DreamBank", "para": "B"}, {"type": "SA", "q": "What does Domhoff call his idea that dreams mirror waking concerns?", "a": "continuity hypothesis", "pa al illness is far less clear than once believed", "paras": ["For much of the twentieth century, Western medicine treated the mind and the body as separate territories. A patient who complained of [[chronic|chronic]] stomach pain or [[restless|restless]] nights was examined for a physical cause, and if none could be found, the complaint was often dismissed as [[imaginary|imaginary]]. Doctors who suggested that emotional [[distress|distress]] could produce genuine [[disease|disease]] were [[liable|liable]] to be regarded as unscientific. Today that position looks increasingly [[ridiculous|ridiculous]]. A growing body of evidence, much of it drawn from a large [[corpus|corpus]] of long-term studies, shows that the way people think and feel has a [[direct|direct]] and measurable effect on their physical health.", "The clearest example concerns the heart. In a [[rigorous|rigorous]] study that followed 12,000 civil servants for two decades, Dr Helen Marsh of the University of Bristol found that employees who reported [[severe|severe]] and persistent stress at work were almost twice as likely to develop [[hypertension|hypertension]] as colleagues in less demanding roles. Their resting [[pulse|pulse]] was higher, and scans revealed early stiffening of the walls of the coronary [[artery|artery]]. Marsh argues that the damage is done not by a single [[acute|acute]] crisis but by [[excessive|excessive]] everyday pressure of the kind that leaves people [[uneasy|uneasy]], easily [[irritated|irritate]] and unable to switch off. Those who felt [[indignant|indignant]] about unfair treatment by managers, or who were repeatedly [[disappointed|disappoint]] at being passed over for promotion, showed the most [[adverse|adverse]] readings of all.", "Equally [[surprising|surprising]] are recent findings about the digestive system. The [[intestine|intestine]] contains around 500 million nerve cells, so many that some scientists describe it as a 'second brain', and it communicates constantly with the brain itself. Anxiety can produce cramps in the [[abdomen|abdomen]], while inflammation in the gut appears, in turn, to influence mood. This [[mutual|mutual]] relationship has practical consequences. Because roughly 70 per cent of the body's [[immune|immune]] cells are located in the gut, prolonged stress can lower resistance to [[infection|infection]]: in one well-known experiment, volunteers who described their lives as highly stressful were significantly more likely to develop a cold or [[flu|flu/influenze]] after being deliberately exposed to the virus. Stress has also been linked to flare-ups of [[allergy|allergy]] and eczema.", "Sleep provides a further link. Each person's [[biorhythm|biorhythm]], the internal clock that regulates body temperature and hormone release over roughly 24 hours, is [[delicate|delicate]] and easily disturbed. Shift workers and anxious people alike suffer from [[insomnia|insomnia]], and the effects accumulate: long-term sleep loss is associated with [[obesity|obesity]], poor concentration and a sense of being permanently [[dizzy|dizzy]] and drained. 'It is a [[vicious|vicious]] circle,' says Tomas Lindqvist, a sleep researcher at the Karolinska Institute. 'Lack of sleep makes people more anxious, and anxiety makes sleep harder.' He regards reliance on a sleeping-pill [[prescription|prescription]] alone as [[unsatisfactory|unsatisfactory]], since medication treats the symptom rather than the cause, and recommends basic sleep [[hygiene|hygiene]] as a first [[precaution|precaution]]: fixed bedtimes, a dark room and no screens late at night.", "Personality appears to matter as well. In a celebrated analysis of short autobiographies written by young nuns in the 1930s, researchers found that women whose writing was full of [[positive|positive]] emotion, who described occasions when they would [[rejoice|rejoice]], feel [[merry|merry]] or be [[exhilarated|exhilarate]] by their work, lived on average seven years longer than those whose accounts were [[gloomy|gloomy]]. Because the nuns shared the same diet, housing and [[strict|strict]] daily routine, lifestyle could not explain the gap. Later studies suggest that habitual [[envy|envy]], constant [[regret|regret]] and [[disgust|disgust]] at other people carry a physical cost, whereas those who [[admire|admire]] rather than resent the success of others tend to report better health. Research of this kind confirms what many family doctors had long sensed by [[intuition|intuition]].", "Not everyone is persuaded. Critics such as the epidemiologist Rachel Okafor argue that the popular cult of positive thinking has become an [[illusion|illusion]] that does real harm. If optimism is [[curative|curative]], she asks, what are we to conclude about patients whose cancer returns? The [[implicit|implicit]] message, that they were not [[optimistic|optimistic]] enough, is both [[unkind|unkind]] and unscientific, and may leave seriously ill people feeling [[embarrassed|embarrass]], as though they ought to [[repent|repent]] for their own illness. It may also [[discourage|discourage]] some from seeking conventional treatment. Okafor adds that many reported correlations are [[arbitrary|arbitrary]]: people who are already unwell often become [[apathetic|apathetic]] or [[passive|passive]], so low mood may be a result of disease rather than its cause. A [[rational|rational]] approach, she insists, treats psychological factors as one influence among many, not as a [[remedy|remedy]] in themselves.", "Between these positions, a more balanced practice is emerging. Hospitals in several countries now offer psychological support to patients awaiting a kidney [[transplant|transplant]], to women experiencing a difficult [[pregnancy|pregnancy]] and to people recovering from injuries that [[disable|disable]] or [[paralyse|paralyse/paralyze]] them. Pain specialists report that patients taught to observe pain calmly experience less [[suffering|suffering]], even when the physical signal is unchanged; the [[relief|relief]] comes from altering the response rather than the injury. Simple breathing techniques can [[relieve|relieve]] the [[agony|agony]] of a panic attack, and patients encouraged to [[resume|resume]] ordinary activities quickly are less likely to see themselves as a permanent [[invalid|invalid]]. Medicine, in short, is no longer [[indifferent|indifferent]] to the patient's state of mind.", "Environment and relationships also play a part. Patients whose windows overlook a [[picturesque|picturesque]] garden recover faster than those facing a brick wall, and quiet, [[hospitable|hospitable]] wards with less [[obtrusive|obtrusive]] equipment reduce the need for painkillers. Loneliness, according to one [[prominent|prominent]] review, raises the risk of early [[demise|demise]] to a degree that may [[resemble|resemble]] the effect of smoking, regardless of wealth or good [[fortune|fortune]]. Even perfectly [[sane|sane]], well-adjusted people can remain [[oblivious|oblivious]] to warning signs, acting on the [[impulse|impulse]] to reach for alcohol or sugar when tense, to the [[detriment|detriment]] of their long-term health. [[Enterprising|enterprising]] technology firms now sell wearable devices that monitor stress, although experts caution that such gadgets may be [[unsuitable|unsuitable]] for anxious users who check them obsessively.", "What emerges is a picture in which the mind is neither all-powerful nor irrelevant. Humans remain [[mortal|mortal]], and no attitude can guarantee health. Yet the growing [[stature|stature]] of mind-body research means that attention to emotional wellbeing is increasingly seen as a [[desirable|desirable]] part of mainstream care rather than an optional extra."], "qs": [{"type": "TFNG", "q": "In Dr Marsh's study, a single severe crisis was found to be the main cause of hypertension.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "The nuns in the study ate the same diet and lived in similar housing.
