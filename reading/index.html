<title>主题阅读 · 雅思生词</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#ffffff; --surface2:#efede7;
    --ink:#211d19; --muted:#746c62; --line:#e2ded6;
    --accent:#1f5f8b; --accent-soft:#e6f0f7; --ok:#2e7d4f; --ok-soft:#e5f3ea; --mark:#fff1bd;
    --header-bg:rgba(244,243,239,.92);
    --shadow:0 1px 3px rgba(30,25,20,.07); --shadow-lg:0 10px 30px rgba(30,25,20,.16);
    --serif:"Iowan Old Style","Charter",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161a; --surface:#1e2025; --surface2:#26282f;
      --ink:#edeae4; --muted:#a29b91; --line:#2f313a;
      --accent:#6fb0de; --accent-soft:#1d2c38; --ok:#6cc58f; --ok-soft:#1c3226; --mark:#4a3f1c;
      --header-bg:rgba(21,22,26,.92);
      --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.55;}
  button{font:inherit;color:inherit;cursor:pointer;}
  a{color:var(--accent);}
  .topbar{position:sticky;top:0;z-index:50;background:var(--header-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .tb{max-width:1200px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-height:56px;}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
  .brand b{font-family:var(--serif);font-size:20px;color:var(--accent);font-style:italic;}
  .brand span{font-size:12.5px;color:var(--muted);}
  .spacer{flex:1;}
  .tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink);}
  .tbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .back{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;}
  .layout{max-width:1200px;margin:0 auto;padding:18px 16px 90px;display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start;}
  .side{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);}
  .side h4{margin:8px 8px 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;}
  .pitem{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:7px 9px;font-size:14px;}
  .pitem:hover{background:var(--surface2);}
  .pitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .pitem small{color:var(--muted);font-weight:400;white-space:nowrap;}
  .pitem.done small{color:var(--ok);}
  .sel{display:none;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:15px;margin-bottom:12px;}
  article{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 34px 30px;}
  .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;margin-bottom:6px;}
  .meta .tag{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px;}
  h1{font-family:var(--serif);font-size:30px;line-height:1.2;margin:6px 0 4px;}
  .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px;margin:0 0 18px;}
  .para{display:grid;grid-template-columns:28px 1fr;gap:4px;margin:0 0 14px;}
  .para .L{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:17px;line-height:1.75;}
  .para p{margin:0;font-family:var(--serif);font-size:18px;line-height:1.75;text-align:justify;hyphens:auto;}
  .t{border-radius:4px;cursor:pointer;}
  body.hl .t{background:var(--mark);box-shadow:0 0 0 1px var(--mark);}
  body.hl .t.known{background:none;box-shadow:none;border-bottom:1px dashed var(--ok);}
  .t.cur{outline:2px solid var(--accent);}
  .box{margin-top:22px;border-top:1px solid var(--line);padding-top:14px;}
  .box summary{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0;}
  .q{margin:10px 0;font-size:15px;}
  .q .ty{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;}
  .q .ans{display:none;color:var(--ok);margin-top:3px;font-size:14px;}
  .q.show .ans{display:block;}
  .q button{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:1px 8px;font-size:12.5px;margin-left:6px;}
  .wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin-top:8px;}
  .wl div{font-size:14px;padding:3px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .wl div b{font-family:var(--serif);font-size:15.5px;}
  .wl div.known b{color:var(--ok);text-decoration:line-through;}
  .wl i{color:var(--muted);font-style:normal;font-size:12px;margin:0 4px;}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
  .nav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;max-width:48%;text-align:left;}
  .pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:12px 14px;width:280px;}
  .pop[hidden]{display:none;}
  .pop .w{font-family:var(--serif);font-size:21px;font-weight:700;}
  .pop .p{color:var(--muted);font-size:13px;margin-left:6px;}
  .pop .z{margin:6px 0 10px;font-size:15px;}
  .pop .row{display:flex;gap:8px;}
  .pop .row button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 8px;font-size:13.5px;}
  .pop .row button.k{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90;}
  .toast.on{opacity:1;}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;padding:12px 10px 90px;}
    .side{display:none;}
    .sel{display:block;}
    article{padding:18px 16px 22px;border-radius:14px;}
    h1{font-size:24px;}
    .para{grid-template-columns:20px 1fr;}
    .para p{font-size:17px;text-align:left;}
    .pop{left:10px !important;right:10px;width:auto;bottom:14px;top:auto !important;}
    .brand span{display:none;}
  }
</style>

<script type="application/json" id="data">[{"id": "p01", "theme": "自然地理", "part": 1, "parts": 1, "title": "The Restless Surface", "subtitle": "How heat from below and weather from above shape the planet's landscapes", "paras": ["Geographers have long described the planet as a set of interlocking spheres. The [[lithosphere|lithosphere]], the rigid outer shell made up of the [[crust|crust]] and the uppermost [[mantle|mantle]], rests on hotter, partly molten rock; the [[hydrosphere|hydrosphere]] includes every ocean, lake, [[brook|brook]] and droplet of [[dew|dew]]; and the atmosphere wraps around the [[globe|globe]] as a thin, restless layer. According to Dr Helen Marsh of the University of Edinburgh, even the most [[splendid|splendid]] scenery on Earth, from a jagged mountain [[ridge|ridge]] to a river [[delta|delta]], is simply the visible record of how these spheres interact. 'Every [[landscape|landscape]] is a conversation between heat from below and weather from above,' she argues.", "The heat from below is [[thermal|thermal]] energy left over from the planet's formation and continually released by radioactive elements. Slow convection in the mantle, which obeys the same [[thermodynamic|thermodynamic]] laws as water simmering in a pan, drags each [[plate|plate]] of the lithosphere apart from or towards its neighbours. Where plates diverge, [[magma|magma]] wells up to create new ocean floor; where they converge, crust is forced upward into a high [[plateau|plateau]] or crumpled into mountain chains of rugged [[terrain|terrain]]. The rocks themselves preserve this history. [[granite|granite]] forms when magma cools slowly deep underground, [[marble|marble]] when limestone is baked under pressure, and veins of [[quartz|quartz]] frequently host valuable metal [[ore|ore]]. Some volcanic rocks contain iron [[oxide|oxide]] grains which, like a tiny [[magnet|magnet]], lock in the direction of Earth's magnetic field as they cool. Because that field reverses [[irregularly| mething more remarkable. Far from being passive, plants sense their [[surroundings|surroundings]], compete for resources and adjust their growth with a precision that, in the words of Professor Anna Keller of the University of Zurich, 'would [[exceed|exceed]] the capabilities of many engineered control systems'.", "At the heart of this activity is [[photosynthesis|photosynthesis]], the [[mechanism|mechanism]] by which green tissue converts sunlight, water and carbon [[dioxide|dioxide]] into sugars. A key [[enzyme|enzyme]], known as Rubisco, acts as a biological [[catalyst|catalyst]] in this reaction, and it is thought to be the most abundant protein on Earth. Yet plants also [[respire|respire]], burning some of those sugars to release energy, particularly at night. The balance between the two processes determines how fast a plant can grow, and it explains why [[vegetation|vegetation]] in the [[jungle|jungle]] differs so sharply from that on an open [[meadow|meadow]]. Beneath the rainforest canopy, [[shade-tolerant|shade-tolerant]] species have [[evolved|evolve]] broad, thin leaves that capture scattered light, whereas grasses in full sun favour narrow blades and rapid water [[uptake|uptake]].", "Plants also measure time. So-called [[short-day|short-day]] species, such as chrysanthemums, flower only when nights grow longer in autumn, while others [[bloom|bloom]] in response to lengthening spring days. Growers in commercial [[horticulture|horticulture]] exploit this by controlling greenhouse lighting so that a [[tulip|tulip]] or [[violet|violet]] reaches the market at exactly the right moment. Temperature matters too: many seeds will not [[germinate|germinate]] until they have experienced a period of cold, a safeguard that prevents a [[seed|seed]] from sprouting during a brief warm spell in winter. Once conditions are [[optimal|optimal/optimum]], each [[bud|bud]] can [[burgeon|burgeon]] into new shoots within days, and fruit begins to [[ripen|ripen]] as sugars accumulate.", "Some of the most striking discoveries concern communication. When caterpillars attack a leaf, many species release an [[aromatic|aromatic]] chemical [[scent|scent]] that warns neighbouring plants and attracts predatory wasps. [[mint|mint]] and other herbs produce strong-smelling oils that discourage grazing, while a rose protects each stem with a sharp [[thorn|thorn]]. Dr Kenji Morita of Kyoto University has shown that infected cells can even [[destruct|destruct]] deliberately, sacrificing a small patch of tissue to stop a [[fungus|fungus]] spreading along a [[branch|branch]]. At a larger scale, genetic [[mutation|mutation]] and natural [[variation|variation]] supply the raw material for adaptation, and [[hybridisation|hybridisation/hybridization]] between related species has produced many of the crops on which humans rely. Breeders who develop new varieties may patent them, and farmers who save and resell protected seed can [[infringe|infringe]] those rights.", "Equally important is what happens after a plant dies. Fallen leaves, a broken [[bough|bough]] or an entire [[trunk|trunk]] will gradually [[rot|rot]] as bacteria and [[mould|mould/mold]] break down the tissue. As the material begins to [[decay|decay]], it releases each [[nutrient|nutrient]] back into the soil, where living roots can absorb it. Gardeners imitate this cycle when they [[stack|stack]] cuttings in a compost [[heap|heap]], turn it with a [[spade|spade]] and [[rake|rake]] dead leaves from the [[lawn|lawn]] to add to the pile. Without organisms that [[decompose|decompose]] organic matter, forests would be buried under their own debris within decades.", "Fire is a more dramatic agent of renewal. In Australia, a [[bush fire|bush fire]] can sweep through eucalyptus forest with [[immense|immense]] speed, and some trees appear to [[wither|wither]] and [[perish|perish]] completely. Many, however, resprout from protected buds beneath the bark, and certain [[perennial|perennial]] shrubs release their seeds only after intense heat. Partly burnt wood becomes [[charcoal|charcoal]], which can persist in the soil for centuries and improve its ability to hold water. For this reason, specialists in [[forestry|forestry]] increasingly argue that it is not always wise to [[extinguish|extinguish]] every fire, since controlled burning can reduce the build-up of fuel and [[counterbalance|counterbalance]] the risk of a far larger blaze.", "Water plants offer a further example of adaptation. Tall [[reed|reed]] beds filter pollutants from rivers, and a single-celled [[alga|alga]] living inside coral provides much of the energy that allows a tropical [[reef|reef]] to grow. When seas become too warm, however, the coral expels these partners, and the whole system can fall into [[ruin|ruin]]. Similarly, an excess of fertiliser washed from farmland can cause algae to multiply out of control, a reminder that human activity can easily [[undermine|undermine]] natural balances.", "Agriculture itself has a mixed record. Farmers have long had to [[plough|plough/plow]] the soil, [[sow|sow]] crops and [[pluck|pluck]] each [[weed|weed]] by hand, and in mountainous regions they cut a [[terrace|terrace]] into hillsides to [[reclaim|reclaim]] steep land for rice. Hedges, woods and ponds were often [[demolished|demolish]] to create larger fields, with a [[considerable|considerable]] loss of habitat for wildlife. Today, conservation schemes encourage farmers to [[rear|rear]] livestock alongside wildflower strips that supply [[pollen|pollen]] to bees, and to leave [[straw|straw]] on the surface to protect the soil.", "Climate change is now testing these adaptations on a global scale. Field trials run by the International Rice Research Institute in the Philippines suggest that every one-degree rise in night-time temperature can reduce rice harvests by roughly ten per cent, largely because plants [[respire|respire]] more rapidly in warm conditions and use up the sugars they have stored. Breeders are therefore searching wild relatives of crops for genes that confer tolerance to heat, drought and flooding. One promising variety, developed by crossing cultivated rice with a hardier wild species, can survive two weeks under water. Critics caution that such solutions take years to reach farmers and cannot replace reductions in emissions, but supporters point out that, without them, food production in the most vulnerable regions could fall sharply within a generation. Meanwhile, some researchers worry that public interest in plants has grown [[stale|stale]], with many people meeting them only as cut flowers in a [[vase|vase]] or a [[bundle|bundle]] of herbs at the supermarket. Professor Keller disagrees. Plants, she notes, remain the foundation of every food chain, and the more scientists learn about them, the less passive they seem."], "qs": [{"type": "TFNG", "q": "Rubisco is believed to be the most abundant protein on Earth.", "a": "TRUE", "para": "B"}, {"type": "TFNG", "q": "All eucalyptus trees are killed by bush fires.", "a": "FALSE", "para": "F"}, {"type": "TFNG", "q": "Short-day plants are more profitable for commercial growers than other plants.", "a": "NOT GIVEN", "para": "C"}, {"type": "SA", "q": "What do some caterpillar-damaged plants release to warn their neighbours?", "a": "aromatic scent", "para": "D"}, {"type": "SA", "q": "What does partly burnt wood become in the soil?", "a": "charcoal", "para": "F"}, {"type": "SA", "q": "Which tall water plants filter pollutants from rivers?", "a": "reed beds", "para": "G"}], "vocab": {"decompose": {"w": "decompose", "p": "v.", "z": "分解；腐烂", "ids": ["1|词根|pos|decompose|0"]}, "exceed": {"w": "exceed", "p": "v.", "z": "超出", "ids": ["1|词根|ced|exceed|0"]}, "destruct": {"w": "destruct", "p": "v.", "z": "（使）自毁", "ids": ["1|词根|struct|destruct|0"]}, "scent": {"w": "scent", "p": "n./v.", "z": "气味；香味；使具有香味", "ids": ["1|词根|sens|scent|0"]}, "respire": {"w": "respire", "p": "v.", "z": "呼吸", "ids": ["1|词根|spir|respire|0"]}, " ", "z": "原野；场地；野外", "ids": ["1|其他|其他单词|field|14"]}, "fungus": {"w": "fungus", "p": "n.", "z": "真菌", "ids": ["1|其他|其他单词|fungus|17"]}, "germinate": {"w": "germinate", "p": "v.", "z": "发芽", "ids": ["1|其他|其他单词|germinate|19"]}, "heap": {"w": "heap", "p": "n.", "z": "（大而杂乱的）堆", "ids": ["1|其他|其他单词|heap|23"]}, "horticulture": {"w": "horticulture", "p": "n.", "z": "园艺学；园艺", "ids": ["1|其他|其他单词|horticulture|24"]}, "jungle": {"w": "jungle", "p": "n.", "z": "丛林", "ids": ["1|其他|其他单词|jungle|25"]}, "lawn": {"w": "lawn", "p": "n.", "z": "草地；草坪", "ids": ["1|其他|其他单词|lawn|26"]}, "meadow": {"w": "meadow", "p": "n.", "z": "草地；牧草", "ids": ["1|其他|其他单词|meadow|27"]}, "mint": {"w": "mint", "p": "n./v.", "z": "薄荷；铸币厂/铸造（硬币）", "ids": ["1|其他|其他单词|mint|28"]}, "mould/mold": {"w": "mould/mold", "p": "n./v.", "z": " 霉菌/发霉", "ids": ["1|其他|其他单词|mould/mold|29"]}, "pine": {"w": "pine", "p": "n.", "z": "松树；松木", "ids": ["1|其他|其他单词|pine|33"]}, "plough/plow": {"w": "plough/plow", "p": "n./v.", "z": " 犁；耕", "ids": ["1|其他|其他单词|plough/plow|34"]}, "pluck": {"w": "pluck", "p": "v.", "z": "采；摘", "ids": ["1|其他|其他单词|pluck|35"]}, "rake": {"w": "rake", "p": "n./v.", "z": "耙子；耙；搜索", "ids": ["1|其他|其他单词|rake|37"]}, "rear": {"w": "rear", "p": "v./n.", "z": "培养；抚养；饲养；后部", "ids": ["1|其他|其他单词|rear|38"]}, "reed": {"w": "reed", "p": "n.", "z": "芦苇", "ids": ["1|其他|其他单词|reed|39"]}, "reef": {"w": "reef", "p": "n.", "z": "暗礁", "ids": ["1|其他|其他单词|reef|40"]}, "ripen": {"w": "ripen", "p": "v.", "z": "使成熟", "ids": ["1|其他|其他单词|ripen|41"]}, "ruin": {"w": "ruin", "p": "v./n.", "z": "毁坏；摧毁；毁灭；废墟", "ids": ["1|其他|其他单词|ruin|43"]}, "seed": {"w": "seed", "p": "n.", "z": "种子", "ids": ["1|其他|其他单词|seed|44"]}, "short-day": {"w": "short-day", "p": "adj.", "z": "短日照的", "ids": ["1|其他|其他单词|short-day|45"]}, "sow": {"w": "sow", "p": "v.", "z": "播种", "ids": ["1|其他|其他单词|sow|46"]}, "spade": {"w": "spade", "p": "n.", "z": "铲；锹", "ids": ["1|其他|其他单词|spade|47"]}, "stack": {"w": "stack", "p": "n./v.", "z": "堆；垛；堆积", "ids": ["1|其他|其他单词|stack|48"]}, "stale": {"w": "stale", "p": "adj.", "z": "不新鲜的；没有新意的；陈腐的", "ids": ["1|其他|其他单词|stale|49"]}, "straw": {"w": "straw", "p": "n.", "z": "稻草；麦秆；吸管", "ids": ["1|其他|其他单词|straw|50"]}, "thorn": {"w": "thorn", "p": "n.", "z": "刺；荆棘", "ids": ["1|其他|其他单词|thorn|52"]}, "trunk": {"w": "trunk", "p": "n.", "z": "树干；躯干；大箱子", "ids": ["1|其他|其他单词|trunk|54"]}, "tulip": {"w": "tulip", "p": "n.", "z": "郁金香", "ids": ["1|其他|其他单词|tulip|55"]}, "undermine": {"w": "undermine", "p": "v.", "z": "破坏；逐渐削弱", "ids": ["1|其他|其他单词|undermine|56"]}, "vase": {"w": "vase", "p": "n.", "z": "瓶；花瓶", "ids": ["1|其他|其他单词|vase|57"]}, "vine": {"w": "vine", "p": "n.", "z": "葡萄藤", "ids": ["1|其他|其他单词|vine|58"]}, "weed": {"w": "weed", "p": "n.", "z": "杂草", "ids": ["1|其他|其他单词|weed|59"]}, "wither": {"w": "wither", "p": "v.", "z": "（使）枯萎", "ids": ["1|其他|其他单词|wither|60"]}, "yield": {"w": "yield", "p": "v./n.", "z": "产出；屈服；服从；产量；投资收益", "ids": ["1|其他|其他单词|yield|61"]}}}, {"id": "p03", "theme": "动物保护", "part": 1, "parts": 1, "title": "Counting What Counts", "subtitle": "New science and old partnerships in the effort to protect wildlife", "paras": ["Every region of the world has its own [[flora|flora]] and [[fauna|fauna]], yet scientists estimate that wild [[vertebrate|vertebrate]] populations have declined by roughly two-thirds since 1970. Most of these losses [[stem|stem]] from familiar causes: habitat loss, hunting, pollution and disease. What is changing, according to Dr Ruth Okafor of the Zoological Society of London, is how conservationists respond. 'For decades we relied on an [[intuitive|intuitive]] sense of which animals were in trouble,' she explains. 'Now we can measure it, and the results are often surprising.'", "Much of this new precision comes from technology. [[acoustic|acoustic]] sensors hidden in forests record the [[roar|roar]] of a lion, the call of an [[owl|owl]] or the chirping of a [[cricket|cricket]], allowing researchers to monitor [[nocturnal|nocturnal]] species that are rarely seen. [[optical|optical]] camera traps capture images of a [[cub|cub]] following its mother or a [[hare|hare]] crossing a trail, and software can identify individuals from the pattern of their fur or the shape of a [[paw|paw]] print. Even waste is informative: by analysing the hormones animals [[excrete|excrete]], scientists can tell whether they are stressed, pregnant or suffering from a [[parasite|parasite]].", "Understanding an animal's [[anatomy|anatomy]] and [[metabolism|metabolism]] is equally important. A [[tortoise|tortoise]] may live for over a century because its metabolism is extremely slow, while bats and some [[amphibian|amphibian]] species remain [[dormant|dormant]] for months during winter. Many frogs [[secrete|secrete]] toxins through their skin as a [[defensive|defensive]] measure, and a [[squirrel|squirrel]] will [[curl|curl]] its tail over its body for warmth. Such details matter when conservationists plan reintroductions, because an animal released into the wrong conditions may fail to [[breed|breed]].", "Disease has emerged as a particularly serious threat. Since the 1990s, an [[epidemic|epidemic]] caused by a chytrid fungus has wiped out more than ninety frog species, and bird flu has killed thousands of each [[swan|swan]], [[goose|goose]] and [[seal|seal]] along European coasts. A single [[microbe|microbe]] or [[germ|germ]] can [[proliferate|proliferate]] rapidly where animals gather in a dense [[crowd|crowd]], whether a [[flock|flock]] of migrating birds or a [[herd|herd]] of [[buffalo|buffalo]] at a water hole. Diseases may also [[originate|originate]] in domestic animals: [[cattle|cattle]] and even a [[donkey|donkey]] kept near wildlife can pass on infections to wild relatives.", "Insects present different problems. In many countries, honeybee colonies have collapsed, leaving each [[cell|cell]] in the [[hive|hive]] empty. A healthy colony may [[swarm|swarm]] each spring, but mites that [[bite|bite]] the bees and spread viruses have weakened many. Paradoxically, farmers have also tried to [[exterminate|exterminate]] wasps and other insects they regard as a [[pest|pest]], despite the fact that some that [[sting|sting]] people also control crop-eating caterpillars. Ecologists point out that a [[sparrow|sparrow]] or [[swallow|swallow]] raising its [[brood|brood]] may [[devour|devour]] thousands of insects in a few weeks, so pesticides that remove insects indirectly starve birds as well.", "Captive breeding has long been a cornerstone of conservation. When a species is reduced to a few dozen individuals, keeping them [[captive|captive]] allows keepers to pair each [[mate|mate]] carefully, help eggs to [[hatch|hatch]] and raise each [[calf|calf]] or [[pup|pup]] in safety. But this approach must [[undergo|undergo]] constant review. Animals raised by humans can become [[tame|tame]], losing the fear that protects them in the wild, and small groups may suffer from [[sterility|sterility]] caused by inbreeding. Some breeders have allowed related species to [[interbreed|interbreed]] in order to add genetic diversity, but critics argue that animals which [[hybridize|hybridize/hybridise]] in this way may produce [[offspring|offspring]] that are no longer truly part of the original [[subgroup|subgroup]]. Many Californian condors released since the 1990s are the [[descendant|descendant]] of just twenty-two birds, yet their numbers continue to grow.", "Behaviour is another focus. Researchers studying [[courtship|courtship]] in birds of prey have found that a male [[falcon|falcon]] or [[hawk|hawk]] performs aerial displays to show his fitness, while in pheasants it is the [[cock|cock]] whose bright [[plume|plume]] attracts a female. In the Galápagos, the size of a finch's [[beak|beak]] changes measurably within a few generations as droughts alter the seeds available, a reminder that species can adapt quickly when given the chance. Studies of the [[primate|primate]] species of central Africa show that chimpanzees [[alternate|alternate]] between foraging in groups and alone, and that young apes learn to [[crawl|crawl]] and then climb by watching adults. In a wetland reserve, a fish may [[spawn|spawn]] among reeds, use each [[fin|fin]] to guard its eggs, and later see the eggs [[devoured|devour]] by a [[crow|crow]] or a heron.", "Large mammals nevertheless attract the most attention and the most funding, a bias some ecologists regard as unhelpful. Elephants, which use their [[trunk|trunk]] to feed and greet one another, are still killed for [[ivory|ivory]], a trade many describe as [[cruel|cruel]]. Rhinos are hunted for their [[horn|horn]], and big cats for their skins and each [[claw|claw]]. A [[herbivore|herbivore]] such as the elephant shapes whole landscapes, and a [[carnivore|carnivore]] such as the tiger controls the numbers of its prey. Their survival also depends on people who live alongside them in conditions of [[subsistence|subsistence]] farming, where a single raid by an elephant can destroy a family's harvest.", "Solutions increasingly [[derive|derive]] from cooperation with local communities. In Kenya, a [[shepherd|shepherd]] may receive compensation when a lion attacks his sheep, and farmers in Europe are paid to plant a [[hedge|hedge]] or leave a [[barn|barn]] open for owls. In India, villagers [[harness|harness]] the tourism value of tigers, and fences with an electric [[bar|bar]] keep elephants out of crops without harming them. A [[botanist|botanist]] restoring native plants may help insects to [[creep|creep]] back into a landscape, and birds that [[lay|lay]] eggs on the ground can [[rub|rub]] along with livestock if grazing is timed carefully. Conservation, Dr Okafor insists, is no longer a battle against the [[brute|brute]] force of nature, but a negotiation in which a [[bull|bull]] elephant, a dairy herd and a [[throng|throng]] of tourists must all find space. Even the wild boar, whose coarse [[bristles|bristle]] were once prized for brushes, is now managed rather than simply hunted."], "qs": [{"ty "]}, "seal": {"w": "seal", "p": "n./v.", "z": "海豹；封条；图章；密封", "ids": ["2|其他|其他单词|seal|84"]}, "shepherd": {"w": "shepherd", "p": "n.", "z": "牧羊人，羊倌", "ids": ["2|其他|其他单词|shepherd|85"]}, "sparrow": {"w": "sparrow", "p": "n.", "z": "麻雀", "ids": ["2|其他|其他单词|sparrow|87"]}, "spawn": {"w": "spawn", "p": "n./v.", "z": "（鱼、蛙的）卵；产卵；引起", "ids": ["2|其他|其他单词|spawn|88"]}, "squirrel": {"w": "squirrel", "p": "n.", "z": "松鼠", "ids": ["2|其他|其他单词|squirrel|90"]}, "stem": {"w": "stem", "p": "v./n.", "z": "起源于；来自/茎；梗", "ids": ["2|其他|其他单词|stem|91"]}, "sting": {"w": "sting", "p": "v./n.", "z": "刺；叮；（使）感觉刺痛；鳌针；蜇痛", "ids": ["2|其他|其他单词|sting|92"]}, "swallow": {"w": "swallow", "p": "n.", "z": "燕子", "ids": ["2|其他|其他单词|swallow|93"]}, "swan": {"w": "swan", "p": "n.", "z": "天鹅", "ids": ["2|其他|其他单词|swan|94"]}, "swarm": {"w": "swarm", "p": "n.", "z": "（蜜蜂昆虫的）一大群；（快速移动的）人群", "ids": ["2|其他|其他单词|swarm|95"]}, "tame": {"w": "tame", "p": "v./adj.", "z": "驯养；制服/驯服的；乏味的", "ids": ["2|其他|其他单词|tame|96"]}, "throng": {"w": "throng", "p": "n./v.", "z": "人群/群集", "ids": ["2|其他|其他单词|throng|97"]}, "tortoise": {"w": "tortoise", "p": "n.", "z": "龟；陆龟", "ids": ["2|其他|其他单词|tortoise|98"]}, "trunk": {"w": "trunk", "p": "n.", "z": "象鼻", "ids": ["2|其他|其他单词|trunk|99"]}}}, {"id": "p04", "theme": "太空探索", "part": 1, "parts": 1, "title": "Touching the Comets", "subtitle": "How space missions turned distant lights into laboratories", "paras": ["For most of human history, the night sky was a [[spectacle|spectacle]] to be admired rather than a place to be explored. Ancient observers tracked the movements of the Sun, Moon and planets along the [[ecliptic|ecliptic]], the apparent path the Sun traces across the sky over a year, and many cultures used these patterns for [[astrology|astrology]], believing that the positions of [[celestial|celestial]] bodies could predict human fortunes. Scientific [[astronomy|astronomy]] gradually separated itself from such beliefs, and in the last sixty years it has been transformed again: instead of merely watching the [[cosmos|cosmos]], we now send machines to touch it.", "Comets offer a good illustration of how far this has progressed. A [[comet|comet]] is a [[chunk|chunk]] of ice, dust and rock, typically only a few kilometres in [[diameter|diameter]], that travels on a highly elongated [[orbit|orbit]] around the Sun. When it approaches the inner solar system, solar heating turns its ice directly into gas, which bursts out through a [[vent|vent]] in the surface and forms a glowing [[envelope|envelope]] known as the coma. Sunlight and the solar wind push this material away to form two tails, one of dust following a gentle [[curve|curve]] and a straighter one made of electrically charged [[ions|ion]]. Because comets have changed little since the solar system formed some 4.6 billion years ago, astronomers regard them as frozen time capsules.", "Until recently, studying them meant relying on telescopes. By splitting the light from a comet into its [[spectrum|spectrum]], researchers at ground-based facilities such as the European Southern [[observatory|observatory]] in Chile could identify individual [[molecules|molecule]] in the coma, because each [[substance|substance]] absorbs and emits light at [[distinct|distinct]] wavelengths. Some signals, however, lie in the [[ultraviolet|ultraviolet]] range, which is blocked by Earth's atmosphere, and so space telescopes became essential. Even then, the nucleus itself was usually hidden inside the bright coma, barely [[discernible|discernible]] as a point of light.", "The first close encounters came in 1986, when an international fleet of spacecraft met Halley's Comet. The European [[probe|probe]] Giotto passed within 600 kilometres of the nucleus in a high-speed [[flyby|flyby]], returning images of a dark, potato-shaped body. Its camera was damaged by a dust [[particle|particle]] moments before closest approach, an episode that led some engineers almost to [[despair|despair]], but the mission proved that comets could be studied at close range.", "More ambitious was the European Space Agency's Rosetta mission, launched in 2004. Reaching its target, Comet 67P, required a ten-year [[expedition|expedition]] in which the [[spacecraft|spacecraft]] used the gravity of Earth and Mars to gain speed, since no available [[propulsion|propulsion]] system could provide enough thrust on its own. During the long cruise, every non-essential [[circuit|circuit]] was switched off to save power, and the craft spent almost three years in hibernation, and the craft communicated with Earth through a large dish [[antenna|antenna]]. In 2014 Rosetta entered orbit around the comet, and its lander, Philae, became the first [[spaceship|spaceship]] to touch down on a comet's surface. Philae bounced into a shadowed [[crater|crater]], but it still returned valuable data on the [[composition|composition]] of the surface.", "The results challenged several assumptions. The water on 67P was found to contain a much higher proportion of heavy hydrogen than Earth's oceans, suggesting that comets like it were not the main source of terrestrial water. On the other hand, Rosetta detected the amino acid glycine and many organic [[compounds|compound]], showing that comets carry the basic ingredients of life. Dr Martin Lehner of the Max Planck Institute argues that such molecules could have formed in [[interstellar|interstellar]] clouds before the Sun was born, when cold dust grains allowed simple chemicals to [[synthesise|synthesise/synthesize]] more complex ones.", "Not every visitor from space is as fragile. A [[meteorite|meteorite]] is a [[fragment|fragment]] of rock or metal that survives its passage through the atmosphere and reaches the ground, and each [[specimen|specimen]] recovered provides direct physical evidence of conditions in the early solar system. Some contain tiny mineral grains older than the Sun, and a few even preserve what look like the chemical traces of water. Claims that certain meteorites hold microscopic [[fossils|fossil]] of bacteria, however, remain highly controversial, and most scientists consider the evidence for them weak rather than [[overwhelming|overwhelming]].", "Larger impacts have shaped planetary history. The [[formation|formation]] of the Moon is widely attributed to a [[cataclysmic|cataclysmic]] [[collision|collision]] between the young Earth and a Mars-sized body, and an asteroid roughly ten kilometres across is thought to have ended the age of the dinosaurs 66 million years ago. In 2022, NASA's DART mission deliberately crashed a craft into a small asteroid and shortened its orbit, demonstrating that a dangerous object could, in principle, be deflected. Computer models used to plan such missions treat the asteroid's interior almost like a [[fluid|fluid]], predicting how loosely bound rubble will [[squash|squash]] and spread on impact, at a scale far larger than the [[atom|atom]] but governed by similarly fundamental laws.", "Looking ahead, scientists hope to return comet material to Earth for laboratory analysis, while physicists explore whether [[quantum|quantum]] sensors could detect faint gravitational signals from small bodies across a [[radius|radius]] of many thousands of kilometres. Such projects are not without critics. Some economists argue that missions costing well over a billion euros are hard to justify when public budgets are under pressure, and that cheaper telescopes could answer many of the same questions. Supporters reply that only direct sampling can reveal the internal structure of a comet or the exact chemistry of its dust, and that the engineering developed for these missions, from autonomous navigation to radiation-hardened electronics, often finds uses on Earth. There is also a practical argument: knowing what asteroids and comets are made of is essential if humanity is ever to defend itself against one on a collision course. Each step, Dr Lehner notes, narrows the gap between the [[terrestrial|terrestrial]] laboratory and the distant objects that once inspired only wonder."], "qs": [{"type": "TFNG", "q": "Comets have changed considerably since the solar system formed.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Giotto's camera was damaged shortly before its closest approach to Halley's Comet.", "a": "TRUE", "para": "D"}, {"type": "TFNG", "q": "Philae continued to operate for several years after landing.", "a": "NOT GIVEN", "para": "E"}, {"type": "SA", "q": "What is the glowing envelope around a comet called?", "a": "the coma", "para": "B"}, {"type": "SA", "q": "Which amino acid did Rosetta detect on Comet 67P?", "a": "glycine", "para": "F"}, {"type": "SA", "q": "Which NASA mission deliberately crashed into an asteroid in 2022?", "a": "DART", "para": "H"}], "vocab": {"astrology": {"w": "astrology", "p": "n.", "z": "占星术；占星学", "ids": ["3|词根|stell|astrology|0"]}, "astronomy": {"w": "astronomy", "p": "n.", "z": "天文学", "ids": ["3|词根|stell|astronomy|2"]}, "interstellar": {"w": "interstellar", "p": "adj.", "z": "星际的", "ids": ["3|词根|stell|interstellar|3"]}, "specimen": {"w": "specimen", "p": "n.", "z": "样品；标本", "ids": ["3|词根|spect|specimen|0"]}, "spectacle": {"w": "spectacle", "p": "n.", "z": "壮观的景象；奇观", "ids": ["3|词根|spect|spectacle|1"]}, "spectrum": {"w": "spectrum", "p": "n.", "z": "光谱；范围", "ids": ["3|词根|spect|spectrum|2"]}, "radius": {"w": "radius", "p": "n.", "z": "半径", "ids": ["3|词根|radi|radius|1"]}, "diameter": {"w": "diameter", "p": "n.", "z": "直径", "ids": ["3|词根|meter|diameter|0"]}, "fragment": {"w": "fragment", "p": "n./v.", "z": "碎片；片段；（使）碎裂", "ids": ["3|词根|frag|fragment|0"]}, "composition": {"w": "composition", "p": "n.", "z": "成分；构成；作品；创作", "ids": ["3|词根|pos|composition|0"]}, "propulsion": {"w": "propulsion", "p": "n.", "z": "推进力", "ids": ["3|词根|pel|propulsion|0"]}, "circuit": {"w": "circuit", "p": "n.", "z": "线路；电路；巡回", "ids": ["3|词根|cycl|circuit|0"]}, "particle": {"w": "particle", "p": "n.", "z": "颗粒；微粒；极小量", "ids": ["3|词根|part|particle|0"]}, "formation": {"w": "forma : "（航天器对行星或卫星的）飞掠", "ids": ["3|后缀|-y|flyby|0"]}, "cataclysmic": {"w": "cataclysmic", "p": "adj.", "z": "剧变的；灾难的", "ids": ["3|后缀|-ic|cataclysmic|0"]}, "ecliptic": {"w": "ecliptic", "p": "n.", "z": "黄道", "ids": ["3|后缀|-ic|ecliptic|1"]}, "celestial": {"w": "celestial", "p": "adj.", "z": "天上的", "ids": ["3|后缀|-al|celestial|0"]}, "spaceship": {"w": "spaceship", "p": "n.", "z": "宇宙飞船", "ids": ["3|后缀|-ship|spaceship|0"]}, "antenna": {"w": "antenna", "p": "n.", "z": "天线", "ids": ["3|其他|其他单词|antenna|0"]}, "chunk": {"w": "chunk", "p": "n.", "z": "厚块", "ids": ["3|其他|其他单词|chunk|2"]}, "comet": {"w": "comet", "p": "n.", "z": "彗星", "ids": ["3|其他|其他单词|comet|3"]}, "curve": {"w": "curve", "p": "n.", "z": "曲线；弧线", "ids": ["3|其他|其他单词|curve|4"]}, "fluid": {"w": "fluid", "p": "n./adj.", "z": "液体；流体。流动的", "ids": ["3|其他|其他单词|fluid|7"]}, "fossil": {"w": "fossil", "p": "n.", "z": "化石", "ids": ["3|其他|其他单词|fossil|8"]}, "ion": {"w": "ion", "p": "n.", "z": "离子", "ids": ["3|其他|其他单词|ion|10"]}, "molecule": {"w": "molecule", "p": "n.", "z": "分子", "ids": ["3|其他|其他单词|molecule|14"]}, "orbit": {"w": "orbit", "p": "n.", "z": "轨道", "ids": ["3|其他|其他单词|orbit|15"]}, "spacecraft": {"w": "spacecraft", "p": "n.", "z": "宇宙飞船", "ids": ["3|其他|其他单词|spacecraft|17"]}, "squash": {"w": "squash", "p": "v./n.", "z": "压扁；壁球", "ids": ["3|其他|其他单词|squash|18"]}}}, {"id": "p05", "theme": "学校教育", "part": 1, "parts": 2, "title": "Learning by Discovery", "subtitle": "Should children work out the rules of mathematics and science for themselves?", "paras": ["For most of the nineteenth and early twentieth centuries, the [[doctrine|doctrine]] that governed the classroom was simple: knowledge passed from teacher to pupil, and the pupil's task was to store it. Children would [[recite|recite]] multiplication tables in unison, copy an [[extract|extract]] from a set text, or write out passages that the teacher would [[dictate|dictate]] word for word. The aim of [[compulsory|compulsory]] schooling, introduced across much of Europe in this period, was to eliminate [[illiteracy|illiteracy]] and to produce a population that was [[literate|literate]] and could [[multiply|multiply]], [[divide|divide]] and [[subtract|subtract]] with confidence. By this narrow measure the system [[accomplished|accomplish]] a great deal. Yet critics argued from the [[outset|outset]] that drilling of this kind left many children unable to [[comprehend|comprehend]] what they were actually doing.", "The alternative, usually called discovery or [[inductive|inductive]] learning, starts from the opposite end. Instead of being given a [[formula|formula]] and told to apply it, pupils examine particular [[instances|instance]] and are encouraged to [[infer|infer]] the general rule. A class might measure dozens of shapes before working out that the area of a [[rectangle|rectangle]] is the product of its length and width, or compare the [[proportion|proportion]] of salt that will [[dissolve|dissolve]] in warm and cold water before anyone mentions solubility. Advocates believe that a rule pupils [[discern|discern]] for themselves is understood more deeply than one they are simply told, and that the habit of asking questions will [[persist|persist]] long after particular facts are forgotten. The goal, they say, is to [[instil|instil/instill]] a willingness to [[inquire|inquire/enquire]], not merely to transmit answers.", "The approach is [[controversial|controversial]], and the [[extent|extent]] of its benefits has been fiercely disputed. In 2019 researchers at the Lindqvist [[Institute|institute]] for Educational Research in Uppsala set out to test it on a large scale. Their study, which grew out of a doctoral [[dissertation|dissertation]] by the psychologist Maria Ekholm, followed 2,400 pupils aged eleven to thirteen in schools [[composed|compose]] of very different intakes. Half were taught a unit on [[fractions|fraction]] and [[decimals|decimal]] through structured discovery tasks; the rest received conventional instruction from a teacher who would first [[demonstrate|demonstrate]] each method and then set practice exercises.", "The results contained an apparent [[contradiction|contradiction]]. Immediately after the unit, the explicitly taught group scored higher on routine calculations: they could find a [[remainder|remainder]], identify the [[dividend|dividend]] in a division problem and convert a [[fraction|fraction]] to a [[decimal|decimal]] more quickly. Six months later, however, the discovery group performed better on unfamiliar problems, such as deciding whether a number was [[rational|rational]] or predicting what would happen to the strength of a solution if more water were added to [[dilute|dilute]] it. Ekholm's interpretation is that the two methods help pupils [[attain|attain]] different goals. Explicit teaching builds speed and accuracy; discovery builds a flexible understanding that [[manifests|manifest]] itself only when pupils meet something new.", "Not everyone accepts this reading. The [[eminent|eminent]] cognitive scientist Professor David Okafor has warned that researchers tend to [[overestimate|overestimate]] what beginners can work out alone. Children have limited working memory, he points out, and asking them to reconstruct centuries of mathematics unaided can leave them [[inert|inert]] and frustrated rather than curious. He also identifies a weakness [[inherent|inherent]] in many such studies: it is easy to [[presume|presume]] that gains are caused by the teaching method when they may simply reflect the enthusiasm of volunteer teachers. 'We should not [[suppose|suppose]] that because a lesson feels active, it is effective,' he argues. In his view, a secure grasp of basic facts is a [[prerequisite|prerequisite]] for genuine discovery: only once pupils know the rules can they [[deduce|deduce]] their consequences.", "Practical considerations also shape what schools can do. Discovery science requires more than enthusiasm. Experiments involving substances that [[emit|emit]] [[noxious|noxious]] fumes need close supervision and a [[deliberate|deliberate]] judgement about which activities justify the risk. Departments must keep an [[inventory|inventory]] of equipment and chemicals, and local officials may [[inspect|inspect]] laboratories before a [[permit|permit]] for certain work is granted. Field trips raise further questions of [[logistics|logistics]], from transport to overnight [[accommodation|accommodation]]. A widely watched [[documentary|documentary]] in 2021, which followed a school that had become [[notorious|notorious]] for badly organised excursions, gave the issue national [[coverage|coverage]] and provided fresh [[impetus|impetus]] for clearer official guidance.", "Teachers themselves often [[perceive|perceive]] the choice between the two methods as a false one, and the most successful classrooms in the Uppsala study were [[diverse|diverse]] in approach. A teacher might [[elicit|elicit]] predictions about how a ball rolling down a slope would behave, let pupils test them, and only then explain the [[mechanics|mechanics]] formally. Doing this well demands considerable [[expertise|expertise]]. A teacher must judge when to [[indulge|indulge]] an unusual line of reasoning and when to intervene, when to let a class [[consult|consult]] an [[encyclopedia|encyclopedia/encyclopaedia]] and when to insist that they reason from evidence, and how to maintain [[discipline|discipline]] while allowing noise and movement. Ekholm found that teachers who were [[conscious|conscious]] of these decisions, and who had earned their pupils' [[respect|respect]], produced the strongest results of all. Even [[minor|minor]] changes, such as pausing before giving an answer, made a measurable difference.", "Structural changes have complicated the picture. The [[merger|merger]] of small rural schools into larger ones has given some pupils access to well-equipped laboratories, but it has also increased class sizes. Meanwhile, the [[prestige|prestige]] attached to examination results pushes many schools towards a crowded [[syllabus|syllabus]] that leaves little time for exploration. In [[contrast|contrast]], several countries have reduced content so that pupils can study each [[subject|subject]] in greater depth, introducing topics such as the [[matrix|matrix]] or the geometry of the [[sphere|sphere]] later but more thoroughly. Supporters insist that this need not [[displace|displace]] explicit teaching; it simply changes its timing.", "Where does this leave policymakers? Many researchers now [[speculate|speculate]] that the debate will be [[resolved|resolve]] not by choosing a side but by defining the conditions under which each method works best. Ekholm's team is currently investigating the key [[parameters|parameter]], including pupils' age, prior knowledge and the [[degree|degree]] of guidance offered. Their [[empirical|empirical]] work, together with a growing [[bibliography|bibliography]] of studies from other countries, points to a [[profound|profound]] change in the question itself: not whether children should discover or be told, but how much of each, for whom, and when."], "qs": [{"type": "TFNG", "q": "Compulsory schooling in nineteenth-century Europe was intended partly to reduce illiteracy.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "The Uppsala study found that discovery learning produced better results in routine calculation immediately after teaching.", "a": "FALSE", "para": "D"}, {"type": "TFNG", "q": "Professor Okafor has carried out his own large-scale classroom study.", "a": "NOT GIVEN", "para": "E"}, {"type": "SA", "q": "What did Maria Ekholm write that led to the Uppsala study?", "a": "doctoral dissertation", "para": "C"}, {"type": "SA", "q": "According to Okafor, what limited mental capacity do children have?", "a": "working memory", "para": "E"}, {"type": "SA", "q": "What type of film in 2021 brought national attention to school excursions?", "a": "documentary", "para": "F"}], "vocab": {"in etus", "p": "n.", "z": "推动；促进；动量；惯性", "ids": ["4|前缀|-im-|impetus|0"]}}}, {"id": "p06", "theme": "学校教育", "part": 2, "parts": 2, "title": "The First-Year Gap", "subtitle": "Why do so many capable students struggle when they move from school to university?", "paras": ["Each autumn, thousands of new students arrive for [[matriculation|matriculation]], collect a glossy [[brochure|brochure]] of advice, stand in a [[queue|queue]] to register for classes and move into a [[dorm|dorm]] for the first time. [[Orientation|orientation]] week is designed to make the transition smooth, yet for a significant number the first [[semester|semester]] proves far harder than expected. Universities have long tried to [[diagnose|diagnose]] the cause. A recent [[audit|audit]] of first-year results at eight British and American institutions offers some answers, and they are not the ones most admissions staff would have predicted.", "The [[audit|audit]], led by Dr Helen Marsh, [[dean|dean]] of undergraduate studies at Northbrook University, examined the records of 11,000 students over five years. Its [[principal|principal]] finding was that failure in the first year was rarely caused by a lack of [[aptitude|aptitude]]. Students who struggled had entered with grades almost [[identical|identical]] to those who did well. What separated them was the way they had learned at school. Those who had been trained to [[cram|cram]] for examinations, memorising model answers in the final weeks of [[term|term]], found that this strategy collapsed when courses demanded independent reading and a [[thorough|thorough]] understanding of ideas.", "Mathematics provided the clearest evidence. Many students who had passed school [[algebra|algebra]] and even introductory [[calculus|calculus]] turned out to have only a [[rudimentary|rudimentary]] grasp of the ideas beneath the procedures. They could solve a standard [[equation|equation]] but were lost when a [[variable|variable]] appeared in an unfamiliar position. Asked to estimate the [[ratio|ratio]] between the area of a [[triangle|triangle]] and that of the square containing it, or the length of a square's [[diagonal|diagonal]], they reached for half-remembered formulas instead of reasoning. Marsh describes such students as 'calculating but not [[numerate|numerate]]': fluent in [[arithmetic|arithmetic]] routines yet unable to judge whether an answer was sensible. One lecturer recalled a student who calculated that a [[hollow|hollow]] [[cone|cone]] the size of a coffee cup would hold forty litres, and saw nothing strange in the result.", "The problem was not confined to mathematics. In chemistry, students who could state the [[elementary|elementary]] facts that water will [[boil|boil]] at 212 degrees [[Fahrenheit|fahrenheit]] and that ice will [[melt|melt]] at 32 often could not explain either change. In physics laboratories, a reading taken from the wrong end of a [[scale|scale]], or a value recorded with a [[minus|minus]] sign in the wrong place, could leave a circuit measurement several [[volts|volt]] out without anyone noticing. Biology [[tutors|tutor]] described students who could define how yeast causes sugar to [[ferment|ferment]] or how an [[acid|acid]] attacks tooth enamel, but who could not design a simple experiment to test either. Environmental science students knew that the [[ozone|ozone]] layer was thinning yet struggled to read the graphs on which that knowledge rests.", "Reading posed similar difficulties. Students accustomed to being given the [[gist|gist]] of a text were now expected to [[skim|skim]] a long reading list, decide what mattered and then [[scrutinise|scrutinise/scrutinize]] key arguments in detail. Many found academic writing [[obscure|obscure]] and missed the [[nuance|nuance]] that separates an established result from a mere [[postulate|postulate]]. Under pressure, a minority chose to [[plagiarise|plagiarise/plagiarize]], copying passages rather than learning to [[quote|quote]] and cite sources properly. Marsh insists that most such cases were less a disciplinary [[affair|affair]] than a symptom of students who had never been shown how to [[sketch|sketch]] an argument in their own words.", "Northbrook has responded by redesigning its first-year [[curriculum|curriculum]] so that the [[practical|practical]] skills of study are taught explicitly rather than [[assumed|assume]]. Every new student is assigned a [[mentor|mentor]], usually a [[sophomore|sophomore]] who meets them weekly, as well as an academic [[tutor|tutor]] responsible for a small group. A new [[elective|elective]] module, 'Thinking with Numbers', introduces [[novice|novice]] students, including those studying [[accounting|accounting]] and history, to estimation, the [[mean|mean]] and spread of a data set, and the habit of checking whether a [[sum|sum]] makes sense. Teaching relies heavily on [[analogy|analogy]] and puzzles: one popular session presents each statistical idea as a [[riddle|riddle]], while another asks how the price of a single [[ounce|ounce]] of gold has changed over a century. Any [[query|query]] can be posted on an online [[forum|forum]], and staff on a weekly [[roster|roster]] answer within a day. Lecturers find that small changes in the [[width|width]] of the questions asked, from narrow drills to open problems, [[stimulate|stimulate]] curiosity and [[spur|spur]] students to explain rather than memorise.", "Early results are encouraging. First-year failure rates have fallen by a third, and use of drop-in support has [[quadrupled|quadruple]]. Former students are involved too: [[alumni|alumni]], including a retired [[ambassador|ambassador]] and a serving [[diplomat|diplomat]], return to describe how the skills they [[acquired|acquire]] in their first year shaped their careers. Marsh [[reckons|reckon]] that the change in culture matters as much as any single [[scheme|scheme]]. 'We used to [[assume|assume]] that students arrived ready to work independently,' she says. 'Now we [[deem|deem]] independence a skill to be taught, like any other.'", "Not all academics are convinced. Professor James Whitlow, a mildly [[eccentric|eccentric]] historian admired for his [[wit|wit]], argues that universities risk becoming extended secondary schools. He likes to tell the [[tale|tale]] of his own first lecture, sitting in the back [[row|row]] while a professor fumbled with a [[reel|reel]] of film for twenty minutes before giving up and speaking without notes. Nobody guided the students, he recalls, and yet they learned to cope. Whitlow, who studied at one of the first [[co-educational|coed/co-educational]] colleges in his university, [[esteems|esteem]] the older model for producing confident, [[all-round|all-round/all-around]] graduates, many of whom went on to win a research [[fellowship|fellowship]] or a postgraduate [[diploma|diploma]].", "Marsh replies that the older system was effectively a lottery. Her team's [[painstaking|painstaking]] analysis shows that those who coped were disproportionately students whose schools or families had already taught them to study independently. Independence, she argues, is not the opposite of support; it is the result of it. The real task for universities, she concludes, is to make sure that every student, and not only the fortunate few, receives that support from the very first week."], "qs": [{"type": "TFNG", "q": "The audit found that most students who failed in their first year had entered university with lower grades.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Students who had passed calculus at school always understood the ideas behind it.", "a": "FALSE", "para": "C"}, {"type": "TFNG", "q": "The 'Thinking with Numbers' module is compulsory for all first-year students.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "What study habit, practised in the last weeks of term, failed many students at university?", "a": "cram", "para": "B"}, {"type": "SA", "q": "Which type of student usually acts as a
