": "宽度", "ids": ["4|其他|其他单词|width|145"]}, "wit": {"w": "wit", "p": "n.", "z": "风趣的人；机智；风趣；智慧", "ids": ["4|其他|其他单词|wit|147"]}}}, {"id": "p07", "theme": "科技发明", "part": 1, "parts": 1, "title": "Listening to the City", "subtitle": "How acoustic sensors are transforming the maintenance of urban sewers", "paras": ["Beneath every modern city lies a hidden network of pipes that most residents never think about until something goes wrong. [[Sewage|sewage]] and storm water are carried away by [[drainage|drainage]] systems that, in many older cities, were built more than a century ago. When a pipe cracks or a [[pump|pump]] fails, the first sign is often a flooded street or a polluted river. For decades, engineers had little choice but to wait for such failures and repair them afterwards. A new generation of sensing technology, however, is beginning to change the way these systems are monitored and maintained.", "The traditional method of inspecting a sewer was slow and unpleasant. Workers had to enter the pipes in person, which required careful [[ventilation|ventilation]] to remove dangerous gases, or push a camera on a cable along the pipe. Early camera systems recorded grainy images onto a videotape [[cassette|cassette]], and an engineer would later review hours of footage to [[assess|assess]] the condition of the pipe. Such surveys were expensive, so most pipes were examined only once every ten or twenty years. Damage could therefore [[accumulate|accumulate]] unnoticed for long periods, and the [[circumstances|circumstance]] that led to a collapse were rarely understood.", "The change began almost by accident. In 2014, a team of researchers at the Delft [[Polytechnic|polytechnic]] Institute were testing a [[high-definition|high-definition]] camera robot when they [[stumbled|stumble]] on an unexpected finding. The robot's microphone, intended only as an [[accessory|accessory]], picked up distinctive sounds wherever water was escaping through a crack. The team, led by the engineer Pieter van Dam, realised that the [[audio|audio]] recordings could reveal leaks far more cheaply than images. 'The sound was a [[byproduct|byproduct]] of the survey,' van Dam later explained, 'but it turned out to be the most useful thing we collected.'", "Building on this observation, the group set out to [[devise|devise]] a permanent listening system. They [[assembled|assemble]] small, robust sensors, each the size of a coffee mug, which could be fixed to the inside of a pipe and left there for years. Each device combines a microphone with a pressure [[gauge|gauge]] and a flow meter, making it a far more [[versatile|versatile]] [[instrument|instrument]] than a simple camera. The sensors send their readings by [[wireless|wireless]] link to a central computer, where software compares the sounds with a library of known patterns. Because each sensor records the exact moment a sound arrives, the system can [[pinpoint|pinpoint]] the position of a leak to within half a metre.", "Powering the sensors proved one of the hardest problems. Batteries had to be replaced too often, so the team developed a tiny turbine [[generator|generator]] that turns as water flows past, using a set of [[gears|gear]] to raise its speed. In dry periods, when there is little flow, an [[auxiliary|auxiliary]] battery takes over. This arrangement is an important [[contingency|contingency]]: during droughts the sensors continue to [[operate|operate]], so that the network never goes completely silent. To save energy, each sensor reduces its data to a simple [[binary|binary]] message, effectively reporting 'normal' or 'abnormal', and sends a full recording only when something unusual is detected.", "The data have proved valuable well beyond the detection of leaks. By [[counting|count]] the [[pumping|pump]] cycles at each station, engineers can predict when a [[hydraulic|hydraulic]] [[pump|pump]] is likely to fail and replace it beforehand. In winter, the sensors also record where warm, moist air from the sewers [[condenses|condense]] on cold pipe walls, a process that slowly corrodes concrete. Some cities are experimenting with ways to [[distil|distil/distill]] the huge volume of raw readings into a single daily score for each street, which allows managers to see at a glance where repair crews are most needed. Others [[utilise|utilise/utilize]] the same network to monitor illegal dumping of chemicals.", "Supporters argue that these systems [[facilitate|facilitate]] a shift from repair to prevention. In Rotterdam, where around four hundred sensors were installed between 2018 and 2021, the city reports that emergency repairs fell by nearly a third. Before the system was introduced, officials admit, there was no [[accurate|accurate]] record of how many pipes were in poor condition. Insurance companies have also taken an interest, since they can now base their prices on measured risk rather than estimates. The benefits extend downstream as well. When heavy rain threatens to overwhelm the system, the network can warn the city's main treatment [[facility|facility]] hours in advance, giving operators time to open storage tanks and prevent untreated waste from overflowing into rivers. In the past, such overflows were often discovered only after fish had died or beaches had been closed.", "Not everyone is convinced, however. Some engineers point out that the technology works best in modern plastic pipes and is less reliable in older brick tunnels, where sound travels unpredictably. Privacy campaigners have raised a different concern. Microphones placed beneath homes could, in theory, pick up conversations, and critics want companies to [[disclose|disclose]] exactly what is recorded and how long it is stored. Manufacturers insist that the devices filter out human speech, but they have been reluctant to allow independent testing. There are also questions about who should own the data: the cities that pay for the sensors or the private firms that [[operate|operate]] the software.", "Despite these doubts, the technology is spreading. What began as a small [[gizmo|gizmo]] attached to a camera robot has become the [[pivot|pivot]] of a much larger effort to make urban infrastructure intelligent. Researchers are now borrowing ideas from [[optics|optics]], using lasers inside fibre cables to detect vibration along entire pipes rather than at fixed points. If this approach succeeds, the [[domain|domain]] of sewer engineering, long regarded as the least glamorous [[realm|realm]] of civil engineering, may become one of its most advanced. As van Dam puts it, the [[usage|usage]] of sound has turned the hidden city into one that can finally be heard. Engineers who once had to [[invent|invent]] explanations after a disaster can now see problems coming."], "qs": [{"type": "TFNG", "q": "Early sewer camera systems stored their recordings on videotape.", "a": "TRUE", "para": "B"}, {"type": "TFNG", "q": "The Delft team originally designed the robot's microphone to detect leaks.", "a": "FALSE", "para": "C"}, {"type": "TFNG", "q": "Rotterdam plans to double the number of sensors in its network.", "a": "NOT GIVEN", "para": "G"}, {"type": "SA", "q": "What does the turbine use to increase its speed?", "a": "gears", "para": "E"}, {"type": "SA", "q": "What takes over from the turbine during dry periods?", "a": "auxiliary battery", "para": "E"}, {"type": "SA", "q": "What type of pipes does the technology work best in?", "a": "plastic pipes", "para": "H"}], "vocab": {"polytechnic": {"w": "polytechnic", "p": "adj./n.", "z": "有关多种工艺的；理工学院", "ids": ["5|词根|techn|polytechnic|0"]}, "facility": {"w": "facility", "p": "n.", "z": "设备；便利", "ids": ["5|词根|fac|facility|0"]}, "versatile": {"w": "versatile", "p": "adj.", "z": "多功能的；多用途的", "ids": ["5|词根|vert|versatile|1"]}, "high-definition": {"w": "high-definition", "p": "adj.", "z": "高分辨率的", "ids": ["5|词根|fin|high-definition|0"]}, "devise": {"w": "devise", "p": "v.", "z": "设计；发明", "ids": ["5|词根|vis|devise|0"]}, "accessory": {"w": "accessory", "p": "n.", "z": "附件；配件", "ids": ["5|词根|ced|accessory|0"]}, "instrument": {"w": "instrument", "p": "n.", "z": "仪器；工具；乐器", "ids": ["5|词根|struct|instrument|0"]}, "generator": {"w": "generator", "p": "n.", "z": "发电机", "ids": ["5|词根|gen|generator|0"]}, "assess": {"w": "assess", "p": "v.", "z": "评估；估算", "ids": ["5|词根|sed|assess|0"]}, "accurate": {"w": "accurate", "p": "adj.", "z": "准确的；正确无误的", "ids": ["5|词根|cur|accurate|0"]}, "facilitate": {"w": "facilitate", "p": "v.", "z": "使便利；促进", "ids": ["5|词根|faci|facilitate|0"]}, "distil/distill": {"w": "distil/distill", "p": "v.", "z": "蒸馏；提取...的精华", "ids": ["5|词根|dist|distil/distill|0"]}, "circumstance": {"w": "circumstance", "p": "n.", "z": "情况；条件；环境；境遇", "ids": ["5|词根|subst|circumstance|0"]}, "disclose": {"w": "disclose", "p": "v.", "z": "揭露；透露", "ids": ["5|词根|claud|disclose|0"]}, "sewage": {"w": "sewage", "p": "n.", "z": "（下水道的）污水", "ids": ["5|词根|sew|sewage|0"]}, "hydraulic": {"w": "hydraulic", "p": "adj.", "z": "水力的；液压的", "ids": ["5|词根|hydr|hydraulic|0"]}, "condense": {"w": "condense", "p": "v.", "z": "减缩；精简；（使气体）凝结", "ids": ["5|词根|dens|condense|0"]}, "ventilation": {"w": "ventilation", "p": "n.", "z": "通风设备；通风", "ids": ["5|词根|ventw|ventilation|0"]}, "invent": {"w": "invent", "p": "v.", "z": "发明，创造", "ids": ["5|词根|invent|invent|0"]}, "operate": {"w": "operate", "p": "v.", "z": "操作；运营；做手术", "ids": ["5|词根|oper|operate|0"]}, "contingency": {"w": "contingency", "p": "n.", "z": "意外事件；可能发生的事", "ids": ["5|前缀|-co-|contingency|3"]}, "count": {"w": "count", "p": "v.", "z": "计算", "ids": ["5|前缀|-co-|count|4"]}, "binary": {"w": "binary", "p": "adj.", "z": "二进制的；二元的", "ids": ["5|前缀|-bi-|binary|0"]}, "auxiliary": {"w": "auxiliary", "p": "adj.", "z": "辅助的；协助的；备用的", "ids": ["5|后缀|-y|auxiliary|0"]}, "utilise/utilize": {"w": "utilise/utilize", "p": "v.", "z": "利用", "ids": ["5|后缀|-ise|utilise/utilize|0"]}, "cassette": {"w": "cassette", "p": "n.", "z": "盒式磁带；底片盒", "ids": ["5|后缀|-ette|cassette|0"]}, "drainage": {"w": "drainage", "p": "n.", "z": "排水系统；排水", "ids": ["5|后缀|-age|drainage|0"]}, "accumulate": {"w": "accumulate", "p": "v.", "z": "累积；（数额）不断增加", "ids": ["5|其他|其他单词|accumulate|0"]}, "assemble": {"w": "assemble", "p": "v.", "z": "集合；聚集", "ids": ["5|其他|其他单词|assemble|2"]}, "audio": {"w": "audio", "p": "adj.", "z": "声音的", "ids": ["5|其他|其他单词|audio|4"]}, "byproduct": {"w": "byproduct", "p": "n.", "z": "副产品", "ids": ["5|其他|其他单词|byproduct|8"]}, "domain": {"w": "domain", "p": "n.", "z": "（活动、学问等的）领域；领土；领地", "ids": ["5|其他|其他单词|domain|11"]}, "gauge": {"w": "gauge", "p": "n./v.", "z": "测量仪器；测量；判断", "ids": ["5|其他|其他单词|gauge|22"]}, "gear": {"w": "gear", "p": "n./v.", "z": "齿轮；传动装置；使适合", "ids": ["5|其他|其他单词|gear|23"]}, "gizmo": {"w": "gizmo", "p": "n.", "z": "小装置", "ids": ["5|其他|其他单词|gizmo|24"]}, "optics": {"w": "optics", "p": "n.", "z": "光学", "ids": ["5|其他|其他单词|optics|33"]}, "pinpoint": {"w": "pinpoint", "p": "v./n.", "z": "精确指明...位置/针尖；极小的事物", "ids": ["5|其他|其他单词|pinpoint|36"]}, "pivot": {"w": "pivot", "p": "n.", "z": "枢轴；支点；中心；重点", "ids": ["5|其他|其他单词|pivot|37"]}, "pump": {"w": "pump", "p": "n./v.", "z": "泵；（用泵）抽", "ids": ["5|其他|其他单词|pump|38"]}, "realm": {"w": "realm", "p": "n.", "z": "领域", "ids": ["5|其他|其他单词|realm|40"]}, "stumble": {"w": "stumble", "p": "v.", "z": "犯错误；绊脚；跌跌撞撞的走", "ids": ["5|其他|其他单词|stumble|44"]}, "usage": {"w": "usage", "p": "n.", "z": "使用；用法", "ids": ["5|其他|其他单词|usage|48"]}, "wireless": {"w": "wireless", "p": "adj.", "z": "无线的", "ids": ["5|其他|其他单词|wireless|49"]}}}, {"id": "p08", "theme": "文化历史", "part": 1, "parts": 1, "title": "Towers Towards Heaven", "subtitle": "What cathedrals and pagodas reveal about the societies that built them", "paras": ["Few buildings in human history have demanded as much labour, wealth and devotion as the great religious towers of Europe and Asia. The Gothic [[cathedral|cathedral]] of medieval France and the Buddhist [[pagoda|pagoda]] of China and Japan emerged in very different cultures, yet both rose far higher than any practical need required. Why did societies with limited resources invest so heavily in structures whose main purpose was to point towards the sky? Historians, architects and [[anthropologists|anthropologist]] have offered competing answers, and their debate reveals a great deal about how communities express what they hold [[sacred|sacred]].", "The simplest explanation is religious. For the medieval Christian, a [[cathedral|cathedral]] was a model of heaven on earth, and its height and light were meant to convey the [[majesty|majesty]] of God. A [[bishop|bishop]] who commissioned such a building saw it as an act of worship, and the daily [[ritual|ritual]] of the Mass, accompanied by a [[choir|choir]] whose voices echoed through the stone vaults, completed its meaning. In a similar way, the [[pagoda|pagoda]] developed from the Indian stupa, a mound built to hold the relics of the Buddha. Each storey symbolised a stage on the path to enlightenment, and [[monks|monk]] would walk around its base in prayer. Both buildings, in other words, turned abstract belief into a physical, [[hallowed|hallowed]] space.", "Yet religion alone cannot explain why such towers multiplied so rapidly at particular moments. Professor Ingrid Halvorsen, an [[anthropologist|anthropologist]] at the University of Bergen, argues that they must also be understood as statements of power. In Europe, the great age of [[cathedral|cathedral]] building coincided with the height of [[feudalism|feudalism]], when land and loyalty bound peasants to lords and lords to kings. Towns competed to build the tallest spire, and members of the [[nobility|nobility]] paid for chapels and windows that displayed their family arms. 'A [[cathedral|cathedral]] was a declaration of [[status|status]],' Halvorsen writes, 'as much for the city as for the Church.' In China, too, emperors sponsored [[pagodas|pagoda]] to demonstrate [[imperial|imperial]] authority and to link their rule with heavenly favour.", "Evidence from [[archaeology|archaeology]] supports this view. Excavations at several French building sites have uncovered workers' tools and accounts showing that construction was frequently halted by war, plague and lack of money. One [[cathedral|cathedral]] took more than three centuries to complete, and each [[setback|setback]] was followed by renewed fundraising campaigns in which wealthy donors were promised prominent burial places. Names of benefactors were often [[engraved|engrave]] on stones inside the building, so that their generosity would be remembered by every future [[inhabitant|inhabitant]] of the town. Building in the face of such [[adversity|adversity]], Halvorsen suggests, was itself a way for a community to show its strength.", "Establishing a reliable [[chronology|chronology]] of these buildings has not been easy. Many towers were damaged by fire or earthquake and rebuilt in later styles, and written records are often contradictory. Historians are wary of relying on a single colourful [[anecdote|anecdote]], such as the popular story that a Japanese [[pagoda|pagoda]] survived a severe earthquake because its central pillar swayed like a tree. Engineers have since shown that the story contains some truth, but much of what tourists are told remains legend rather than fact. To overcome these gaps, researchers increasingly combine documents with scientific methods. Tree-ring dating of roof timbers, for example, can show when the wood was cut, and analysis of mortar can reveal whether a wall belongs to the original structure or to a later repair. Such techniques have overturned several long-accepted dates and shown that some supposedly ancient towers are only a few hundred years old.", "Contact between the two traditions came later. When Jesuit [[missionaries|missionary]] reached China in the sixteenth century, they described [[pagodas|pagoda]] to readers at home as [[exotic|exotic]] wonders, while Chinese scholars were equally curious about the churches the newcomers built. The [[missionaries|missionary]] had to learn the complex [[etiquette|etiquette]] of the [[imperial|imperial]] court, and reports of their work were sent back to the [[Pope|pope]] in Rome. These accounts helped shape European ideas of Asia for generations, often presenting a simplified and romantic picture that later scholars have had to correct.", "The meaning of these buildings has continued to change. During the [[Renaissance|renaissance]], many Italian architects regarded Gothic [[cathedrals|cathedral]] as crude and old-fashioned, preferring the domes and columns of classical Rome. Only in the nineteenth century did a wave of [[nostalgia|nostalgia]] for the Middle Ages restore their reputation, inspiring copies across Europe and America. In the twentieth century, [[cathedrals|cathedral]] and [[pagodas|pagoda]] alike became monuments to national identity, shaped by changing political [[ideology|ideology]], and were restored at great public expense after the destruction of war, sometimes with more attention to symbolism than to historical accuracy.", "Today, many of these buildings [[thrive|thrive]] as never before, though often in new roles. They attract millions of visitors, host concerts and serve as settings for state ceremonies. Some have even become a kind of [[celebrity|celebrity]], appearing in films and on social media far more often than in religious services. When fire badly damaged Notre-Dame in Paris in 2019, the [[incident|incident]] prompted an outpouring of grief around the world and donations from people with no religious connection to the building. Commentators described the restoration as an [[epic|epic]] effort of national renewal, while some critics asked whether the same money might have been better spent on [[humanitarian|humanitarian]] causes.", "Such debates suggest that the great towers are still doing what they were built to do: gathering people together around shared values. Each generation [[inherits|inherit]] them from the last and gives them new meanings, just as [[aboriginal|aboriginal]] peoples in many parts of the world have preserved and reinterpreted their own [[sacred|sacred]] sites. Following [[convention|convention]], we tend to classify these buildings as religious architecture. In reality, they are also records of power, money, skill and memory, which may be why so many communities still regard them as worth saving, whatever their personal beliefs."], "qs": [{"type": "TFNG", "q": "The pagoda developed from an Indian structure built to hold relics of the Buddha.", "a": "TRUE", "para": "B"}, {"type": "TFNG", "q": "Renaissance architects in Italy greatly admired Gothic cathedrals.", "a": "FALSE", "para": "G"}, {"type": "TFNG", "q": "Jesuit missionaries built the first church in Beijing.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "What social system was at its height during the great age of cathedral building?", "a": "feudalism", "para": "C"}, {"type": "SA", "q": "What were donors promised in return for funding cathedral construction?", "a": "burial places", "para": "D"}, {"type": "SA", "q": "Which part of a Japanese pagoda is said to have swayed during an earthquake?", "a": "central pillar", "para": "E"}], "vocab": {"renaissance": {"w": "renaissance", "p": "n.", "z": "the Renaissance 文艺复兴时期", "ids": ["6|词根|nat|renaissance|1"]}, "status": {"w": "status", "p": "n.", "z": "地位；身份；尊重程度；仰慕程度；重视程度；（社交媒体上的）状态，近况", "ids": ["6|词根|sta|status|0"]}, "missionary": {"w": "missionary", "p": "n.", "z": "传教士", "ids": ["6|词根|mit|missionary|0"]}, "adversity": {"w": "adversity", "p": "n.", "z": "逆境", "ids": ["6|词根|vert|adversity|0"]}, "convention": {"w": "convention", "p": "n.", "z": "惯例；大型会议", "ids": ["6|词根|ven|convention|0"]}, "engrave": {"w": "engrave", "p": "v.", "z": "在...上雕刻", "ids": ["6|词根|grav|engrave|0"]}, "incident": {"w": "incident", "p": "n.", "z": "（尤指不寻常的、重要的或暴力的）事件；（两国之间的）冲突", "ids": ["6|词根|cis|incident|0"]}, "humanitarian": {"w": "humanitarian", "p": "n./adj.", "z": "人道主义者；人道主义的；博爱的", "ids": ["6|词根|homin|humanitarian|0"]}, "ritual": {"w": "ritual", "p": "n.", "z": "仪式", "ids": ["6|词根|rit|ritual|0"]}, "chronology": {"w": "chronology", "p": "n.", "z": "年代学；年表；事件发生的顺序表", "ids": ["6|词根|chron|chronology|0"]}, "inhabitant": {"w": "inhabitant", "p": "n.", "z": "居民", "ids": ["6|前缀|-in-|inhabitant|0"]}, "inherit": {"w": "inherit", "p": "v.", "z": "继承（财产等）；经遗传获得", "ids": ["6|前缀|-in-|inherit|1"]}, "exotic": {"w": "exotic", "p": "adj.", "z": "外来的；异国情调的", "ids": ["6|前缀|-ex-|exotic|0"]}, "aboriginal": {"w": "aboriginal", "p": "n./adj.", "z": "Aboriginal 澳大利亚土人/本土原有的；土著的", "ids": ["6|前缀|-ab-|aboriginal|0"]}, "imperial": {"w": "imperial", "p": "adj.", "z": "帝国的", "ids": ["6|前缀|-im-|imperial|0"]}, "majesty": {"w": "majesty", "p": "n.", "z": "威严；壮观；陛下", "ids": ["6|后缀|-y|majesty|2"]}, "cathedral": {"w": "cathedral", "p": "n.", "z": "大教堂", "ids": ["6|后缀|-al|cathedral|0"]}, "celebrity": {"w": "celebrity", "p": "n.", "z": "名人；名誉", "ids": ["6|后缀|-ity|celebrity|0"]}, "nobility": {"w": "nobility", "p": "n.", "z": "高尚的品质；贵族", "ids": ["6|后缀|-ity|nobility|1"]}, "archaeology": {"w": "archaeology", "p": "n.", "z": "考古学", "ids": ["6|后缀|-ology|archaeology|0"]}, "ideology": {"w": "ideology", "p": "n.", "z": "意识形态；思想体系", "ids": ["6|后缀|-ology|ideology|1"]}, "feudalism": {"w": "feudalism", "p": "n.", "z": "封建主义；封建制度", "ids": ["6|后缀|-ism|feudalism|0"]}, "anthropologist": {"w": "anthropologist", "p": "n.", "z": "人类学家", "ids": ["6|后缀|-ist|anthropologist|0"]}, "etiquette": {"w": "etiquette", "p": "n.", "z": "礼仪；礼节", "ids": ["6|后缀|-ette|etiquette|0"]}, "anecdote": {"w": "anecdote", "p": "n.", "z": "轶事；奇闻", "ids": ["6|其他|其他单词|anecdote|0"]}, "bishop": {"w": "bishop", "p": "n.", "z": "主教", "ids": ["6|其他|其他单词|bishop|5"]}, "choir": {"w": "choir", "p": "n.", "z": "唱诗班", "ids": ["6|其他|其他单词|choir|6"]}, "epic": {"w": "epic", "p": "n./adj.", "z": "史诗；宏大的", "ids": ["6|其他|其他单词|epic|8"]}, "hallowed": {"w": "hallowed", "p": "adj.", "z": "神圣的；收尊崇的", "ids": ["6|其他|其他单词|hallowed|10"]}, "monk": {"w": "monk", "p": "n.", "z": "僧侣", "ids": ["6|其他|其他单词|monk|15"]}, "nostalgia": {"w": "nostalgia", "p": "n.", "z": "思乡之情；怀旧之情", "ids": ["6|其他|其他单词|nostalgia|17"]}, "pagoda": {"w": "pagoda", "p": "n.", "z": "佛塔", "ids": ["6|其他|其他单词|pagoda|18"]}, "pope": {"w": "Pope", "p": "n.", "z": "教皇", "ids": ["6|其他|其他单词|Pope|19"]}, "sacred": {"w": "sacred", "p": "adj.", "z": "神圣的；宗教的", "ids": ["6|其他|其他单词|sacred|24"]}, "setback": {"w": "setback", "p": "n.", "z": "挫折；阻碍", "ids": ["6|其他|其他单词|setback|25"]}, "thrive": {"w": "thrive", "p": "v.", "z": "繁荣；兴旺发达；茁壮成长", "ids": ["6|其他|其他单词|thrive|28"]}}}, {"id": "p09", "theme": "语言演化", "part": 1, "parts": 1, "title": "From Pictures to Sounds", "subtitle": "How humans learned to turn speech into lasting marks", "paras": ["Spoken language is at least tens of thousands of years old, but writing is a remarkably recent invention. The earliest true writing systems appeared only around five thousand years ago, in Mesopotamia and Egypt, and were later developed independently in China and Central America. For most of human history, therefore, knowledge, law and memory were passed on through [[verbal|verbal]] means alone: people would [[narrate|narrate]] the deeds of their ancestors, and the [[eloquence|eloquence]] of a skilled speaker was one of the most valued talents in any community. How, then, did people begin to turn speech into lasting marks, and why did writing systems develop in such different directions?", "The first step appears to have been the [[pictograph|pictograph]], a simple drawing that stands for an object. A picture of an ox meant an ox; a picture of the sun meant the sun. Such signs are easy to understand but severely limited. It is difficult to draw an abstract idea such as 'justice', and impossible to show grammatical relationships. A [[pictograph|pictograph]] can represent a [[noun|noun]], but it cannot easily show whether that [[noun|noun]] is [[singular|singular]] or [[plural|plural]], nor can it stand for a [[preposition|preposition]] such as 'under' or a [[conjunction|conjunction]] such as 'because'. Pictures, in short, could record lists of goods but not complete sentences.", "In Mesopotamia, scribes overcame this problem gradually. They pressed a reed into wet clay, producing marks shaped like a [[wedge|wedge]], which is why their script is known as cuneiform. Over centuries, the signs became simpler and less like pictures. More importantly, many came to represent sounds rather than things. A sign for a word could be borrowed to write another word that sounded the same, much as a modern puzzle might use a picture of an eye to mean 'I'. This 'rebus principle' allowed scribes to write names, verbs and grammatical endings, and it marked the true beginning of writing. By around 2500 BCE, cuneiform was being used not only for trade records but also for letters, laws and literature, including some of the oldest surviving poems in the world.", "Chinese writing took a different path. Each character is a [[logogram|logogram]], a sign that represents a whole word or meaningful unit rather than a single sound. Many characters combine a [[semantic|semantic]] element, which hints at the meaning, with a phonetic element that indicates roughly how to [[pronounce|pronounce]] it. Because the system is based on meaning, speakers of very different forms of Chinese can read the same text, even though they would not understand one another's speech. A reader of one [[dialect|dialect]] may [[pronounce|pronounce]] a character in a completely different way from a reader of another, yet both [[interpret|interpret]] it in the same way.", "Other writing systems moved further towards sound. Some represent each [[syllable|syllable]] with a separate sign, as Japanese kana does. The alphabet, developed by Semitic peoples around 1800 BCE, went further still, using a small number of signs for individual sounds. Early alphabets recorded only the [[consonant|consonant]] in each [[syllable|syllable]]; readers were expected to supply each [[vowel|vowel]] from context. It was the Greeks who added [[vowel|vowel]] letters, creating a system that could, in principle, match each [[phoneme|phoneme]] of the language with a single symbol. Modern [[phonetics|phonetics]] has shown, however, that no ordinary alphabet achieves this perfectly. English spelling is notoriously far from [[consistent|consistent]], partly because pronunciation has changed while spelling has not.", "Not all records of information took the form of writing as we know it. The Inca of South America governed a vast empire without a script, relying instead on the khipu, a set of coloured cords tied with patterns of [[knots|knot]]. Most scholars long assumed these recorded only numbers, such as taxes and population counts. The anthropologist Sabine Hyland, however, has advanced the [[contention|contention]] that some khipus may also have encoded names and narratives. If she is right, the boundary between counting and writing may be less sharp than once believed. Researchers are now attempting to [[decipher|decipher]] surviving examples, though fewer than a thousand remain.", "Every writing system loses something that speech possesses. A spoken [[utterance|utterance]] carries [[intonation|intonation]] and the rise and fall of [[inflection|inflection]], which can turn a statement into a question or a compliment into an insult. Writing must rely on punctuation and word choice to suggest these effects, and it often fails. Equally, the meaning of an [[idiom|idiom]] such as 'break the ice' cannot be worked out from its parts, so learners of a language must memorise it. Linguists who [[compile|compile]] dictionaries face a similar challenge: they must explain each word's range of meanings, list its [[synonym|synonym]] and [[antonym|antonym]], and show how a [[prefix|prefix]] or [[suffix|suffix]] changes its sense, as when 'happy' becomes 'unhappy' or 'happiness'.", "Writing also changed language itself. Once texts could be studied at leisure, scholars began to analyse grammar systematically. Ancient Indian and Greek grammarians described how words combine into a [[clause|clause]], how a [[pronoun|pronoun]] replaces a [[noun|noun]], and how the rules of [[syntax|syntax]] govern word order. Written texts attracted [[commentary|commentary]], with later scholars attempting to [[paraphrase|paraphrase]] difficult passages in simpler language for students. In this way, writing did not merely record speech; it encouraged people to think about language as an object in its own right.", "The story is far from over. Digital communication has produced new hybrid forms, such as emoji, which some researchers compare with ancient [[pictographs|pictograph]]. Whether these will develop into a genuine writing system is doubtful, since they still depend on the words around them for precise meaning. Yet their popularity shows that the human impulse to combine pictures and sounds, which gave rise to the first scripts, remains as strong as ever. Whatever new forms appear, they are likely to be shaped by the same tension that has run through five thousand years of writing: the need to be quick and simple on the one hand, and the desire to capture the full richness of human speech on the other."], "qs": [{"type": "TFNG", "q": "Writing was developed independently in more than one part of the world.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "The earliest alphabets included letters for vowels.", "a": "FALSE", "para": "E"}, {"type": "TFNG", "q": "The Inca used khipus for more than a thousand years.", "a": "NOT GIVEN", "para": "F"}, {"type": "SA", "q": "What material did Mesopotamian scribes press reeds into?", "a": "wet clay", "para": "C"}, {"type": "SA", "q": "Which people first added vowel letters to the alphabet?", "a": "the Greeks", "para": "E"}, {"type": "SA", "q": "What did the Inca use instead of a script to keep records?", "a": "khipu", "para": "F"}], "vocab": {"verbal": {"w": "verbal", "p": "adj.", "z": "口头的；言语的", "ids": ["7|词 nce", "p": "n.", "z": "说话；言论", "ids": ["7|后缀|-ance|utterance|0"]}, "antonym": {"w": "antonym", "p": "n.", "z": "反义词", "ids": ["7|其他|其他单词|antonym|1"]}, "clause": {"w": "clause", "p": "n.", "z": "从句；分句；条款", "ids": ["7|其他|其他单词|clause|3"]}, "dialect": {"w": "dialect", "p": "n.", "z": "方言；地方话", "ids": ["7|其他|其他单词|dialect|4"]}, "eloquence": {"w": "eloquence", "p": "n.", "z": "雄辩；流利的口才", "ids": ["7|其他|其他单词|eloquence|5"]}, "idiom": {"w": "idiom", "p": "n.", "z": "习语", "ids": ["7|其他|其他单词|idiom|7"]}, "knot": {"w": "knot", "p": "n.", "z": "（绳、线的）结；（树枝上的）节子", "ids": ["7|其他|其他单词|knot|8"]}, "logogram": {"w": "logogram", "p": "n.", "z": "语标，缩记符（如& 、@等） ;非字母语言的字符", "ids": ["7|其他|其他单词|logogram|10"]}, "narrate": {"w": "narrate", "p": "v.", "z": "讲（故事）；叙述", "ids": ["7|其他|其他单词|narrate|11"]}, "noun": {"w": "noun", "p": "n.", "z": "名词", "ids": ["7|其他|其他单词|noun|12"]}, "singular": {"w": "singular", "p": "n./adj.", "z": "单数；非凡的；单数的", "ids": ["7|其他|其他单词|singular|16"]}, "suffix": {"w": "suffix", "p": "n.", "z": "后缀", "ids": ["7|其他|其他单词|suffix|17"]}, "synonym": {"w": "synonym", "p": "n.", "z": "同义词", "ids": ["7|其他|其他单词|synonym|19"]}, "syntax": {"w": "syntax", "p": "n.", "z": "句法", "ids": ["7|其他|其他单词|syntax|20"]}, "vowel": {"w": "vowel", "p": "n.", "z": "元音", "ids": ["7|其他|其他单词|vowel|21"]}, "wedge": {"w": "wedge", "p": "n.", "z": "楔子；楔形物；楔形文字", "ids": ["7|其他|其他单词|wedge|22"]}}}, {"id": "p10", "theme": "娱乐运动", "part": 1, "parts": 1, "title": "From the Big Top to the Stadium", "subtitle": "How leisure in the industrial age turned participants into spectators", "paras": ["Historians of leisure have long noted that the way people spend their free time reveals as much about a society as its laws or its wars. Before the industrial era, most [[recreation|recreation]] was local and seasonal: a village [[feast|feast]] after the harvest, a [[picnic|picnic]] on a saint's day, or an informal game played on common land. According to Dr Helen Marsh of the University of Leeds, the nineteenth century transformed this pattern. 'Within two generations,' she argues, 'the [[pastime|pastime]] of the few became the paid entertainment of the many, and the participant was gradually replaced by the [[spectator|spectator]].'", "The travelling [[circus|circus]] offers one of the clearest examples. Earlier troupes had performed in the open air or in rented halls, but by the 1850s the larger companies carried enormous [[tents|tent]] that could seat several thousand people. Acrobats would [[leap|leap]] from one trapeze to another, [[glide|glide]] across the ring on wires or [[plunge|plunge]] from a high platform into a net, while clowns would [[tumble|tumble]], [[hop|hop]] and [[flip|flip]] head over heels to [[mimic|mimic]] the more dangerous acts. A brass band, dominated by the [[trumpet|trumpet]] and the bass [[drum|drum]], played a lively [[tune|tune]] to accompany each routine. Because the shows moved from town to town, publicity was essential: weeks before arrival, a [[messenger|messenger]] was sent ahead to distribute a [[leaflet|leaflet]] or [[handout|handout]] describing the wonders that [[awaited|await]] the audience, and some proprietors paid a [[painter|painter]] to produce a flattering [[portrait|portrait]] of the star performer for their posters.", "Music underwent a parallel shift. In the eighteenth century, serious music depended largely on the aristocratic [[patron|patron]] who employed a composer and a small band of players. The public [[concert|concert]] changed this relationship. By the late nineteenth century, a full [[orchestra|orchestra]], with the [[cello|cello]], the [[flute|flute]] and dozens of other instruments, could perform a [[symphony|symphony]] before a paying audience of two thousand. The growth in scale demanded discipline: a single [[rehearsal|rehearsal]] was rarely enough, and conductors insisted that musicians follow a precise score rather than [[improvise|improvise]], and even that they [[bow|bow]] to the audience together. At the other end of the social scale, cheap instruments such as the [[harmonica|harmonica]] allowed working people to make music for themselves, and the gramophone [[disc|disc/disk]] meant that a popular melody could [[linger|linger]] in the memory of listeners who had never attended a live performance.", "Sport followed the same route from participation to spectacle. Games such as [[cricket|cricket]], once played on village greens with a home-made [[bat|bat]] [[carved|carve]] from willow, were organised into national leagues with a regular [[tournament|tournament]] calendar. Indoor games multiplied too: [[billiards|billiards]] became a fixture of gentlemen's clubs, while [[badminton|badminton]], played with a light [[racket|racket]] and a feathered shuttlecock, spread from country houses to public halls. Purpose-built venues soon followed. The first large [[stadiums|stadium]] were erected near railway stations, and on match days thousands of supporters would [[stride|stride]] through the streets or [[wander|wander]] among the stalls outside, to the frustration of any [[pedestrian|pedestrian]] trying to get to work. In some industrial towns these grounds became the centre of a new urban [[sprawl|sprawl]], with terraced housing and public houses built around them.", "The [[press|press]] played a decisive role in this development. Newspapers discovered that sports results sold copies, and editors employed reporters to [[depict|depict]] each match in dramatic language. A bowler, one report from the 1890s noted, would [[bend|bend]] low and [[pitch|pitch]] the ball with such force that the batsman appeared to [[spring|spring]] backwards in alarm. With the arrival of radio in the 1920s, the [[commentator|commentator]] and the studio [[announcer|announcer]] became familiar voices in millions of homes, and their descriptions helped to [[disseminate|disseminate]] a shared vocabulary of sport. Professor Daniel Okafor of the University of Toronto suggests that broadcasters did more than report events: they '[[entertained|entertain]] listeners with a story, complete with heroes, villains and suspense'.", "Not everyone welcomed these changes. Critics in the early twentieth century complained that watching others play was a poor substitute for [[vigorous|vigorous]] exercise, and several governments promoted outdoor activity, sometimes with a strong element of [[propaganda|propaganda]]. Posters urged citizens to [[ski|ski]] in the mountains, [[skate|skate]] on frozen lakes, [[dive|dive]] into public swimming pools or [[jog|jog]] in the park, presenting physical fitness as a patriotic duty. Railway companies, meanwhile, advertised the cheap weekend [[excursion|excursion]] to the seaside, and wealthier families might [[opt|opt]] for a summer [[cruise|cruise]] along the coast. Each offered a different [[aesthetic|aesthetic/esthetic]] of leisure: one stressing health and effort, the other comfort and display.", "Some scholars argue that the distinction between active and passive entertainment was never as sharp as the critics claimed. Supporters at a football match sang, shouted and [[stretched|stretch]] their arms in unison, while children who had watched a professional game would afterwards [[toss|toss]] a ball about in the street, imitating their heroes. Marsh points out that the [[marathon|marathon]] races of the 1900s attracted both crowds of onlookers and thousands of amateur runners who had no hope of winning but wanted to test themselves. In her view, watching and taking part fed each other rather than competing.", "Today, new technologies have widened the gap between watching and doing still further. Children may spend hours with screen-based [[animation|animation]] and video games, and adults can follow a match on a phone while seated at a desk. Some researchers worry that physical activity will [[lag|lag]] ever further behind time spent watching, and that the [[strain|strain]] of sedentary work is aggravated by passive leisure. Yet there is no [[consensus|consensus]] on the matter. Some studies suggest that televised sport inspires viewers to [[slide|slide]] off the sofa and join a local club; others find no such effect. Okafor, the leading [[exponent|exponent]] of this 'inspiration' theory, admits that the evidence is mixed. Perhaps all that can be said with confidence is that the old picture of leisure, a still [[painting|painting]] of villagers at play, has been replaced by a moving and far more crowded scene."], "qs": [{"type": "TFNG", "q": "Before the industrial era, most recreation took place locally and depended on the season.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "Nineteenth-century conductors encouraged orchestral musicians to improvise during performances.", "a": "FALSE", "para": "C"}, {"type": "TFNG", "q": "Badminton spread from public halls to country houses.", "a": "FALSE", "para": "D"}, {"type": "SA", "q": "What material were home-made cricket bats carved from?", "a": "willow", "para": "D"}, {"type": "SA", "q": "What kind of trip to the seaside did railway companies advertise?", "a": "weekend excursion", "para": "F"}, {"type": "SA", "q": "Which theory is Daniel Okafor the leading exponent of?", "a": "inspiration theory", "para": "H"}], "vocab": {"harmonica": {"w": "harmonica", "p": "n.", "z": "口琴", "ids": ["8|词根|mus|harmonica|1"]}, "circus": {"w": "circus", "p": "n.", "z": "马戏团；圆形广场（常用于地名）", "ids": ["8|词根|cycl|circus|0"]}, "improvise": {"w": "improvise", "p": "v.", "z": "临时做；即兴创作", "ids": ["8|词根|vis|improvise|0"]}, "exponent": {"w": "exponent", "p": "n.", "z": "阐述者；倡导者；拥护者", "ids": ["8|词根|pos|exponent|0"]}, "spectator": {"w": "spectator", "p": "n.", "z": "观众", "ids": ["8|词根|spect|spectator|0"]}, "portrait": {"w": "portrait", "p": "n.", "z": "肖像；半身画像", "ids": ["8|词根|tract|portrait|0"]}, "tent": {"w": "tent", "p": "n.", "z": "帐篷", "ids": ["8|词根|tend|tent|0"]}, "entertain": {"w": "entertain", "p": "v.", "z": "娱乐；招待；心存；怀有", "ids": ["8|词根|ten|entertain|0"]}, "commentator": {"w": "commentator", "p }}}, {"id": "p11", "theme": "物品材料", "part": 1, "parts": 1, "title": "What We Throw Away", "subtitle": "Archaeologists and engineers are reading household rubbish as a record of how people really live", "paras": ["In 1973 the archaeologist William Rathje began an unusual project at the University of Arizona: instead of excavating ancient cities, his students sorted the household [[trash|trash]] of modern Tucson. The idea, which he called 'garbology', rested on a simple observation. What people say they consume and what they actually discard are often very different, and the [[junk|junk]] a household throws out can be a more honest record than any questionnaire. Half a century later, the study of waste has become a recognised branch of material culture research, drawing on archaeology, chemistry and economics.", "For archaeologists, rubbish has always been central. A refuse [[pit|pit]] behind a medieval house may contain fragments of a cooking [[utensil|utensil]], a broken clay [[pipe|pipe]], a bone comb and the [[rim|rim]] of a wooden [[bucket|bucket]] or [[pail|pail]]. Because organic [[stuff|stuff]] such as [[linen|linen]], wool and [[lumber|lumber]] usually rots away, metal and pottery dominate the record. A [[brass|brass]] [[badge|badge]] worn by a pilgrim, or a [[lead|lead]] seal attached to a bale of cloth, can reveal trade routes across a continent. On waterlogged sites the picture changes: teams who [[dredge|dredge]] old harbours and river beds have recovered a [[strand|strand]] of rope, a coil of [[cord|cord]] and even part of a woollen [[blanket|blanket]] in remarkable condition.", "The materials themselves tell a story of technological change. Early smiths heated [[raw|raw]] ore in a simple [[forge|forge]] to produce wrought [[iron|iron]], a [[crude|crude]] but tough metal, while later workshops blended copper and zinc into an [[alloy|alloy]] that was easier to cast. Builders relied on [[lime|lime]] mortar and [[plaster|plaster]] for centuries before Portland [[cement|cement]] became widespread in the nineteenth century. Waterproofing depended on natural substances: ships' timbers were coated with [[pitch|pitch]], cloth was treated with [[wax|wax]], and the first rubberised [[raincoat|raincoat]] appeared only in the 1820s. Each new [[element|element]] in this sequence left traces in the rubbish of its period, allowing researchers to date deposits with surprising precision.", "Modern households discard objects on a scale that would have astonished earlier generations. A survey of a single British [[landfill|landfill]] site by Dr Fiona Mallory of the University of Exeter recorded an extraordinary range of material: a stained [[mattress|mattress]], a [[quilt|quilt]] and a [[cushion|cushion]] apparently from the same bedroom, a [[rug|rug]] and a doormat [[mat|mat]], a [[curtain|curtain]] still attached to its rail, and a wooden [[shutter|shutter]] torn from a window. From kitchens and bathrooms came a [[fridge|fridge]], an enamel [[tub|tub]], a [[broom|broom]], a [[mop|mop]] and a plastic [[barrel|barrel]]. Many of these were in working order. Mallory found a [[portable|portable]] radio whose only fault was a blown [[fuse|fuse]], and a [[vacuum|vacuum]] cleaner that needed nothing more than a new belt. In her estimate, almost a third of the bulky household goods buried at the site could have been repaired or resold, a figure she attributes partly to the low cost of replacement and partly to the inconvenience of finding someone able to carry out repairs.", "Office waste forms its own category. In the decades after the first [[Xerox|xerox]] machines were installed, every [[memorandum|memorandum]] was copied several times, and discarded [[sheets|sheet]] of printed paper filled the bins. Researchers sorting office rubbish routinely find a [[staple|staple]], a dried tube of [[glue|glue]], a [[rubber|rubber]], a pair of [[scissors|scissors]] and a writing [[pad|pad]] in a single bag, along with whole boxes of unused [[stationery|stationery]]. Promotional [[pamphlets|pamphlet]] and unread [[paperback|paperback]] novels are also common. Mallory notes that office waste has declined since documents went digital, though less sharply than many predicted.", "Waste studies have also exposed a hidden trade in imitation goods. Investigators examining rubbish from street markets have found large quantities of [[counterfeit|counterfeit]] [[merchandise|merchandise]]: [[fake|fake]] designer handbags with misspelt brand [[labels|label]], disposable blades sold under the name of a premium [[razor|razor]] brand that [[shave|shave]] poorly and blunt within days, and cheap torches marketed as a famous [[flashlight|flashlight]] maker's model. Such goods are usually [[inferior|inferior]] in quality and are thrown away quickly, so they contribute disproportionately to the waste stream. Some are also hazardous; tests on imitation jewellery have repeatedly detected lead and cadmium.", "Not everything ends up in the ground. Some materials leave the home through the [[sewerage|sewerage]] system: [[detergent|detergent]], cooking fat and wet wipes pass from the sink [[tap|tap]] into the drain, and engineers increasingly find 'fatbergs' blocking the pipes beneath large cities. Other materials are recovered. Scrap dealers prize old [[cable|cable]] for its copper, as well as brass door [[knobs|knob]] and every hinge and [[bolt|bolt]] from demolished buildings, while charities collect textiles that can be cut with industrial [[shears|shear]] and turned into new fibre. Volunteer groups [[knit|knit]] blankets from unravelled jumpers and [[weave|weave]] rugs from strips of old clothing. Such projects handle only a tiny share of the total, but their organisers argue that they change attitudes as well as saving material.", "The greatest [[hurdle|hurdle]] to recycling, according to Mallory, is not technology but design. Many products are assembled with adhesives so that they cannot be taken apart, and a broken [[switch|switch]] or a cracked window [[pane|pane]] often means that the whole [[item|item]] is discarded. She points to small, practical changes: kitchen [[drawers|drawer]] held together with screws rather than glue, lamps whose [[bulb|bulb]] can be changed by hand, and appliances with moving parts that are easy to [[lubricate|lubricate]] and repair. Even the [[opacity|opacity]] of plastic containers matters, because sorting machines identify materials by shining light through them, and very dark plastics are frequently missed.", "Ultimately, the study of waste returns to Rathje's original insight: rubbish is a record of behaviour. A [[miniature|miniature]] [[lantern|lantern]] bought as a souvenir, a [[canvas|canvas]] bag used once, a [[ladder|ladder]] abandoned after a single job, a bicycle missing a [[pedal|pedal]], a three-legged [[stool|stool]] and a dusty [[shelf|shelf]] of ornaments nobody wanted each reflect choices made in shops and homes. The [[litter|litter]] dropped in parks shows the same pattern on a smaller scale. If, as many researchers now argue, the solution lies in buying less rather than recycling more, then the most useful tool for the future may be a careful look at what we have already thrown away."], "qs": [{"type": "TFNG", "q": "Rathje's students excavated ancient cities in Arizona.", "a": "FALSE", "para": "A"}, {"type": "TFNG", "q": "Organic materials such as linen and wool are usually less well preserved than metal objects.", "a": "TRUE", "para": "B"}, {"type": "TFNG", "q": "Most of the items found at the landfill site surveyed by Mallory had been bought within the previous year.", "a": "NOT GIVEN", "para": "D"}, {"type": "SA", "q": "What did Rathje call his study of modern household rubbish?", "a": "garbology", "para": "A"}, {"type": "SA", "q": "What substance were ships' timbers coated with for waterproofing?", "a": "pitch", "para": "C"}, {"type": "SA", "q": "According to Mallory, what is the greatest hurdle to recycling?", "a": "design", "para": "H"} arket industry, and what it has cost", "paras": ["For most of human history, clothing has served two purposes at once: to protect the body and to announce the wearer's place in society. Archaeologists have found that people used [[beads|bead]] of shell and bone to [[adorn|adorn]] themselves more than 100,000 years ago, long before they learned to [[sew|sew]] fitted clothes. According to Dr Amara Lindqvist, a dress historian at the University of Copenhagen, 'the impulse to decorate is as old as the impulse to keep warm, and for much of history the two cannot be separated.'", "Before industrialisation, every [[garment|garment]] represented an enormous investment of labour. Fibres had to be gathered, cleaned and left to [[spin|spin]] on a spindle, then woven into cloth, and each seam was joined [[stitch|stitch]] by stitch with needle and [[thread|thread]]. Colour was costly too. A natural [[dye|dye]] such as madder or indigo had to be fixed carefully, and some [[pigments|pigment]] were so rare that they were reserved for royalty. Not surprisingly, a peasant might own only a single woollen [[robe|robe]] or [[cloak|cloak]], mended again and again until it was [[shabby|shabby]] and threadbare, and finally torn into a [[rag|rag]] for cleaning. A [[patch|patch]] of new cloth on an old [[sleeve|sleeve]] was a sign of thrift rather than shame.", "The wealthy, by contrast, used dress to display their fortune. Renaissance courts were famous for [[extravagant|extravagant]] fashions: a [[velvet|velvet]] [[gown|gown]] might be [[embroidered|embroider]] with gold thread, studded with pearls and finished with a precious [[gem|gem]] hung from a fine gold [[chain|chain]] at the neck. Rulers in several European states passed 'sumptuary laws' restricting who could wear silk, fur or certain colours, hoping to preserve visible social distinctions. These laws rarely [[prevailed|prevail]] for long, Lindqvist notes, because merchants who had grown rich were determined to [[clothe|clothe]] themselves like nobles. In China, meanwhile, ornaments of [[jade|jade]] carried similar prestige, and a carved jade [[bracelet|bracelet]] or belt [[clasp|clasp]] could signal both wealth and moral virtue.", "The industrial revolution transformed this picture. Mechanised mills produced [[textiles|textile]] cheaply and in vast quantities, and synthetic dyes, first developed in the 1850s, made bright colours and bold [[stripes|stripe]] affordable to ordinary families. Ready-made clothing began to replace the work of the local [[tailor|tailor]]. Working men adopted the hard-wearing [[jacket|jacket]] and [[trousers|trousers]], often with a woollen [[vest|vest]] beneath, while factory hands wore a protective [[overall|overall]] over their clothes. In cold climates the heavy [[overcoat|overcoat]] became standard for every class. Accessories followed: a leather [[belt|belt]] and [[boots|boot]], a [[sock|sock]] knitted at home, a [[cap|cap]] with a short peak for the worker and a hat with a broad [[brim|brim]] for the gentleman.", "Women's fashion changed in equally significant ways. The nineteenth-century ideal of a [[slender|slender]] [[figure|figure]], achieved through tight corsets and heavy skirts, gave way in the 1920s to looser styles that allowed greater freedom of movement. The silk [[stocking|stocking]] became a symbol of modernity, as did the knee-length [[dress|dress]] and the knitted [[sweater|sweater]]. Items once considered essential, such as a long [[glove|glove]] for evening wear, a lace-trimmed [[handkerchief|handkerchief]] or a [[veil|veil]] fixed to a hat with a [[pin|pin]], gradually disappeared, and even the starched [[collar|collar]] became optional. Meanwhile [[cosmetics|cosmetics]], formerly associated with the stage, entered the mainstream; by the 1930s lipstick and other [[make-up|make-up]] were sold in department stores, and professional [[hairdressing|hairdressing]] had become a thriving industry.", "Celebrity accelerated these shifts. The cinema created a new kind of [[idol|idol]], and film stars were copied by millions of viewers who hoped to share their [[grace|grace]] and glamour. When a few famous actresses appeared with a [[tan|tan]] after holidays in the south of France, pale skin, long a mark of status, quickly went out of [[vogue|vogue]]. Designers began to treat famous clients as walking advertisements, and a single photograph of a style [[icon|icon]] in a silk [[scarf|scarf]] or a fur [[wrap|wrap]] could create demand around the world. The [[masquerade|masquerade]], once an aristocratic entertainment at which guests wore elaborate [[costumes|costume]] and masks, survived mainly as a theme for charity balls. Fashion magazines, which had once addressed a small circle of wealthy readers, now reached millions, and their editors became powerful arbiters of taste, deciding each season which colours and silhouettes would be promoted and which would be quietly forgotten.", "Some historians argue that fashion has become steadily more democratic, but others are less optimistic. Professor Kenji Morita of Kyoto University points out that cheap mass-produced clothing has created serious environmental problems. Many garments are worn only a handful of times, and a small [[stain|stain]] or a single [[blot|blot]] of ink is often enough for them to be thrown away rather than cleaned. A dress whose [[ribbon|ribbon]] or shoulder [[strap|strap]] has come loose, or a shoe with a broken [[lace|lace]], is rarely repaired, even though the fix might take minutes. Dyeing and finishing plants also discharge chemicals into rivers in producing countries, and Morita estimates that the industry's overall water use rises every year as production expands. He also notes that the number of garments bought per person in wealthy countries roughly doubled between 2000 and 2015, while the average number of times each item was worn fell sharply over the same period.", "There are, however, signs of a reaction. Second-hand and vintage markets are growing, repair cafés teach people to mend and [[embellish|embellish]] old clothes rather than replace them, and a number of designers now produce [[exquisite|exquisite]] garments intended to last for decades. The [[charming|charming]] image of a grandparent darning socks by the fire has even become fashionable in its own right. Whether such trends can compete with the speed and low prices of fast fashion remains uncertain. What is clear, Lindqvist concludes, is that whether it is a couture gown on a catwalk or an old pair of [[slippers|slipper]] by the fire, clothing continues to tell the world who we are, and who we would like to be."], "qs": [{"type": "TFNG", "q": "Humans decorated themselves with beads before they could sew fitted clothing.", "a": "TRUE", "para": "A"}, {"type": "TFNG", "q": "Sumptuary laws were generally successful in maintaining social distinctions over long periods.", "a": "FALSE", "para": "C"}, {"type": "TFNG", "q": "Synthetic dyes were first developed in Germany.", "a": "NOT GIVEN", "para": "D"}, {"type": "SA", "q": "What kind of laws restricted who could wear silk, fur or certain colours?", "a": "sumptuary laws", "para": "C"}, {"type": "SA", "q": "What protective garment did factory workers wear over their clothes?", "a": "overall", "para": "D"}, {"type": "SA", "q": "Where do people learn to mend and embellish old clothes?", "a": "repair cafés", "para": "H"}], "vocab": {"adorn": {"w": "adorn", "p": "v.", "z": "装饰；装扮", "ids": ["10|词根|orn|adorn|0"]}, "cap": {"w": "cap", "p": "n.", "z": "（有帽舌的）帽子；（经费等的）最高限额", "ids": ["10|词根|capit|cap|0"]}, "prevail": {"w": "prevail", "p": "v.", "z": "盛行；获胜", "ids": ["10|词根|valu|prevail|0"]}, "sew": {"w": "sew", "p": "v.", "z": "缝补；缝制", "ids": ["10|词根|sew|sew|0"]}, "cosmetics": {"w": "cosmetics", "p": "n.", "z": "化妆品", "ids": ["10|词根|cosm|cosmetics|0"]}, "embellish": {"w": "embellish", "p": "v.", "z": "修饰", "ids": ["10|词根|bell|embellish|0"]}, "vest": {"w": "vest", "p": "n.", "z": "英-汗衫；美-西装背心", "ids": [ ": "拖鞋", "ids": ["10|其他|其他单词|slipper|53"]}, "sock": {"w": "sock", "p": "n.", "z": "短袜", "ids": ["10|其他|其他单词|sock|54"]}, "spin": {"w": "spin", "p": "v./n.", "z": "纺；（使）旋转；高速旋转；（乘车）兜风", "ids": ["10|其他|其他单词|spin|55"]}, "stain": {"w": "stain", "p": "v./n.", "z": "污染；污渍", "ids": ["10|其他|其他单词|stain|56"]}, "stitch": {"w": "stitch", "p": "n./v.", "z": "针脚；缝", "ids": ["10|其他|其他单词|stitch|57"]}, "stocking": {"w": "stocking", "p": "n.", "z": "（女式）长筒袜", "ids": ["10|其他|其他单词|stocking|58"]}, "strap": {"w": "strap", "p": "n./v.", "z": "带子；用带子系", "ids": ["10|其他|其他单词|strap|59"]}, "stripe": {"w": "stripe", "p": "n.", "z": "条纹", "ids": ["10|其他|其他单词|stripe|60"]}, "sweater": {"w": "sweater", "p": "n.", "z": "毛衣；线衣", "ids": ["10|其他|其他单词|sweater|61"]}, "tailor": {"w": "tailor", "p": "n./v.", "z": "裁缝；专门制作", "ids": ["10|其他|其他单词|tailor|62"]}, "tan": {"w": "tan", "p": "adj./n.", "z": "棕黄色的；棕黄色；晒成的棕褐色", "ids": ["10|其他|其他单词|tan|63"]}, "textile": {"w": "textile", "p": "n./adj.", "z": "纺织品；纺织的", "ids": ["10|其他|其他单词|textile|64"]}, "thread": {"w": "thread", "p": "n.", "z": "线；螺纹", "ids": ["10|其他|其他单词|thread|65"]}, "trousers": {"w": "trousers", "p": "n.", "z": "（尤英）裤子", "ids": ["10|其他|其他单词|trousers|68"]}, "veil": {"w": "veil", "p": "n.", "z": "面纱；遮蔽物", "ids": ["10|其他|其他单词|veil|69"]}, "velvet": {"w": "velvet", "p": "n.", "z": "丝绒；天鹅绒", "ids": ["10|其他|其他单词|velvet|70"]}, "vogue": {"w": "vogue", "p": "n.", "z": "流行", "ids": ["10|其他|其他单词|vogue|71"]}, "wrap": {"w": "wrap", "p": "n.", "z": "披肩", "ids": ["10|其他|其他单词|wrap|76"]}}}, {"id": "p13", "theme": "饮食健康", "part": 1, "parts": 1, "title": "The Global Plate", "subtitle": "How trade, industry and migration reshaped what we eat, and what it means for our health", "paras": ["Few aspects of daily life have been transformed as completely by globalisation as the food we eat. A typical supermarket in northern Europe now sells [[papaya|papaya]] from Brazil, [[kiwi|kiwi]] fruit from New Zealand and fresh [[wasabi|wasabi]] from Japan, alongside the [[turnips|turnip]], [[radishes|radish]] and [[peas|pea]] that once dominated the local diet. Food historians such as Dr Rosalind Achebe of the University of Edinburgh argue that this variety, while welcome, has come with costs to health and the environment that are only now being fully understood.", "For most of history, diets were shaped by what farmers could [[reap|reap]] from their own fields. In much of Europe the staple [[crop|crop]] was [[wheat|wheat]]: each [[grain|grain]] was ground into [[flour|flour]] between millstones and baked into a [[loaf|loaf]], or boiled with water and milk to make [[porridge|porridge]]. Fresh fruit such as the [[cherry|cherry]], [[plum|plum]] and [[peach|peach]] was available only in summer, and households preserved what they could. Vegetables were pickled in [[vinegar|vinegar]] or salt, a wild [[berry|berry]] might be boiled into jam, the [[core|core]] of an apple went to the pigs, and meat from [[livestock|livestock]] slaughtered in autumn was salted to last through the winter. Fish were taken from the village [[pond|pond]] with [[rod|rod]] and line. Monasteries kept detailed records of such [[provisions|provision]], and monks eating in silence in the [[refectory|refectory]] typically received bread, a bowl of vegetable [[soup|soup]] and occasionally [[cheese|cheese]]. Milk itself was rarely drunk fresh outside farming districts, because it spoiled quickly; most [[dairy|dairy]] produce reached towns as butter or cheese, and only the arrival of railways and refrigeration made fresh milk an everyday item for urban families.", "Cooking technology was equally limited. In most homes a single iron [[pan|pan]] or [[kettle|kettle]] hung over an open fire, and it was only in the eighteenth and nineteenth centuries that the enclosed cast-iron [[stove|stove]] became common. The same industrial expansion that produced iron in the blast [[furnace|furnace]] also made metal [[cutlery|cutlery]] affordable, and by 1900 even modest households owned a [[spoon|spoon]], knife and fork for each person. Wealthier families displayed [[silver|silver]] tableware and fine [[porcelain|porcelain]], originally imported from China, while ordinary people drank from a plain [[ceramic|ceramic]] [[mug|mug]] rather than a cup with a matching [[saucer|saucer]].", "Trade gradually broadened the menu. Spices such as pepper and [[ginger|ginger]] had reached Europe since Roman times, but in the colonial era new goods transformed eating habits. Sugar, tea, coffee and [[tobacco|tobacco]] arrived in great quantities, and [[vanilla|vanilla]] from Mexico flavoured custards and [[puddings|pudding]]. [[Spicy|spicy]] dishes from India influenced British [[cuisine|cuisine]], while distillers produced [[brandy|brandy]], [[whisky|whisky/whiskey]] and other [[liquor|liquor]] on an industrial scale. Temperance campaigners urged workers to stay [[sober|sober]], promoting tea and [[soda|soda]] water as healthier alternatives, and the non-alcoholic [[beverage|beverage]] industry grew rapidly as a result.", "Twentieth-century migration brought entire culinary traditions with it. Italian families introduced [[pasta|pasta]] and [[spaghetti|spaghetti]] to the United States, where tomato [[ketchup|ketchup]] and yellow [[mustard|mustard]] were already national condiments. Chinese cooks popularised braised [[eggplant|eggplant]] topped with chopped [[scallion|scallion]], and Greek and Turkish communities made thick [[yogurt|yogurt]] served with [[cucumber|cucumber]] a familiar dish. The [[takeaway|takeaway]] became a fixture of the high street, and food that had once been an exotic [[appetizer|appetiser/appetizer]] in a [[gourmet|gourmet]] restaurant could be bought ready-made in a plastic [[tray|tray]] for a few pounds. For many families, [[supper|supper]] eaten in front of the television replaced the formal [[banquet|banquet]] or the Sunday lunch.", "Nutritionists hold mixed views about these changes. On the positive side, year-round access to fruit and vegetables has improved vitamin intake in many countries. Achebe points out that a child who once ate little but [[mutton|mutton]], bread and potatoes in winter may now [[squeeze|squeeze]] fresh oranges for breakfast. But processed food has also become cheaper and more [[tasty|tasty]]. Manufacturers [[strip|strip]] the fibre from grains, refine sugar and add fat, producing snacks that children describe as '[[yummy|yummy]]' but which contribute to obesity. [[Ice cream|ice cream]], fizzy drinks and chewing [[gum|gum]], once occasional treats, are now consumed daily by millions. A long-term study at the Karolinska Institute reported that adults who drank sweetened beverages every day faced a markedly higher risk of type 2 diabetes. Achebe stresses that such findings do not mean imported food is harmful in itself; the problem, she argues, is the shift from home cooking towards products engineered to be eaten quickly and in large amounts.", "Institutions have also had to adapt. School and workplace canteens that once offered a fixed menu now [[cater|cater]] for vegetarians, people with allergies and diners from many cultural backgrounds. The modern [[cafeteria|cafeteria]], where customers choose from a counter, gives diners more freedom but also more temptation. Some schools have responded by replacing sugary [[refreshments|refreshment]] with water and fruit, and by teaching children to [[cook|cook]] simple meals: to [[slice|slice]] vegetables, [[soak|soak]] dried beans overnight, [[stir|stir]] a sauce gently and [[grind|grind]] spices with a mortar and pestle. Pupils learn, too, that the [[bitter|bitter]] taste of some green vegetables and the [[sour|sour]] taste of citrus fruit are qualities to be appreciated rather than disguised with sugar. Early evaluations suggest that children who take part in such classes are more willing to try unfamiliar vegetables, although it is not yet clear whether the effect lasts into adulthood.", "Traditional knowledge can still teach useful lessons. In many cultures cooks would [[hull|hull]] rice and millet by hand, retaining much of the nutritious outer layer, and ferment soybeans or vegetables into a [[paste|paste]] that kept for months in a jar with a tight [[lid|lid]]. Such methods, long dismissed as old-fashioned, are now being studied for their benefits to gut health. Achebe's own advice is modest: eat more whole foods, cook at home when possible, and resist the temptation to [[lick|lick]] the plate clean simply because food is cheap and plentiful. 'Globalisation has given us a richer table than any medieval king could have imagined,' she says. 'The challenge now is learning to eat from it wisely.'"], "qs": [{"type": "TFNG", "q": "In pre-industrial Europe, fresh cherries and plums could be eaten throughout the year.", "a": "FALSE", "para": "B"}, {"type": "TFNG", "q": "Porcelain used by wealthy European families was originally imported from China.", "a": "TRUE", "para": "C"}, {"type": "TFNG", "q": "Temperance campaigners were mainly supported by factory owners.", "a": "NOT GIVEN", "para": "D"}, {"type": "SA", "q": "Where did monks eat their meals in silence?", "a": "refectory", "para": "B"}, {"type": "SA", "q": "Where did vanilla used to flavour custards and puddings come from?", "a": "Mexico", "para": "D"}, {"type": "SA", "q": "Traditional fermentation methods are being studied for their benefits to what?", "a": "gut health", "para": "H"}], "vocab": {"spicy": {"w": "spicy", "p": "adj.", "z": "辣的", "ids": ["11|词根|spect|spicy|1"]}, "ice cream": {"w": "ice cream", "p": "n.", "z": "冰淇淋", "ids": ["11|词根|creat|ice cream|1"]}, "appetiser/appetizer": {"w": "appetiser/appetizer", "p": "n.", "z": "开胃饮料、开胃小菜", "ids": ["11|词根|appet|appetiser/appetizer|0"]}, "provision": {"w": "provision", "p": "n.", "z": "供应、预备", "ids": ["11|词根|vis|provision|0"]}, "refectory": {"w": "refectory", "p": "n.", "z": "（学校或其他机构）食堂、餐厅", "ids": ["11|词根|fac|refectory|0"]}, "radish": {"w": "radish", "p": "n.", "z": "樱桃萝卜", "ids": ["11|词根|radi|ra .", "z": "[英]外卖餐馆、外卖食物", "ids": ["11|其他|其他单词|takeaway|115"]}, "tobacco": {"w": "tobacco", "p": "n.", "z": "烟草", "ids": ["11|其他|其他单词|tobacco|118"]}, "tray": {"w": "tray", "p": "n.", "z": "盘、托盘", "ids": ["11|其他|其他单词|tray|120"]}, "turnip": {"w": "turnip", "p": "n.", "z": "萝卜、芜菁", "ids": ["11|其他|其他单词|turnip|122"]}, "vanilla": {"w": "vanilla", "p": "n./adj.", "z": "香草/香草味的", "ids": ["11|其他|其他单词|vanilla|123"]}, "vinegar": {"w": "vinegar", "p": "n.", "z": "醋", "ids": ["11|其他|其他单词|vinegar|126"]}, "wasabi": {"w": "wasabi", "p": "n.", "z": "山葵、山葵根", "ids": ["11|其他|其他单词|wasabi|127"]}, "wheat": {"w": "wheat", "p": "n.", "z": "小麦", "ids": ["11|其他|其他单词|wheat|128"]}, "yogurt": {"w": "yogurt", "p": "n.", "z": "酸奶", "ids": ["11|其他|其他单词|yogurt|129"]}}}, {"id": "p14", "theme": "建筑场所", "part": 1, "parts": 1, "title": "From Hut to High-Rise", "subtitle": "Architectural historians trace the long conversation between shelter, climate and comfort", "paras": ["For most of human history, the typical [[dwelling|dwelling]] was a modest [[hut|hut]] of timber [[poles|pole]], mud and thatch, its deep [[eaves|eaves]] designed to throw rainwater clear of the walls. Archaeologists regard the river [[basins|basin]] of Mesopotamia as the [[cradle|cradle]] of urban architecture, for it was there that people first learned to [[construct|construct]] permanent houses from sun-dried and fired brick. Yet according to Dr Helena Marsh of the Institute for Vernacular Architecture, the most striking feature of these early homes was not their materials but their orientation. [[Rooms|room]] looked [[inward|inward]] onto a shaded courtyard rather than [[outward|outward]] towards the street, an arrangement that offered both privacy and a cool microclimate in a fiercely hot region.", "The skills required to raise such buildings were handed down within families of craftsmen. The [[mason|mason]] shaped and laid stone, while the [[carpenter|carpenter]], equipped with little more than a [[saw|saw]], an adze and a hand [[drill|drill]], cut the roof [[beams|beam]] and fitted the doors. In medieval Europe these trades were organised into powerful guilds, and the [[erection|erection]] of a great [[castle|castle]] or cathedral could [[span|span]] several generations. Builders checked that each wall was truly vertical with a [[plumb|plumb]] line, and they worked from timber [[scaffolds|scaffold]] lashed together with rope. Heavy blocks were hoisted by a treadwheel [[crane|crane]] or eased into position with an iron [[lever|lever]], methods that changed remarkably little for nearly a thousand years.", "Structural ingenuity, rather than sheer quantity of material, allowed builders to enclose ever larger spaces. The Roman [[arch|arch]] distributed loads so efficiently that a single [[viaduct|viaduct]] could carry water across an entire valley, and the stone [[vault|vault]] made it possible to roof a hall without a forest of supports. Where [[vaulting|vault]] was impractical, a row of [[columns|column]] or a massive central [[pillar|pillar]] held up the [[ceiling|ceiling]]. The Romans also pioneered an early form of [[concrete|concrete]], whose durability modern engineers have only recently begun to explain: some of their harbour walls have withstood two thousand years of seawater, whereas many twentieth-century structures are already crumbling.", "The country houses of eighteenth-century England show how domestic life became divided into increasingly specialised spaces. A typical [[mansion|mansion]] or [[villa|villa]] contained a [[parlour|parlour/parlor]] for receiving guests, a [[cellar|cellar]] for wine and coal, a [[nursery|nursery]] for the children on an upper [[storey|storey/story]], and narrow service [[corridors|corridor]] along which servants moved unseen. Every principal [[room|room]] was warmed by an open [[fireplace|fireplace]], and the resulting cluster of [[chimneys|chimney]] became a defining feature of the [[exterior|exterior]]. The labourer's [[cottage|cottage]], by contrast, might consist of a single kitchen with a wooden [[bench|bench]] beside the hearth and a [[shed|shed]] for tools at the back. A small [[porch|porch]] sheltered the front door, and a steep [[stair|stair]] led to sleeping quarters beneath a roof of clay [[tiles|tile]].", "The Industrial Revolution transformed both the materials and the scale of building. Cheap [[steel|steel]] allowed engineers to [[weld|weld]] or rivet girders into frames strong enough to carry walls of glass, while the [[suspension|suspension]] bridge enabled roads to cross rivers too wide for any stone [[arch|arch]]. Engineers learned to [[dam|dam]] whole valleys in order to supply growing cities with water. Urban populations were rehoused in tall blocks, where each [[flat|flat]] was reached by a shared [[staircase|staircase]] with an iron [[handrail|handrail]]. Above all, the period produced a new kind of [[infrastructure|infrastructure]]: sewers, gas mains and an electricity [[grid|grid]] that made the indoor [[lavatory|lavatory]] and the cast-iron [[radiator|radiator]] commonplace even in working-class homes. Traditional [[brickwork|brickwork]], once the main structural element, was increasingly reduced to a decorative skin.", "In the twentieth century, architects turned their attention to buildings that could accommodate crowds. The shopping [[mall|mall]], with its glass-roofed [[expanse|expanse]] and moving [[escalators|escalator]], was intended to recreate the bustle of the old market [[plaza|plaza]] under a single roof. Similar thinking shaped the sports [[venue|venue]], the [[casino|casino]] and the airport terminal, where the [[placement|placement]] of every ticket [[booth|booth]] and [[reception|reception]] desk is planned so that queues do not [[obstruct|obstruct]] the movement of people. Many of these vast buildings form part of a larger [[complex|complex]] [[situated|situated]] on the [[peripheral|peripheral]] edges of cities, where land is cheap and motorway access is easy.", "Critics, however, argue that such structures depend too heavily on mechanical [[apparatus|apparatus]]. Professor Tomas Lindqvist, who helped to [[found|found]] the Nordic Centre for Sustainable Design in 2004, points out that sealed glass towers require constant air conditioning, and when that equipment begins to [[malfunction|malfunction]], occupants quickly suffer from heat and stale air. Modern houses, too, are now built to be almost [[airtight|airtight]] in order to conserve energy, but this demands ventilation systems that must be regularly [[maintained|maintain]]. Lindqvist's surveys suggest that few householders ever [[mend|mend]] or replace clogged filters, with the result that indoor air in many energy-efficient homes is of poorer quality than in draughty Victorian [[terraced|terrace]] houses.", "For this reason, a growing number of architects are revisiting older techniques. Some deliberately leave an internal [[void|void]], such as a courtyard or light well, to draw cool air through a building, while others add a shaded roof [[terrace|terrace]] or a deep [[balcony|balcony]] to cut [[external|external]] heat gain from the sun. In the Swiss Alps, a recently completed mountain [[hostel|hostel]], built from local larch and modelled on the traditional log [[cabin|cabin]], needs almost no heating at all; walkers who [[lodge|lodge]] there in midwinter report that it stays warm thanks to its thick walls and compact, [[spacious|spacious]] interior. Even the fitted kitchen [[cabinets|cabinet]] and window frames were made by craftsmen from the surrounding valley.", "The challenge, Lindqvist says, is to [[locate|locate]] the right balance between heritage and innovation. A well-designed building should become a local [[landmark|landmark]] not because of its height or cost but because it works with its climate and serves the people who [[reside|reside]] in it for decades. Several Scandinavian cities now hold a [[reserve|reserve]] of public land in the [[vicinity|vicinity]] of railway stations for exactly this kind of experimental housing, in the hope that lessons from the past may shape the cities of the future."], "qs": [{"type": "TFNG", "q": "According to Dr Marsh, early Mesopotamian homes were notable mainly for the materials used to build them.", "a": "FALSE", "para": "A"}, {"type": "TFNG", "q": "Roman concrete has lasted longer in some cases than many modern structures.", "a": "TRUE", "para": "C"}, {"type": "TFNG", "q": "The Alpine hostel was the most expensive building of its kind in Switzerland.", "a": "NOT GIVEN", "para": "H"}, {"type": "SA", "q": "What tool did medieval builders use to check that a wall was vertical?", "a": "plumb line", "para": "B"}, {"type": "SA", "q": "What kind of material was traditional brickwork reduced to after the Industrial Revolution?", "a": "decorative skin", "para": "E"}, {"type": "SA", "q": "Which component of ventilation systems do householders rarely replace, according to Lindqvist's surveys?", "a": "filters", "para": "G"}], "vocab": {"construct": {"w": "construct", "p": "v.", "z": "建造", "ids": ["12|词根|struct|construct|0"]}, "infrastructure": {"w": "infrastructure", "p": "n.", "z": "基础设施", "ids": ["12|词根|struct|infrastructure|1"]}, "obstruct": {"w": "obstruct", "p": "v.", "z": "阻塞、妨碍", "ids": ["12|词根|struct|obstruct|2"]}, "situated": {"w": "situated", "p": "adj.", "z": "位于...的", "ids": ["12|词根|situ|situated|1"]}, "erection": {"w": "erection", "p": "n.", "z": "建筑、建造", "ids": ["12|词根|reg|erection|0"]}, "reserve": {"w": "reserve", "p": "n./v.", "z": "储备；自然保护区/预订", "ids": ["12|词根|serv|reserve|0"]}, "radiator": {"w": "radiator", "p": "n.", "z": "暖气设备", "ids": ["12|词根|radi|radiator|0"]}, "placement": {"w": "placement", "p": "n.", "z": "放置、布置", "ids": ["12|词根|plac|placement|0"]}, "found": {"w": "found", "p": "v.", "z": "创建、创办", "ids": ["12|词根|fund|found|0"]}, "reside": {"w": "reside", "p": "v.", "z": "居住", "ids": ["12|词根|sed|reside|0"]}, "hostel": {"w": "hostel", "p": "n.", "z": "廉价招待所", "ids": ["1
