<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />

<title>听力拼写高频词 · 线索词</title>
<style>
  :root{
    --bg:#f4f3ef; --surface:#ffffff; --surface2:#efede7;
    --ink:#211d19; --muted:#746c62; --line:#e2ded6;
    --accent:#1f5f8b; --accent-soft:#e6f0f7; --warn:#b3352b; --warn-soft:#f9e9e7; --ok:#2e7d4f; --ok-soft:#e5f3ea; --mark:#fff3c4;
    --header-bg:rgba(244,243,239,.92);
    --shadow:0 1px 3px rgba(30,25,20,.07); --shadow-lg:0 10px 30px rgba(30,25,20,.14);
    --serif:"Iowan Old Style","Charter",Georgia,"Times New Roman",serif;
    --top:58px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161a; --surface:#1e2025; --surface2:#26282f;
      --ink:#edeae4; --muted:#a29b91; --line:#2f313a;
      --accent:#6fb0de; --accent-soft:#1d2c38; --warn:#e0685e; --warn-soft:#3a2320; --ok:#6cc58f; --ok-soft:#1c3226; --mark:#4a3f1c;
      --header-bg:rgba(21,22,26,.92);
      --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:15px;line-height:1.55;}
  button,input,select{font:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  .topbar{position:sticky;top:0;z-index:50;background:var(--header-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .tb{max-width:1400px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;min-height:var(--top);}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
  .brand b{font-family:var(--serif);font-size:20px;color:var(--accent);font-style:italic;}
  .brand span{font-size:12.5px;color:var(--muted);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;white-space:nowrap;}
  .tab small{color:var(--muted);margin-left:4px;}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab.on small{color:rgba(255,255,255,.8);}
  .spacer{flex:1;}
  .tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 11px;font-size:13px;white-space:nowrap;}
  .tbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .back{font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap;}
  .back:hover{color:var(--accent);}
  main{max-width:1400px;margin:0 auto;padding:18px 16px 80px;}
  .intro{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:16px;color:var(--muted);font-size:13.5px;}
  .intro b{color:var(--ink);}
  .bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:14px;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);}
  .seg button{border:0;background:none;padding:5px 11px;font-size:13px;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px;font-size:13.5px;width:180px;}
  .count{font-size:13px;color:var(--muted);}
  .lbl{font-size:12.5px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;position:relative;}
  .card.done{opacity:.45;}
  .card .top{display:flex;align-items:center;gap:8px;}
  .card .w{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em;}
  .card .n{margin-left:auto;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .card .n.t4{background:var(--warn-soft);color:var(--warn);font-weight:600;}
  .card .n.t3{background:var(--accent-soft);color:var(--accent);}
  .card .zh{font-size:13.5px;}
  .card .alt{font-size:12px;color:var(--muted);}
  .card .src{font-size:11.5px;color:var(--muted);}
  .card .acts{display:flex;gap:6px;margin-top:4px;}
  .ib{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 9px;font-size:12.5px;}
  .ib:hover{border-color:var(--accent);color:var(--accent);}
  .hidezh .zh,.hidezh .szh{filter:blur(5px);transition:filter .15s;}
  .hidezh .card:hover .zh,.hidezh .sp:hover .szh{filter:none;}
  /* dictation */
  .dict{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:22px;max-width:680px;margin:0 auto;}
  .dict h2{margin:0 0 12px;font-size:17px;}
  .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0;}
  .big{font-size:26px;font-family:var(--serif);width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--bg);outline:none;letter-spacing:.02em;}
  .big:focus{border-color:var(--accent);}
  .big.ok{border-color:var(--ok);background:var(--ok-soft);}
  .big.bad{border-color:var(--warn);background:var(--warn-soft);}
  .pbtn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600;}
  .pbtn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);}
  .fb{min-height:54px;margin-top:10px;font-size:15px;}
  .fb .right{font-family:var(--serif);font-size:22px;font-weight:600;}
  .fb .diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;}
  .fb .diff del{background:var(--warn-soft);color:var(--warn);}
  .meter{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:10px 0 4px;}
  .meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}
  .sum{margin-top:14px;}
  .sum .wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--surface2);}
  .chip.bad{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
  kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface2);}
  /* signposts */
  .cat{margin:22px 0 10px;}
  .cat h3{margin:0;font-size:16px;display:flex;align-items:baseline;gap:10px;}
  .cat h3 small{font-weight:400;color:var(--muted);font-size:13px;}
  .cat .tip{font-size:13.5px;color:var(--muted);margin-top:2px;}
  .cat.trap h3{color:var(--warn);}
  .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;}
  .sp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);}
  .sp .h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .sp .p{font-family:var(--serif);font-size:19px;font-weight:600;}
  .sp .szh{font-size:13.5px;}
  .sp .f{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;}
  .fbar{height:4px;border-radius:3px;background:var(--surface2);margin:6px 0 7px;overflow:hidden;}
  .fbar i{display:block;height:100%;background:var(--accent);}
  .sp .ex{font-size:14px;line-height:1.5;}
  .sp .ex mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px;font-weight:600;}
  .sp .es{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:4px;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  .hide{display:none!important;}
  @media (max-width:640px){ .search{width:130px;} .sgrid{grid-template-columns:1fr;} .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));} }
</style>
</head>

 guide we used to have available.", "src": "剑17 T2"}, {"cat": "纠错/改口（陷阱）", "p": "in fact", "zh": "事实上", "docs": 25, "tot": 42, "ex": "In fact, about thirty-five per cent of our members are children.", "src": "剑10 T3"}, {"cat": "纠错/改口（陷阱）", "p": "I thought", "zh": "我原以为（常被推翻）", "docs": 20, "tot": 39, "ex": "I thought comparing the different labelling systems used by food manufactures was interesting.", "src": "剑13 T4"}, {"cat": "纠错/改口（陷阱）", "p": "instead of", "zh": "而不是", "docs": 16, "tot": 19, "ex": "Instead of throwing more man-hours at a problem, the clever and lazy group looks for a more effective solution.", "src": "剑12 T1"}, {"cat": "纠错/改口（陷阱）", "p": "I mean", "zh": "我是说（改口）", "docs": 15, "tot": 21, "ex": "I mean, obviously it wouldn't be cheap to set up.", "src": "剑12 T3"}, {"cat": "纠错/改口（陷阱）", "p": "that's not", "zh": "那不是……", "docs": 15, "tot": 19, "ex": "That's not necessarily something that we'd want to control or reduce.", "src": "剑12 T4"}, {"cat": "纠错/改口（陷阱）", "p": "sorry", "zh": "抱歉（常引出更正）", "docs": 14, "tot": 15, "ex": "Sorry, how do you spell that?", "src": "剑11 T4"}, {"cat": "纠错/改口（陷阱）", "p": "I'm afraid", "zh": "恐怕（坏消息/否定）", "docs": 13, "tot": 15, "ex": "I'm afraid not, as they're banned from the beach itself.", "src": "剑17 T1"}, {"cat": "纠错/改口（陷阱）", "p": "changed", "zh": "改了", "docs": 12, "tot": 24, "ex": "Well, as you don't need me to tell you, Barford has changed a great deal in the last 50 years.", "src": "剑11 T3"}, {"cat": "纠错/改口（陷阱）", "p": "unfortunately", "zh": "不幸的是", "docs": 10, "tot": 13, "ex": "But unfortunately, tree planting isn't as straightforward as some people think.", "src": "剑19 T4"}, {"cat": "纠错/改口（陷阱）", "p": "apparently", "zh": "据说，看来", "docs": 10, "tot": 13, "ex": "Apparently you can allow iron to rust while it's in contact with the fabric, and that colours it.", "src": "剑13 T3"}, {"cat": "纠错/改口（陷阱）", "p": "at first", "zh": "起初", "docs": 10, "tot": 12, "ex": "At first no one realised that the haze was caused by the volcanic eruption in Iceland.", "src": "剑18 T2"}, {"cat": "纠错/改口（陷阱）", "p": "originally", "zh": "原本", "docs": 7, "tot": 9, "ex": "The building was originally the schoolhouse, and it's well over a hundred years old.", "src": "剑11 T1"}, {"cat": "纠错/改口（陷阱）", "p": "no longer", "zh": "不再", "docs": 6, "tot": 8, "ex": "What will change, though, is that the council will no longer be in charge of the area.", "src": "剑11 T3"}, {"cat": "转折/对比", "p": "but", "zh": "但是", "docs": 40, "tot": 770, "ex": "But how about your project on reusing waste food - you were looking at bread, weren't you?", "src": "剑19 T1"}, {"cat": "转折/对比", "p": "though", "zh": "不过；虽然", "docs": 33, "tot": 98, "ex": "Though that's not really an issue, we've got plenty of equipment in the laboratory.", "src": "剑13 T1"}, {"cat": "转折/对比", "p": "however", "zh": "然而", "docs": 25, "tot": 38, "ex": "However, the grounds and what goes on there will be yours.", "src": "剑17 T3"}, {"cat": "转折/对比", "p": "instead", "zh": "反而，代替", "docs": 24, "tot": 43, "ex": "Instead they wait for the participants in the research to inform them.", "src": "剑11 T3"}, {"cat": "转折/对比", "p": "although", "zh": "虽然", "docs": 22, "tot": 45, "ex": "Although what many of them didn't take into consideration was family size.", "src": "剑15 T1"}, {"cat": "转折/对比", "p": "not just", "zh": "不仅仅", "docs": 18, "tot": 18, "ex": "The farmers were able to grow enough produce not just for their own needs, but also to sell.", "src": "剑15 T2"}, {"cat": "转折/对比", "p": "rather than", "zh": "而不是", "docs": 17, "tot": 22, "ex": "It just means swimming in natural waters, rather than a swimming pool.", "src": "剑15 T2"}, {"cat": "转折/对比", "p": "while", "zh": "而；虽然", "docs": 15, "tot": 18, "ex": "While in this state of cryptobiosis, tardigrades produce a protein that protects their DNA.", "src": "剑19 T2"}, {"cat": "转折/对比", "p": "even though", "zh": "尽管", "docs": 11, "tot": 14, "ex": "Even though many of his theories have been disproven, he certainly left a lasting impression on many disciplines.", "src": "剑10 T2"}, {"cat": "转折/对比", "p": "even if", "zh": "即使", "docs": 11, "tot": 14, "ex": "Even if they don't win, and I don't expect them to, hopefully it'll be an incentive for them to try and improve.", "src": "剑14 T3"}, {"cat": "转折/对比", "p": "unlike", "zh": "不像", "docs": 9, "tot": 11, "ex": "Unlike episodic memory, semantic memory isn't dependent on recalling personal experiences.", "src": "剑13 T2"}, {"cat": "转折/对比", "p": "but then", "zh": "可是话说回来", "docs": 9, "tot": 10, "ex": "But then, the Manham Trust was formed to conserve the historical resources of the area.", "src": "剑10 T4"}, {"cat": "转折/对比", "p": "not only", "zh": "不仅", "docs": 8, "tot": 8, "ex": "It's not only that they benefit intellectually from extra attention at a young age - which is what I would have expected.", "src": "剑15 T1"}, {"cat": "转折/对比", "p": "whereas", "zh": "而", "docs": 7, "tot": 7, "ex": "The people dancing in a group reported feeling happier, whereas those dancing alone did not.", "src": "剑16 T2"}, {"cat": "转折/对比", "p": "on the other hand", "zh": "另一方面", "docs": 6, "tot": 7, "ex": "On the other hand, it can be quite boring or solitary.", "src": "剑13 T3"}, {"cat": "转折/对比", "p": "otherwise", "zh": "否则", "docs": 6, "tot": 6, "ex": "Otherwise it wastes the resources that companies value most – time and energy.", "src": "剑12 T1"}, {"cat": "转折/对比", "p": "compared with", "zh": "与……相比", "docs": 6, "tot": 6, "ex": "We also studied comics in that module, but I'm not convinced of their value, not compared with books.", "src": "剑14 T4"}, {"cat": "转折/对比", "p": "yet", "zh": "然而；还", "docs": 4, "tot": 4, "ex": "Yet less than 200 years after Europeans first arrived on the island, they had become extinct.", "src": "剑16 T4"}, {"cat": "转折/对比", "p": "the only thing", "zh": "唯一的问题", "docs": 4, "tot": 4, "ex": "The only thing is, could you add Malcolm to it, without changing what's already there.", "src": "剑11 T3"}, {"cat": "强调/重点", "p": "really", "zh": "真的", "docs": 40, "tot": 241, "ex": "Real lly the schoolhouse, and it's well over a hundred years old.", "src": "剑11 T1"}, {"cat": "数字/时间提示", "p": "from", "zh": "从（数字范围）", "docs": 14, "tot": 24, "ex": "Now, we have several groups at the centre and we cater for children from three to five years old.", "src": "剑10 T3"}, {"cat": "数字/时间提示", "p": "double", "zh": "两倍；双写字母（拼写）", "docs": 10, "tot": 13, "ex": "The normal rate at the hotel where we're staying is 150 euros a night for a double room.", "src": "剑12 T2"}, {"cat": "数字/时间提示", "p": "just", "zh": "只；刚好", "docs": 9, "tot": 9, "ex": "Textbooks usually cover so many topics, it can be very difficult to choose just one.", "src": "剑12 T2"}, {"cat": "数字/时间提示", "p": "up to", "zh": "最多", "docs": 8, "tot": 8, "ex": "The eucalyptus grows all over Australia and the trees can live for up to four hundred years.", "src": "剑15 T1"}, {"cat": "数字/时间提示", "p": "by", "zh": "到……为止", "docs": 8, "tot": 8, "ex": "The classes normally start at 9.30 every morning, but on Day 1 you should aim to get Charlie here by 9.20.", "src": "剑16 T3"}, {"cat": "数字/时间提示", "p": "percent", "zh": "百分之", "docs": 6, "tot": 13, "ex": "It's not very ambitious but the assignment's only ten percent of our final mark, isn't it?", "src": "剑13 T1"}, {"cat": "数字/时间提示", "p": "until", "zh": "直到", "docs": 6, "tot": 7, "ex": "It doesn't close until four, but I'd recommend going earlier than that - it does run out of some things.", "src": "剑19 T3"}, {"cat": "数字/时间提示", "p": "less than", "zh": "少于", "docs": 5, "tot": 5, "ex": "Yet less than 200 years after Europeans first arrived on the island, they had become extinct.", "src": "剑16 T4"}, {"cat": "数字/时间提示", "p": "around", "zh": "大约", "docs": 5, "tot": 7, "ex": "Atlit-Yam was a village on the coast of the eastern Mediterranean, which seems to have been thriving until around 7,000 BC.", "src": "剑14 T4"}, {"cat": "数字/时间提示", "p": "by the end of", "zh": "到……为止", "docs": 4, "tot": 4, "ex": "Everyone says by the end of the year you gain so much confidence.", "src": "剑13 T4"}, {"cat": "数字/时间提示", "p": "per cent", "zh": "百分之", "docs": 4, "tot": 4, "ex": "In fact, about thirty-five per cent of our members are children.", "src": "剑10 T3"}, {"cat": "数字/时间提示", "p": "between", "zh": "在……之间", "docs": 4, "tot": 4, "ex": "Each segment has a pair of legs, at the end of which are between four and eight sharp claws.", "src": "剑19 T2"}, {"cat": "总结", "p": "generally", "zh": "一般来说", "docs": 20, "tot": 29, "ex": "Like the consensus seems to be that oldest children are generally less well-adjusted.", "src": "剑15 T1"}, {"cat": "总结", "p": "that's all", "zh": "就这些", "docs": 9, "tot": 12, "ex": "OK, that's all on the new Food Hall.", "src": "剑16 T2"}, {"cat": "总结", "p": "all right", "zh": "好（收尾）", "docs": 7, "tot": 8, "ex": "I'd been worried about the quality, but it worked out all right.", "src": "剑11 T4"}, {"cat": "总结", "p": "overall", "zh": "总的来说", "docs": 6, "tot": 6, "ex": "Overall, she had quite a strong message, didn't she?", "src": "剑18 T1"}, {"cat": "总结", "p": "in the end", "zh": "最后", "docs": 6, "tot": 7, "ex": "In the end, it comes down to whether more value is placed on human economic wellbeing or environmental wellbeing.", "src": "剑12 T3"}, {"cat": "同意/反对（观点）", "p": "I think", "zh": "我认为", "docs": 38, "tot": 141, "ex": "I think people will be surprised to hear that the weather in the USA was badly affected too.", "src": "剑18 T2"}, {"cat": "同意/反对（观点）", "p": "probably", "zh": "可能", "docs": 32, "tot": 59, "ex": "And they probably won't ask anything too difficult like what your plans are for the future.", "src": "剑15 T1"}, {"cat": "同意/反对（观点）", "p": "I suppose", "zh": "我想（勉强同意）", "docs": 27, "tot": 47, "ex": "I suppose I could put some sort of tag on one group… or just mark them in some way?", "src": "剑19 T3"}, {"cat": "同意/反对（观点）", "p": "maybe", "zh": "也许", "docs": 23, "tot": 40, "ex": "Maybe just look at the effects of one supplement, like sugar, on the health of the mice?", "src": "剑19 T3"}, {"cat": "同意/反对（观点）", "p": "exactly", "zh": "正是", "docs": 21, "tot": 31, "ex": "Exactly - most temporary jobs aren't advertised.", "src": "剑15 T1"}, {"cat": "同意/反对（观点）", "p": "I'm sure", "zh": "我确信", "docs": 21, "tot": 38, "ex": "I'm sure when my parents bought their first fridge they had hardly any choice!", "src": "剑15 T4"}, {"cat": "同意/反对（观点）", "p": "perhaps", "zh": "也许", "docs": 20, "tot": 25, "ex": "Perhaps she thinks students are a bit narrow-minded about the industry.", "src": "剑18 T1"}, {"cat": "同意/反对（观点）", "p": "do you think", "zh": "你认为……吗", "docs": 19, "tot": 25, "ex": "Do you think our secondary-school education should have been more career-focused?", "src": "剑18 T1"}, {"cat": "同意/反对（观点）", "p": "good idea", "zh": "好主意", "docs": 17, "tot": 23, "ex": "Good idea - that's something most of the kids in that class might struggle with.", "src": "剑18 T4"}, {"cat": "同意/反对（观点）", "p": "I don't think", "zh": "我不认为", "docs": 17, "tot": 21, "ex": "I don't think the other students will have read it, but they'll remember hearing about the flooding at the time.", "src": "剑14 T1"}, {"cat": "同意/反对（观点）", "p": "that sounds", "zh": "听起来", "docs": 17, "tot": 20, "ex": "That sounds a lot, especially because fridges hardly ever break down.", "src": "剑15 T4"}, {"cat": "同意/反对（观点）", "p": "I found", "zh": "我发现", "docs": 14, "tot": 20, "ex": "I found it really interesting - I'd never even heard of the Laki eruption before this.", "src": "剑18 T2"}, {"cat": "同意/反对（观点）", "p": "not really", "zh": "不太", "docs": 12, "tot": 13, "ex": "Though that's not really an issue, we've got plenty of equipment in the laboratory.", "src": "剑13 T1"}, {"cat": "同意/反对（观点）", "p": "I'm not sure", "zh": "我不确定", "docs": 11, "tot": 12, "ex": "I'm not sure if we should be talking about exercise in our presentation.", "src": "剑16 T3"}, {"cat": "同意/反对（观点）", "p": "I agree", "zh": "我同意", "docs": 9, "tot": 9, "ex": "I agree - and book covers can be a work of art in themselves.", "src": "剑19 T4"}, {"cat": "同意/反对（观点）", "p": "I guess", "zh": "我猜", "docs": 9, "tot": 12, "ex": "I guess they are very hard-wearing, but don't they look a bit casual for school uniform?", "src": "剑19 T2"}, {"cat": "同意/反对（观点）", "p": "I wouldn't", "zh": "我不会", "docs": 8, "tot": 12, "ex": "I wouldn't be all that confident about cycling on such busy roads.", "src": "剑10 T2"}, {"cat": "同意/反对（观点）", "p": "what do you think", "zh": "你怎么看", "docs": 8, "tot": 9, "ex": "What do you think about including a section on how we planned the project as a whole, Jeremy?", "src": "剑11 T3"}, {"cat": "同意/反对（观点）", "p": "you're right", "zh": "你说得对", "docs": 7, "tot": 8, "ex": "Well, unless you're a professional, but you're right, many ordinary bikers don't wear a helmet.", "src": "剑17 T4"}, {"cat": "同意/反对（观点）", "p": "I like", "zh": "我喜欢", "docs": 7, "tot": 12, "ex": "I like the idea that work won't involve doing boring, repetitive tasks, as robots will do all that.", "src": "剑18 T3"}, {"cat": "同意/反对（观点）", "p": "that's true", "zh": "确实", "docs": 6, "tot": 7, "ex": "No that's true, but the findings for any experiment are going to be limited.", "src": "剑19 T3"}, {"cat": "同意/反对（观点）", "p": "I wonder", "zh": "我在想", "docs": 6, "tot": 9, "ex": "I wonder, though … The main theme is selfishness, so we could do something on social justice?", "src": "剑15 T2"}, {"cat": "同意/反对（观点）", "p": "I'd say", "zh": "我会说", "docs": 5, "tot": 7, "ex": "I'd say price has a lot to do with it.", "src": "剑16 T4"}, {"cat": "同意/反对（观点）", "p": "it seems", "zh": "似乎", "docs": 5, "tot": 7, "ex": "It seems like there are a lot of opportunities there.", "src": "剑13 T4"}, {"cat": "同意/反对（观点）", "p": "I see what you mean", "zh": "我明白你的意思", "docs": 4, "tot": 4, "ex": "I see what you mean.", "src": "剑14 T4"}, {"cat": "同意/反对（观点）", "p": "not necessarily", "zh": "不一定", "docs": 4, "tot": 4, "ex": "They're not necessarily cheaper than ordinary holidays, often the opposite, in fact.", "src": "剑12 T3"}, {"cat": "确认/回应", "p": "yes", "zh": "是的", "docs": 40, "tot": 325, "ex": "Yes, there's a beautiful one just outside the town, and that'll : "剑12 T1"}, {"cat": "口语填充（可忽略）", "p": "oh", "zh": "哦", "docs": 39, "tot": 145, "ex": "Oh, so why don't we use that as the topic, and include some quotations from the novel?", "src": "剑15 T2"}, {"cat": "口语填充（可忽略）", "p": "you know", "zh": "你知道", "docs": 26, "tot": 46, "ex": "You know some of the books my grandfather's given me are like that already.", "src": "剑19 T4"}, {"cat": "口语填充（可忽略）", "p": "sort of", "zh": "有点", "docs": 25, "tot": 36, "ex": "Let's make a list of possible things we could ask about, then work out some sort of structure.", "src": "剑12 T1"}, {"cat": "口语填充（可忽略）", "p": "mmm", "zh": "嗯", "docs": 21, "tot": 38, "ex": "Mmm - I think the teacher could have increased the level of difficulty for her.", "src": "剑18 T4"}, {"cat": "口语填充（可忽略）", "p": "kind of", "zh": "有点", "docs": 19, "tot": 27, "ex": "Now, they do have some quite specific requirements for the kind of person they're looking for.", "src": "剑18 T2"}, {"cat": "口语填充（可忽略）", "p": "hmm", "zh": "嗯", "docs": 10, "tot": 11, "ex": "If it's the one I am thinking of, hmm, I'd ignore it - it's more fantasy than reality.", "src": "剑12 T2"}, {"cat": "口语填充（可忽略）", "p": "er", "zh": "呃", "docs": 6, "tot": 9, "ex": "Er … my grandfather was a doctor before he retired, and I just based it on him.", "src": "剑10 T3"}, {"cat": "口语填充（可忽略）", "p": "um", "zh": "嗯", "docs": 5, "tot": 5, "ex": "Um … you just need to wear a white T-shirt and black trousers, it says here.", "src": "剑18 T2"}, {"cat": "口语填充（可忽略）", "p": "erm", "zh": "呃", "docs": 4, "tot": 4, "ex": "Erm … hello Professor, I'm John Wishart.", "src": "剑10 T1"}], "tips": {"纠错/改口（陷阱）": "说完先别写：后面常常推翻前一个信息，正确答案在改口之后。", "转折/对比": "转折后才是重点，答案多在 but / however 之后。", "顺序/开头": "提示下一个要点要来了，用来跟上题目顺序、防止跟丢。", "因果": "原因、目的常对应选择题和填空中的“why / for”。", "举例/解释": "例子本身常是答案，或是同义替换的线索。", "强调/重点": "说话人强调的信息基本必考，尤其 Part 2 的注意事项。", "转换话题/段落": "Part 3–4 换话题的标志，听到就看下一组题。", "总结": "收尾概括，常对应主旨题。", "数字/时间提示": "数字和数量填空的定位词，注意 more / less / at least 的修饰。", "同意/反对（观点）": "Part 3 选择、配对题的关键：听清谁同意、谁反对，I suppose / I'm not sure 往往是保留意见。", "确认/回应": "Part 1 常见：说完 That's right / Yes 往往是确认答案，Sorry? / How do you spell 后面紧跟拼写。", "口语填充（可忽略）": "没有信息量，听到可以跳过，别被打断节奏；后面紧跟的才是内容。"}, "cats": ["纠错/改口（陷阱）", "转折/对比", "强调/重点", "顺序/开头", "因果", "举例/解释", "转换话题/段落", "数字/时间提示", "总结", "同意/反对（观点）", "确认/回应", "口语填充（可忽略）"], "meta": {"ans_tests": 76, "tr_tests": 40}}</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('ldata').textContent);
const W=D.words, S=D.signposts;
const VAR={harbour:'harbor',colour:'color',litre:'liter',centre:'center',theatre:'theater',behaviour:'behavior',organise:'organize',programme:'program',jewellery:'jewelry',travelling:'traveling'};
const CAP=new Set('monday tuesday wednesday thursday friday saturday sunday january february march april may june july august september october november december english africa'.split());
const disp=w=>CAP.has(w)?w[0].toUpperCase()+w.slice(1):w;
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let done=new Set(LS.get('lst.done',[])), wrong=LS.get('lst.wrong',{}); // word -> streak needed
let st={tab:'words',mode:'list',tier:2,dflt:'all',q:''};
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- audio ----------
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-GB/i.test(v.lang)&&/female|serena|kate|libby|sonia|google uk/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let rate=LS.get('lst.rate',0.9);
function tts(text,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';if(voice)u.voice=voice;u.rate=r||rate;speechSynthesis.speak(u);}
let au=null;
function say(word){
  try{ if(au){au.pause();}
    au=new Audio('https://dict.youdao.com/dictvoice?type=1&audio='+encodeURIComponent(word));
    au.playbackRate=Math.max(.6,Math.min(1.2,rate+0.1));
    let ok=false; au.onplaying=()=>ok=true;
    au.onerror=()=>{if(!ok)tts(word)};
    au.play().catch(()=>tts(word));
  }catch(e){tts(word)}
}

// ---------- intro ----------
const nTests=D.meta.ans_tests;
const t4=W.filter(x=>x.n>=4).length,t3=W.filter(x=>x.n===3).length,t2=W.filter(x=>x.n===2).length,t1=W.filter(x=>x.n===1).length,HI=W.length-t1;
$('#introW').innerHTML=`词表直接统计自<b>剑桥雅思 4–20 共 ${nTests} 套听力的官方答案</b>：在 <b>至少 2 套不同的题</b>里当过答案的高频词 <b>${HI}</b> 个（≥4 套核心词 <b>${t4}</b>，3 套 <b>${t3}</b>，2 套 <b>${t2}</b>），另有只考过 1 次的<b>扩展词 ${t1}</b> 个。两部分合起来就是剑桥真题考过的全部拼写答案词（单复数合并；人名、编号、选项字母和纯数字不收）。默认只显示高频词，选「全部（含扩展）」看全部。卡片右上角是出现套数，下方是出处。英美拼写都算对，听写里两种都接受。`;
$('#introS').innerHTML=`线索词按<b>剑桥雅思 10–19 共 40 套听力原文</b>逐个统计：先列了约 300 个候选（包括 but、so、OK、right、yes 这类最基础的词），再逐个到原文里数“40 套里有几套出现”，只保留至少 4 套出现的，共 <b>${S.length}</b> 个，例句都摘自真题原文。so、OK、well 只算句首用法，about、over 等只算后面跟数字的用法。moreover、to sum up、on second thoughts 这些教材常见说法在真题原文里几乎为 0，所以没收。真正高频的改口词是 <b>actually、in fact、sorry、I mean</b>。`;
$('#cW').textContent=HI+'+'+t1;$('#cS').textContent=S.length;
function upCounts(){$('#cX').textContent=Object.keys(wrong).length;}
upCounts();

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));['words','sig','wrong'].forEach(t=>$('#p-'+t).classList.toggle('hide',t!==st.tab));if(st.tab==='wrong')renderWrong();});
function segBind(id,key,attr,cb){document.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll(id+' button').forEach(x=>x.classList.toggle('on',x===b));st[key]=isNaN(+b.dataset[attr])?b.dataset[attr]:+b.dataset[attr];cb();});}
segBind('#tierSeg','tier','t',render);segBind('#doneSeg','dflt','d',render);
segBind('#modeSeg','mode','m',()=>{$('#listView').classList.toggle('hide',st.mode!=='list');$('#dictView').classList.toggle('hide',st.mode!=='dict');if(st.mode==='dict')dictSetup($('#dictView'),()=>filtered());else render();});
$('#q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render();};
let hz=LS.get('lst.hz',false);
function applyZh(){document.body.classList.toggle('hidezh',hz);$('#zhBtn').classList.toggle('on',hz);$('#zhBtn').textContent=hz?'显示中文':'隐藏中文';}
$('#zhBtn').onclick=()=>{hz=!hz;LS.set('lst.hz',hz);applyZh();};applyZh();

function filtered(){return W.filter(x=>(st.tier==='1x'?x.n===1:x.n>=st.tier)&&(st.dflt==='all'||(st.dflt==='done')===done.has(x.w))&&(!st.q||x.w.includes(st.q)||x.zh.includes(st.q)));}
function card(x){
  const alt=VAR[x.w]?`<div class="alt">美式也对：${VAR[x.w]}</div>`:'';
  const forms=x.acc.filter(f=>f!==x.w&&f!==VAR[x.w]);
  const fm=forms.length?`<div class="alt">真题里也考过：${forms.map(esc).join(', ')}</div>`:'';
  const src=x.src.slice(0,4).join('、')+(x.src.length>4?` 等 ${x.src.length} 套`:'');
  const tc=x.n>=4?'t4':x.n===3?'t3':'';const nl=x.n===1?'扩展':x.n+' 套';
  return `<div class="card${done.has(x.w)?' done':''}" data-w="${esc(x.w)}"><div class="top"><span class="w">${esc(disp(x.w))}</span><span class="n ${tc}">${nl}</span></div><div class="zh">${esc(x.zh)}</div>${alt}${fm}<div class="src">${src}</div><div class="acts"><button class="ib" data-a="say">🔊 发音</button><button class="ib" data-a="done">${done.has(x.w)?'取消掌握':'✓ 已掌握'}</button></div></div>`;
}
function bindCards(root,after){root.querySelectorAll('.card').forEach(c=>c.onclick=e=>{const a=e.target.dataset.a;if(!a)return;const w=c.dataset.w;if(a==='say')say(w);if(a==='done'){done.has(w)?done.delete(w):done.add(w);LS.set('lst.done',[...done]);after();}});}
function render(){const L=filtered();$('#cnt').textContent=`${L.length} 个 · 已掌握 ${W.filter(x=>done.has(x.w)).length}/${W.length}`;const g=$('#grid');g.innerHTML=L.length?L.map(card).join(''):'<div class="empty">没有符合条件的词</div>';bindCards(g,render);}
render();

// ---------- dictation ----------
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ');}
function accepts(x){const s=new Set([x.w]);if(VAR[x.w])s.add(VAR[x.w]);return s;}
function diffHtml(a,b){ // a typed, b right: simple char LCS markup
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,o='';while(i<n&&j<m){if(a[i]===b[j]){o+=esc(b[j]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){o+='<del>'+esc(a[i])+'</del>';i++;}else{o+='<ins>'+esc(b[j])+'</ins>';j++;}}
  while(i<n){o+='<del>'+esc(a[i++])+'</del>';}while(j<m){o+='<ins>'+esc(b[j++])+'</ins>';}return o;}
function dictSetup(box,getPool,fromWrong){
  const pool=getPool();
  box.innerHTML=`<div class="dict"><h2>${fromWrong?'错词本听写':'听写'}</h2>
   <div class="row"><span class="lbl">范围</span><span>${fromWrong?'错词本':'当前筛选'}：${pool.length} 个词</span></div>
   <div class="row"><span class="lbl">数量</span><div class="seg" id="nSeg"><button data-n="20" class="on">20</button><button data-n="50">50</button><button data-n="0">全部</button></div>
   <span class="lbl">语速</span><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${rate}" style="width:110px"></div>
   <div class="row"><button class="pbtn" id="go">开始听写（乱序）</button></div>
   <div class="hint lbl" style="margin-top:8px"><kbd>Enter</kbd> 提交 / 下一个　<kbd>Ctrl</kbd> 或 <kbd>Tab</kbd> 再听一遍　<kbd>Esc</kbd> 跳过并记错</div></div>`;
  let N=20;box.querySelectorAll('#nSeg button').forEach(b=>b.onclick=()=>{box.querySelectorAll('#nSeg button').forEach(x=>x.classList.toggle('on',x===b));N=+b.dataset.n;});
  box.querySelector('#rate').oninput=e=>{rate=+e.target.value;LS.set('lst.rate',rate);};
  box.querySelector('#go').onclick=()=>{if(!pool.length)return;run(box,shuffle(pool).slice(0,N||pool.length),fromWrong,()=>dictSetup(box,getPool,fromWrong));};
}
function run(box,list,fromWrong,again){
  let i=0,res=[],answered=false;
  box.innerHTML=`<div class="dict"><div class="row"><b id="pos"></b><span class="spacer"></span><button class="pbtn ghost" id="rep">🔊 再听</button><button class="pbtn ghost" id="hint">提示首字母</button><button class="pbtn ghost" id="quit">结束</button></div>
   <div class="meter"><i id="mt"></i></div>
   <input class="big" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="听到什么就拼什么">
   <div class="fb" id="fb"></div></div>`;
  const inp=box.querySelector('#inp'),fb=box.querySelector('#fb');
  function show(){const x=list[i];answered=false;inp.value='';inp.className='big';fb.innerHTML='<span class="lbl">'+(x.n>=4?'核心词':'')+'</span>';box.querySelector('#pos').textContent=`${i+1} / ${list.length}`;box.querySelector('#mt').style.width=(i/list.length*100)+'%';inp.focus();setTimeout(()=>say(x.w),150);}
  function judge(skip){const x=list[i];const v=norm(inp.value);const ok=!skip&&accepts(x).has(v);answered=true;res.push({x,ok,v});
    inp.className='big '+(ok?'ok':'bad');
    const right=`<span class="right">${esc(disp(x.w))}</span>${VAR[x.w]?` <span class="lbl">（${VAR[x.w]} 也对）</span>`:''}　<span class="zh">${esc(x.zh)}</span>`;
    fb.innerHTML=ok?`✅ ${right}`:`❌ ${v?`<span class="diff">${diffHtml(v,x.w)}</span>　→　`:''}${right}<div class="lbl">出处：${x.src.slice(0,3).join('、')}</div>`;
    if(ok){ if(wrong[x.w]!=null){wrong[x.w]--; if(wrong[x.w]<=0)delete wrong[x.w];} }
    else{ wrong[x.w]=3; }
    LS.set('lst.wrong',wrong);upCounts();
    if(ok)setTimeout(()=>{if(answered&&res.length===i+1)next();},700);
  }
  function next(){i++;if(i>=list.length)return finish();show();}
  function finish(){const ok=res.filter(r=>r.ok).length;box.querySelector('#mt').style.width='100%';
    box.querySelector('.dict').innerHTML=`<h2>本轮 ${ok} / ${res.length} 正确</h2><div class="sum"><div class="lbl">拼错的词（已进错词本）</div><div class="wl">${res.filter(r=>!r.ok).map(r=>`<span class="chip bad">${esc(disp(r.x.w))}</span>`).join('')||'<span class="lbl">全对 🎉</span>'}</div></div><div class="row" style="margin-top:16px"><button class="pbtn" id="ag">再来一轮</button></div>`;
    box.querySelector('#ag').onclick=again; if(fromWrong)renderWrong(true);}
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();if(!answered)judge(false);else next();}
    else if(e.key==='Tab'||e.key==='Control'){e.preventDefault();say(list[i].w);}
    else if(e.key==='Escape'){e.preventDefault();if(!answered)judge(true);}
  };
  box.querySelector('#rep').onclick=()=>{say(list[i].w);inp.focus();};
  box.querySelector('#hint').onclick=()=>{const w=list[i].w;inp.placeholder=w[0]+' _ '.repeat(w.length-1).trim()+`（${w.length} 个字母）`;inp.focus();};
  box.querySelector('#quit').onclick=finish;
  show();
}

// ---------- wrong book ----------
function wrongList(){return W.filter(x=>wrong[x.w]!=null);}
function renderWrong(keepDict){
  const L=wrongList();$('#wcnt').textContent=`${L.length} 个词`;
  $('#wgrid').innerHTML=L.length?L.map(x=>card(x).replace('<div class="src">',`<div class="alt">还需连续拼对 ${wrong[x.w]} 次</div><div class="src">`)).join(''):'<div class="empty">错词本是空的</div>';
  bindCards($('#wgrid'),()=>renderWrong());
  if(!keepDict){$('#wdict').classList.add('hide');$('#wgrid').classList.remove('hide');}
}
$('#wrongStart').onclick=()=>{if(!wrongList().length)return;$('#wgrid').classList.add('hide');$('#wdict').classList.remove('hide');dictSetup($('#wdict'),wrongList,true);};
$('#wrongClear').onclick=()=>{if(confirm('清空错词本？')){wrong={};LS.set('lst.wrong',wrong);upCounts();renderWrong();}};

// ---------- signposts ----------
function hl(ex,p){const re=new RegExp('(^|[^A-Za-z])('+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’]")+')(?![A-Za-z])','i');return esc(ex).replace(new RegExp(re.source,'i'),(m,a,b)=>a+'<mark>'+b+'</mark>');}
function renderSig(){
  const out=D.cats.map(c=>{const items=S.filter(s=>s.cat===c);if(!items.length)return'';
    return `<div class="cat${c.includes('陷阱')?' trap':''}"><h3>${c}<small>${items.length} 个</small></h3><div class="tip">${D.tips[c]||''}</div></div><div class="sgrid">${items.map(s=>`<div class="sp"><div class="h"><span class="p">${esc(s.p)}</span><span class="szh">${esc(s.zh)}</span><span class="f">40 套中 ${s.docs} 套 · 共 ${s.tot} 次</span></div><div class="fbar"><i style="width:${s.docs/40*100}%"></i></div><div class="ex">${hl(s.ex,s.p)}</div><div class="es"><button class="ib" data-ex="${esc(s.ex)}">🔊 听例句</button>${s.src}</div></div>`).join('')}</div>`;}).join('');
  $('#sigList').innerHTML=out;
  $('#sigList').querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>tts(b.dataset.ex,Math.min(1,rate+0.05)));
}
renderSig();
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='h'||e.key==='H'){hz=!hz;LS.set('lst.hz',hz);applyZh();}});
})();
</script>
